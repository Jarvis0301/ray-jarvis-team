<!DOCTYPE html>
<html lang="zh-TW" data-bs-theme="dark-blue">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>活動資訊 | 榮祥團隊 - 團隊版</title>
		
        <script src="../assets/js/auth-guard.js"></script>
        
        <script src="../assets/js/vendor-loader.js"></script>

        <script src="../assets/js/common.js"></script>

        <link rel="stylesheet" href="../assets/css/common.css">

        <script src="./js/brd-events.js" defer></script>

        <link rel="stylesheet" href="./css/brd-events.css">
	</head>

	<body>

		<main class="container-fluid p-3 p-md-4">

			<div class="filter-panel">
				<div class="search-box">
					<i class="fa-solid fa-magnifying-glass"></i>
					<input type="text" id="search-input" placeholder="搜尋活動主題、場地、地址或表演藝人...">
				</div>

				<div class="filter-group-title"><i class="fa-solid fa-layer-group me-1"></i> 活動類型</div>
				<div class="pill-container" id="type-pills">
					<span class="filter-pill active" data-filter-type="ALL">全部類型</span>
				</div>

				<div class="filter-group-title"><i class="fa-solid fa-map-location-dot me-1"></i> 活動地區</div>
				<div class="pill-container" id="region-pills">
					<span class="filter-pill active" data-filter-region="ALL">全部地區</span>
				</div>
			</div>

			<div id="loading-spinner" class="text-center col-12">
				<div class="spinner-border mb-3" role="status" style="width: 2.5rem; height: 2.5rem;">
					<span class="visually-hidden">Loading...</span>
				</div>
				<div>活動資訊同步中...</div>
			</div>

			<div id="active-events-section" class="d-none">
				<div class="section-title">
					<i class="fa-solid fa-calendar-stars" style="color: var(--uvaco-blue);"></i> 近期公開活動 (<span id="active-count">0</span>)
				</div>
				<div id="active-events-container"></div>
			</div>

			<div id="no-events-found" class="d-none text-center my-3">
				<i class="fa-regular fa-calendar-xmark me-2"></i> 查無符合條件的活動，請嘗試調整搜尋關鍵字或選擇其他類別。
			</div>

			<div id="expired-events-section" class="d-none mt-4">
				<div class="accordion custom-accordion" id="expiredAccordion">
					<div class="accordion-item">
						<h2 class="accordion-header" id="headingExpired">
							<button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseExpired" aria-expanded="false" aria-controls="collapseExpired">
								<i class="fa-solid fa-clock-rotate-left me-2"></i> 往期活動紀錄與回顧 (<span id="expired-count">0</span>)
							</button>
						</h2>
						<div id="collapseExpired" class="accordion-collapse collapse" aria-labelledby="headingExpired" data-bs-parent="#expiredAccordion">
							<div class="accordion-body">
								<div id="expired-events-container"></div>
							</div>
						</div>
					</div>
				</div>
			</div>

		</div>

	</body>
</html>
