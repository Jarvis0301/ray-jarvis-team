<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>葡眾數據系統 - Google 身份驗證安全診斷與測試</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --bg-primary: #121212;
            --bg-secondary: #1e1e2e;
            --bg-card: #252538;
            --text-main: #e0e0e0;
            --text-muted: #a0a0b0;
            --accent-color: #7269ef;
            --border-color: #32324d;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 100%;
        }

        .status-box {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
        }
    </style>
</head>
<body>

    <div class="container p-3">
        <div class="card p-4 mx-auto">
            <div class="text-center mb-4">
                <h3 class="text-info font-weight-bold">
                    <i class="fas fa-shield-cat"></i> 身分驗證資安測試
                </h3>
                <p class="text-muted small mt-2">使用 Google Identity Services (GIS) 非敏感權限模式</p>
            </div>

            <div class="status-box mb-4">
                <h6 class="text-warning">
                    <i class="fas fa-circle-exclamation"></i> 常見封鎖排除提醒：
                </h6>
                <ul class="text-muted small mb-0 ps-3">
                    <li>請確認 GCP OAuth 同意畫面的發布狀態。</li>
                    <li>若為測試中 (Testing)，請務必將您的 Gmail 加入「測試使用者」。</li>
                    <li>本頁面僅請求 basic profile/email，不觸及敏感資料。</li>
                </ul>
            </div>

            <div class="d-flex justify-content-center mb-3">
                <div id="g_id_onload_button"></div>
            </div>

            <div id="loadingSpinner" class="text-center my-3 d-none">
                <div class="spinner-border text-info" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="text-info mt-2 small">正在進行安全解密與白名單驗證...</p>
            </div>

            <div id="resultMessage" class="alert d-none mt-3 text-center" role="alert"></div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // 全域設定
        const CONFIG = {
            // 請替換為您在 GCP 設定好的 OAuth 2.0 Client ID
            googleClientId: 'YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com'
        };

        $(document).ready(function() {
            // 初始化 Google Identity Services
            window.onload = function() {
                if (window.google) {
                    google.accounts.id.initialize({
                        client_id: CONFIG.googleClientId,
                        callback: handleCredentialResponse,
                        // 確保僅使用 OpenID/Email/Profile，避免觸發敏感權限封鎖
                        auto_select: false
                    });

                    google.accounts.id.renderButton(
                        document.getElementById("g_id_onload_button"),
                        { 
                            theme: "filled_blue", 
                            size: "large", 
                            type: "standard", 
                            shape: "rectangular",
                            text: "signin_with"
                        }
                    );
                }
            };
        });

        // 處理 Google 登入成功後回傳的 ID Token (JWT)
        function handleCredentialResponse(response) {
            $('#loadingSpinner').removeClass('d-none');
            $('#resultMessage').addClass('d-none');

            const idToken = response.credential;

            // 解密 JWT 載荷（僅用於前端展示，安全驗證仍須送往 GAS 後端）
            const base64Url = idToken.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));

            const payload = JSON.parse(jsonPayload);

            setTimeout(() => {
                $('#loadingSpinner').addClass('d-none');
                $('#resultMessage')
                    .removeClass('d-none alert-danger')
                    .addClass('alert-success')
                    .html(`<i class="fas fa-circle-check"></i> 成功取得認證！<br>帳號：<strong>${payload.email}</strong>`);
            }, 1000);
        }
    </script>
</body>
</html>
