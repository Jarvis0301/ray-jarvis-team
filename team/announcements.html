<!DOCTYPE html>
<html lang="zh-TW" data-bs-theme="dark-blue">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>公司公告</title>
		
        <script src="../assets/js/auth-guard.js"></script>
        
        <script src="../assets/js/vendor-loader.js"></script>

        <script src="../assets/js/common.js"></script>

        <link rel="stylesheet" href="../assets/css/common.css">

        <script src="./js/announcements.js" defer></script>

        <link rel="stylesheet" href="./css/announcements.css">
	</head>

	<body>
		<div class="announcement-container-wrapper">
			<div class="control-toolbar d-flex flex-column flex-sm-row justify-content-between align-items-center gap-3">
				<ul class="nav nav-pills nav-pills-custom gap-2 w-100 w-sm-auto" id="region-tabs" role="tablist">
					<li class="nav-item" role="presentation">
						<button class="nav-link active" id="tab-taiwan" data-region="台灣" type="button" role="tab">
							<i class="fa-solid fa-location-dot me-1"></i> 台灣公告
						</button>
					</li>
					<li class="nav-item" role="presentation">
						<button class="nav-link" id="tab-malaysia" data-region="馬來西亞" type="button" role="tab">
							<i class="fa-solid fa-earth-asia me-1"></i> 馬來西亞公告
						</button>
					</li>
				</ul>

				<div class="search-box-group input-group w-100 w-sm-auto" style="max-width: 320px;">
					<span class="input-group-text"><i class="fa-solid fa-magnifying-glass"></i></span>
					<input type="text" id="announcement-search" class="form-control" placeholder="搜尋公告標題或分類..." aria-label="搜尋公告">
				</div>
			</div>

			<div id="announcement-container">
				<div id="loading-spinner" class="text-center col-12">
					<div class="spinner-border mb-3" role="status" style="width: 2.5rem; height: 2.5rem;">
						<span class="visually-hidden">Loading...</span>
					</div>
					<div class="fs-6">最新公告同步中...</div>
				</div>
			</div>
		</div>
	</body>
</html>
