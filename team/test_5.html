<!DOCTYPE html>
<html lang="zh-TW" data-bs-theme="dark-blue">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訂購試算小工具 | 榮祥葡眾團隊戰情室</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/2.0.8/css/dataTables.bootstrap5.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b132b;
            --bg-card: #132238;
            --bg-card-hover: #1c2d4a;
            --border-color: rgba(56, 189, 248, 0.2);
            --accent-blue: #38bdf8;
            --accent-cyan: #7dd3fc;
            --accent-gold: #facc15;
            --accent-green: #34d399;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            padding-bottom: 2rem;
        }

        /* 頂部戰情列 */
        .navbar-custom {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .brand-logo {
            color: var(--accent-blue);
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: 0.5px;
        }

        /* 模組卡片樣式 */
        .card-custom {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: border-color 0.3s ease;
        }

        .card-custom:hover {
            border-color: rgba(56, 189, 248, 0.4);
        }

        .card-header-custom {
            background-color: rgba(11, 19, 43, 0.5);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 1.25rem;
            font-weight: 600;
            color: var(--accent-cyan);
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
        }

        /* 核心 KPI 數據卡 */
        .kpi-card {
            background: linear-gradient(135deg, rgba(19, 34, 56, 0.9), rgba(28, 45, 74, 0.9));
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1rem;
            text-align: center;
        }

        .kpi-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
        }

        .kpi-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .kpi-value.gold {
            color: var(--accent-gold);
        }

        .kpi-value.green {
            color: var(--accent-green);
        }

        /* 免運進度條 */
        .progress-custom {
            height: 12px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-bar-custom {
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-green));
            transition: width 0.4s ease;
        }

        /* 產品選擇表格暗黑樣式 */
        .table-dark-custom {
            --bs-table-bg: transparent;
            --bs-table-color: var(--text-main);
            margin-bottom: 0;
        }

        .table-dark-custom th {
            color: var(--accent-cyan);
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .table-dark-custom td {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            vertical-align: middle;
            font-size: 0.9rem;
        }

        /* DataTables 暗黑主題覆蓋 */
        .dataTables_wrapper .dataTables_length,
        .dataTables_wrapper .dataTables_filter,
        .dataTables_wrapper .dataTables_info,
        .dataTables_wrapper .dataTables_paginate {
            color: var(--text-muted) !important;
            margin-bottom: 0.75rem;
            font-size: 0.85rem;
        }

        .dataTables_wrapper .dataTables_filter input,
        .dataTables_wrapper .dataTables_length select {
            background-color: rgba(11, 19, 43, 0.8) !important;
            border: 1px solid var(--border-color) !important;
            color: var(--text-main) !important;
            border-radius: 6px;
            padding: 0.375rem 0.75rem;
        }

        .dataTables_wrapper .dataTables_filter input:focus {
            border-color: var(--accent-blue) !important;
            outline: none;
        }

        .page-item.active .page-link {
            background-color: var(--accent-blue) !important;
            border-color: var(--accent-blue) !important;
            color: #000 !important;
            font-weight: 600;
        }

        .page-link {
            background-color: var(--bg-card) !important;
            border-color: var(--border-color) !important;
            color: var(--text-main) !important;
        }

        /* 數量控制器 */
        .qty-control {
            display: flex;
            align-items: center;
            width: 110px;
        }

        .qty-btn {
            background-color: rgba(56, 189, 248, 0.15);
            border: 1px solid var(--border-color);
            color: var(--accent-blue);
            width: 28px;
            height: 28px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .qty-btn:hover {
            background-color: var(--accent-blue);
            color: #000;
        }

        .qty-input {
            width: 44px;
            background-color: rgba(11, 19, 43, 0.8);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            text-align: center;
            font-weight: 600;
            border-radius: 4px;
            margin: 0 4px;
            padding: 2px 0;
            font-size: 0.85rem;
        }

        /* 分類過濾標籤 */
        .filter-btn {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            border-radius: 20px;
            padding: 0.35rem 0.9rem;
            font-size: 0.85rem;
            transition: all 0.2s;
            margin-right: 0.4rem;
            margin-bottom: 0.5rem;
        }

        .filter-btn:hover, .filter-btn.active {
            background-color: var(--accent-blue);
            color: #000;
            font-weight: 600;
            border-color: var(--accent-blue);
        }

        /* 右側結算清單區 */
        .order-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.6rem 0;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
            font-size: 0.88rem;
        }

        .order-item-name {
            font-weight: 500;
            color: var(--text-main);
        }

        .order-item-sub {
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .order-item-price {
            text-align: right;
            font-weight: 600;
            color: var(--accent-cyan);
        }

        /* 下拉選單深色修正 */
        .form-select-custom {
            background-color: rgba(11, 19, 43, 0.9);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
        }

        .form-select-custom:focus {
            background-color: rgba(11, 19, 43, 1);
            color: var(--text-main);
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25);
        }

        /* 綠色與藍色按鈕 */
        .btn-accent {
            background-color: var(--accent-blue);
            color: #0b132b;
            font-weight: 600;
            border: none;
            transition: all 0.2s;
        }

        .btn-accent:hover {
            background-color: var(--accent-cyan);
            color: #0b132b;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        .btn-line {
            background-color: #06c755;
            color: #ffffff;
            font-weight: 600;
            border: none;
        }

        .btn-line:hover {
            background-color: #05b34c;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(6, 199, 85, 0.4);
        }

        /* Modal 深色客製化 */
        .modal-content-custom {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 12px;
        }

        .modal-header-custom {
            border-bottom: 1px solid var(--border-color);
        }

        .modal-footer-custom {
            border-top: 1px solid var(--border-color);
        }

        .line-text-area {
            background-color: #0b132b;
            border: 1px solid var(--border-color);
            color: var(--accent-cyan);
            font-family: monospace;
            font-size: 0.9rem;
            border-radius: 8px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-custom mb-4">
        <div class="container-fluid px-4">
            <a class="navbar-brand brand-logo" href="#">
                <i class="fa-solid fa-calculator"></i> 榮祥葡眾團隊 | 訂購試算樞紐
            </a>
            <div class="d-flex align-items-center">

    <div class="container-fluid px-4">

            <div class="col-6 col-md-3">

            <div class="col-6 col-md-3">
                <div class="kpi-card">

                    <div class="kpi-value gold" id="kpiTotalSV">0</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="kpi-card">
                    <div class="kpi-label"><i class="fa-solid fa-hand-holding-dollar"></i> 預估現金回饋 (NT$)</div>
                    <div class="kpi-value green" id="kpiRebateNT">0</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="kpi-card">
                    <div class="kpi-label"><i class="fa-solid fa-truck-fast"></i> 免運費門檻進度</div>
                    <div class="kpi-value" id="kpiShippingStatus" style="font-size: 1.1rem; padding-top: 0.3rem;">還差 NT$ 5,000</div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-lg-8">
                <div class="card-custom">
                    <div class="card-header-custom d-flex justify-content-between align-items-center">
                        <span><i class="fa-solid fa-boxes-stacked"></i> 葡眾產品目錄選擇</span>
                        <span class="text-muted fs-7" id="productCountBadge">載入中...</span>
                    </div>
                    <div class="card-body p-3">
                        <div class="mb-3" id="categoryFilterContainer">
                            <button class="filter-btn active" data-category="ALL">
                                <i class="fa-solid fa-border-all"></i> 全部品項
                            </button>
                            <button class="filter-btn" data-category="保健食品">
                                <i class="fa-solid fa-prescription-bottle-medical"></i> 保健食品
                            </button>
                            <button class="filter-btn" data-category="個人保養">
                                <i class="fa-solid fa-sparkles"></i> 個人保養
                            </button>
                            <button class="filter-btn" data-category="清潔用品">
                                <i class="fa-solid fa-pump-soap"></i> 清潔用品
                            </button>
                        </div>

                        <div class="table-responsive">
                            <table id="productTable" class="table table-dark-custom w-100">
                                <thead>
                                    <tr>
                                        <th>產品名稱</th>
                                        <th class="text-center">系列</th>
                                        <th class="text-end">單價 (NT$)</th>
                                        <th class="text-end">積分 (SV)</th>
                                        <th class="text-center" style="width: 120px;">訂購數量</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    </tbody>
                            </table>

            <div class="col-lg-4">
                <div class="card-custom mb-4">
                    <div class="card-header-custom">

                <div class="card-custom mb-4">

                    <div class="card-body p-3">

                                <i class="fa-solid fa-basket-shopping fs-3 mb-2 d-block"></i>
                                尚未挑選任何產品，請從左側列表新增
                            </div>
                        </div>

                        <hr class="border-secondary my-3">

                        <div class="d-grid gap-2">
                            <button class="btn btn-line btn-lg" id="btnGenerateLineText">
                                <i class="fa-brands fa-line"></i> 一鍵生成 LINE 訂單文字
                            </button>

                    </div>
                </div>

                <div class="card-custom">
                    <div class="card-header-custom">
                        <i class="fa-solid fa-chart-pie"></i> 訂購產品分類 SV 占比
                    </div>
                    <div class="card-body p-3">

    <div class="modal fade" id="lineModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-content-custom">
                <div class="modal-header modal-header-custom">
                    <h5 class="modal-title"><i class="fa-brands fa-line text-success"></i> LINE 訂單格式已生成</h5>

                    <p class="small text-muted mb-2">請點擊下方按鈕複製內容，直接貼上至 LINE 進行報單集單：</p>

                </div>

                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">關閉</button>
                    <button type="button" class="btn btn-accent" id="btnCopyLineText">
                        <i class="fa-solid fa-copy"></i> 複製剪貼簿
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.datatables.net/2.0.8/js/dataTables.js"></script>
    <script src="https://cdn.datatables.net/2.0.8/js/dataTables.bootstrap5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        // ==========================================
        // 1. 全域變數與備援數據 (Fallback Data)
        // ==========================================
        const FREE_SHIPPING_THRESHOLD = 5000;
        let dataTableInstance = null;
        let svChartInstance = null;
        let globalProducts = [];
        let orderCart = {}; // 格式: { productId: { name, price, sv, category, qty } }

        // 在地化備援產品數據（當 Google 試算表無法連線時）
        const fallbackProductList = [
            { id: "P001", name: "康爾喜 (Lacto-Joy) 益生菌", category: "保健食品", price: 1764, sv: 1510 },
            { id: "P002", name: "995 超級營養液 (24瓶)", category: "保健食品", price: 5544, sv: 4800 },
            { id: "P003", name: "樟芝益菌絲體生技飲品", category: "保健食品", price: 5544, sv: 4800 },
            { id: "P004", name: "迪斯尼膠囊 (衛傑升級)", category: "保健食品", price: 1764, sv: 1510 },
            { id: "P005", name: "百克斯 (Bikes) 膠囊", category: "保健食品", price: 1470, sv: 1260 },
            { id: "P006", name: "愛益 (I-Yi) 膠囊", category: "保健食品", price: 1470, sv: 1260 },
            { id: "P007", name: "和悅軟膠囊 (Q10/魚油)", category: "保健食品", price: 2205, sv: 1890 },
            { id: "P008", name: "雅霓潤膚乳液", category: "個人保養", price: 840, sv: 720 },
            { id: "P009", name: "活英華精華液", category: "個人保養", price: 2520, sv: 2160 },
            { id: "P010", name: "葡眾洗髮精 (溫和配方)", category: "清潔用品", price: 504, sv: 430 }
        ];

        // ==========================================
        // 2. 欄位解耦解析器 (Column Decoupling Engine)
        // ==========================================
        function decoupleSpreadsheetData(rawData) {
            if (!rawData || rawData.length === 0) return fallbackProductList;

            // 尋找符合條件的欄位名稱別名
            const sample = rawData[0];
            const keys = Object.keys(sample);

            function findKey(aliases) {
                return keys.find(k => {
                    const cleanKey = k.trim().toLowerCase();
                    return aliases.some(a => cleanKey.includes(a.toLowerCase()));
                });
            }

            const idKey = findKey(['編號', 'id', 'code', '代號']) || keys[0];
            const nameKey = findKey(['名稱', '品名', 'product', 'name']) || keys[1];
            const categoryKey = findKey(['系列', '分類', 'category', 'type']) || keys[2];
            const priceKey = findKey(['單價', '售價', 'price', 'nt']) || keys[3];
            const svKey = findKey(['sv', '積分', 'point', '點數']) || keys[4];

            return rawData.map((row, index) => {
                const price = parseInt(row[priceKey], 10) || 0;
                const sv = parseInt(row[svKey], 10) || 0;
                if (!row[nameKey] || price === 0) return null; // 排除無效行

                return {
                    id: row[idKey] ? String(row[idKey]).trim() : `P${index + 1}`,
                    name: String(row[nameKey]).trim(),
                    category: row[categoryKey] ? String(row[categoryKey]).trim() : '保健食品',
                    price: price,
                    sv: sv
                };
            }).filter(item => item !== null);
        }

        // ==========================================
        // 3. 資料載入與初始化
        // ==========================================
        function loadProductData() {
            // 嘗試載入 Google 試算表（範例 CSV URL，實務替換為實際 gviz URL）
            const googleSheetCsvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vDummyURL/pub?output=csv";

            Papa.parse(googleSheetCsvUrl, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    if (results.data && results.data.length > 0) {
                        globalProducts = decoupleSpreadsheetData(results.data);
                        $('#syncStatusBadge').html('<i class="fa-solid fa-cloud-check text-success"></i> 雲端同步完成');
                    } else {
                        useFallbackData();
                    }
                    renderProductTable(globalProducts);
                },
                error: function() {
                    useFallbackData();
                    renderProductTable(globalProducts);
                }
            });
        }

        function useFallbackData() {
            globalProducts = fallbackProductList;
            $('#syncStatusBadge').html('<i class="fa-solid fa-database text-warning"></i> 備援數據模式');
        }

        // ==========================================
        // 4. DataTables 渲染與事件綁定
        // ==========================================
        function renderProductTable(products) {
            const $tbody = $('#productTable tbody');
            $tbody.empty();

            products.forEach(p => {
                const qty = orderCart[p.id] ? orderCart[p.id].qty : 0;
                const rowHtml = `
                    <tr data-id="${p.id}" data-category="${p.category}">
                        <td class="fw-bold">${p.name}</td>
                        <td class="text-center"><span class="badge bg-secondary">${p.category}</span></td>
                        <td class="text-end fw-semibold text-info">NT$ ${p.price.toLocaleString()}</td>
                        <td class="text-end fw-semibold text-warning">${p.sv.toLocaleString()} SV</td>
                        <td class="text-center">
                            <div class="qty-control mx-auto">
                                <div class="qty-btn btn-minus" data-id="${p.id}"><i class="fa-solid fa-minus"></i></div>
                                <input type="text" class="qty-input" id="qty-${p.id}" value="${qty}" readonly>
                                <div class="qty-btn btn-plus" data-id="${p.id}"><i class="fa-solid fa-plus"></i></div>
                            </div>
                        </td>
                    </tr>
                `;
                $tbody.append(rowHtml);
            });

            $('#productCountBadge').text(`共 ${products.length} 項產品`);

            // 初始化 DataTable
            if (dataTableInstance) {
                dataTableInstance.destroy();
            }

            dataTableInstance = $('#productTable').DataTable({
                language: {
                    search: "_INPUT_",
                    searchPlaceholder: "搜尋產品名稱...",
                    lengthMenu: "顯示 _MENU_ 筆",
                    info: "顯示第 _START_ 至 _END_ 筆，共 _TOTAL_ 筆",
                    paginate: {
                        next: '<i class="fa-solid fa-chevron-right"></i>',
                        previous: '<i class="fa-solid fa-chevron-left"></i>'
                    }
                },
                pageLength: 8,
                lengthChange: false,
                ordering: true,
                order: [[1, 'asc']]
            });
        }

        // ==========================================
        // 5. 核心算計邏輯 (Calculator Logic Engine)
        // ==========================================
        function updateQuantity(productId, delta) {
            const product = globalProducts.find(p => p.id === productId);
            if (!product) return;

            if (!orderCart[productId]) {
                orderCart[productId] = { ...product, qty: 0 };
            }

            let newQty = orderCart[productId].qty + delta;
            if (newQty < 0) newQty = 0;

            orderCart[productId].qty = newQty;
            if (newQty === 0) {
                delete orderCart[productId];
            }

            // 同步 UI Input
            $(`#qty-${productId}`).val(newQty);

            // 重新計算總計
            recalculateTotals();
        }

        function recalculateTotals() {
            let totalNT = 0;
            let totalSV = 0;
            let categorySvMap = {};
            let selectedCount = 0;

            const $orderContainer = $('#orderItemsContainer');
            $orderContainer.empty();

            Object.values(orderCart).forEach(item => {
                if (item.qty > 0) {
                    const itemTotalNT = item.price * item.qty;
                    const itemTotalSV = item.sv * item.qty;

                    totalNT += itemTotalNT;
                    totalSV += itemTotalSV;
                    selectedCount += item.qty;

                    // 統計分類 SV
                    categorySvMap[item.category] = (categorySvMap[item.category] || 0) + itemTotalSV;

                    // 渲染右側訂單項目
                    const itemHtml = `
                        <div class="order-item-row">
                            <div>
                                <div class="order-item-name">${item.name}</div>
                                <div class="order-item-sub">NT$ ${item.price.toLocaleString()} × ${item.qty}</div>
                            </div>
                            <div class="order-item-price">
                                NT$ ${itemTotalNT.toLocaleString()}
                                <div class="text-warning small">${itemTotalSV.toLocaleString()} SV</div>
                            </div>
                        </div>
                    `;
                    $orderContainer.append(itemHtml);
                }
            });

            if (selectedCount === 0) {
                $orderContainer.html(`
                    <div class="text-center text-muted py-4 small">
                        <i class="fa-solid fa-basket-shopping fs-3 mb-2 d-block"></i>
                        尚未挑選任何產品，請從左側列表新增
                    </div>
                `);
            }

            // 計算現金回饋
            const rebateRate = parseFloat($('#rebateRankSelect').val()) || 0.20;
            const estimatedRebateNT = Math.round(totalSV * rebateRate);

            // 計算免運門檻
            const gapNT = FREE_SHIPPING_THRESHOLD - totalNT;
            const shippingPercent = Math.min(100, Math.round((totalNT / FREE_SHIPPING_THRESHOLD) * 100));

            // 更新 KPI UI
            $('#kpiTotalNT').text(totalNT.toLocaleString());
            $('#kpiTotalSV').text(totalSV.toLocaleString());
            $('#kpiRebateNT').text(estimatedRebateNT.toLocaleString());
            $('#selectedItemsCount').text(`${selectedCount} 件`);

            // 免運條更新
            $('#shippingProgressBar').css('width', `${shippingPercent}%`);
            $('#shippingPercentText').text(`${shippingPercent}%`);

            if (gapNT <= 0) {
                $('#kpiShippingStatus').html('<span class="text-success"><i class="fa-solid fa-circle-check"></i> 已達免運門檻</span>');
                $('#shippingGapNote').html('<span class="text-success"><i class="fa-solid fa-truck-fast"></i> 已享有全館免運費優惠</span>');
            } else {
                $('#kpiShippingStatus').text(`還差 NT$ ${gapNT.toLocaleString()}`);
                $('#shippingGapNote').text(`尚差 NT$ ${gapNT.toLocaleString()} 享免運`);
            }

            // 更新 Chart.js
            updateChart(categorySvMap);
        }

        // ==========================================
        // 6. Chart.js 圓餅圖初始化與動態更新
        // ==========================================
        function initChart() {
            const ctx = document.getElementById('svDoughnutChart').getContext('2d');
            svChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['保健食品', '個人保養', '清潔用品'],
                    datasets: [{
                        data: [0, 0, 0],
                        backgroundColor: ['#38bdf8', '#7dd3fc', '#facc15'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                color: '#94a3b8',
                                font: { size: 11 }
                            }
                        }
                    }
                }
            });
        }

        function updateChart(categorySvMap) {
            if (!svChartInstance) return;

            const categories = ['保健食品', '個人保養', '清潔用品'];
            const dataValues = categories.map(cat => categorySvMap[cat] || 0);

            svChartInstance.data.datasets[0].data = dataValues;
            svChartInstance.update();
        }

        // ==========================================
        // 7. LINE 訂單文字生成
        // ==========================================
        function generateLineOrderText() {
            const items = Object.values(orderCart).filter(i => i.qty > 0);
            if (items.length === 0) {
                alert('請先挑選產品後再生成訂單文字！');
                return;
            }

            const totalNT = $('#kpiTotalNT').text();
            const totalSV = $('#kpiTotalSV').text();
            const rebateNT = $('#kpiRebateNT').text();
            const rankName = $('#rebateRankSelect option:selected').text();

            let text = `📦【榮祥葡眾團隊 - 訂單試算明細】\n`;
            text += `--------------------------\n`;
            items.forEach((item, index) => {
                text += `${index + 1}. ${item.name}\n`;
                text += `   數量：${item.qty} 盒/瓶 | 小計：NT$ ${(item.price * item.qty).toLocaleString()}\n`;
            });
            text += `--------------------------\n`;
            text += `💰 訂購總金額：NT$ ${totalNT} 元\n`;
            text += `🏆 累積總積分：${totalSV} SV\n`;
            text += `🎖️ 算計職級：${rankName}\n`;
            text += `💵 預估現金回饋：NT$ ${rebateNT} 元\n`;
            text += `🚚 運費狀態：${parseInt(totalNT.replace(/,/g, ''), 10) >= 5000 ? '符合免運費條件' : '未達免運 (另計運費)'}\n`;
            text += `--------------------------\n`;
            text += `訂購日期：${new Date().toLocaleDateString('zh-TW')}\n`;

            $('#lineTextOutput').val(text);
            const modal = new bootstrap.Modal(document.getElementById('lineModal'));
            modal.show();
        }

        // ==========================================
        // 8. 事件監聽與 DOM 就緒初始化
        // ==========================================
        $(document).ready(function() {
            initChart();
            loadProductData();

            // 數量加減事件監聽 (委派)
            $(document).on('click', '.btn-plus', function() {
                const id = $(this).data('id');
                updateQuantity(id, 1);
            });

            $(document).on('click', '.btn-minus', function() {
                const id = $(this).data('id');
                updateQuantity(id, -1);
            });

            // 職級切換重新計算
            $('#rebateRankSelect').on('change', function() {
                recalculateTotals();
            });

            // 清空重算
            $('#btnResetAll').on('click', function() {
                if (confirm('確定要清空所有已挑選的產品數量嗎？')) {
                    orderCart = {};
                    $('.qty-input').val(0);
                    recalculateTotals();
                }
            });

            // 分類過濾按鈕
            $('#categoryFilterContainer').on('click', '.filter-btn', function() {
                $('.filter-btn').removeClass('active');
                $(this).addClass('active');

                const category = $(this).data('category');
                if (category === 'ALL') {
                    dataTableInstance.column(1).search('').draw();
                } else {
                    dataTableInstance.column(1).search(category).draw();
                }
            });

            // 一鍵生成 LINE 訂單文字
            $('#btnGenerateLineText').on('click', function() {
                generateLineOrderText();
            });

            // 複製剪貼簿按鈕
            $('#btnCopyLineText').on('click', function() {
                const text = $('#lineTextOutput').val();
                navigator.clipboard.writeText(text).then(function() {
                    alert('訂單文字已成功複製至剪貼簿！');
                });
            });
        });
    </script>
</body>
</html>
