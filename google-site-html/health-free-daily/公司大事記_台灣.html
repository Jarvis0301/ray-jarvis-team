<!DOCTYPE html>
<html lang="zh-TW">
	<head>
	    <meta charset="UTF-8">
	    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	    <title>UVACO 大事記時間軸</title>
	    
	    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
	    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
	    
	    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>
	
	    <script>
	        $(document).ready(function() {
	            getData();
	        });
			
			// 獲得資料
			function getData() {
				// Google 試算表 ID
	            const SHEET_ID = '1bufPMYTaMInbvI9IuJyNYBn58cQIqywqJ8tW-56yvnY'; 
	            // 試算表工作表名稱
	            const SHEET_NAME = '台灣';
				// Google Visualization API Endpoint
				const gvizUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;
	
	            // 預設示範資料 (若未設定 Sheet ID 或連線失敗時顯示)
	            const fallbackData = [
	                {
	                    year: "2025",
	                    month: "08月",
	                    photo: "https://cdn.uvaco.com.tw/History/2025/0.png",
	                    content: "邁向國際市場，以嶄新形象「UVACO葡眾」面世，帶來「美滿生活 就此展開」的品牌信念，期許共創豐盈美好的生活面貌。"
	                }
	            ];
				
				// 發起 AJAX 抓取 Google 試算表資料	
	            $.ajax({
	                url: gvizUrl,
	                dataType: 'text',
	                success: function(response) {
	                    try {
	                        const jsonString = response.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);/)[1];
	                        const data = JSON.parse(jsonString);
	                        const rows = data.table.rows;
	
	                        if (!rows || rows.length === 0) {
	                            renderTimeline(fallbackData);
	                            return;
	                        }
	
	                        let parsedData = [];
	                        rows.forEach(row => {
	                            if (!row.c) return;
	                            parsedData.push({
	                                year: row.c[0] && row.c[0].v ? String(row.c[0].v) : '',
	                                month: row.c[1] && row.c[1].v ? String(row.c[1].v) : '',
	                                photo: row.c[2] && row.c[2].v ? String(row.c[2].v) : '',
	                                content: row.c[3] && row.c[3].v ? String(row.c[3].v) : ''
	                            });
	                        });
	
	                        renderTimeline(parsedData.length > 0 ? parsedData : fallbackData);
	
	                    } catch (e) {
	                        console.warn('解析試算表失敗，切換至備用展示資料:', e);
	                        renderTimeline(fallbackData);
	                    }
	                },
	                error: function() {
	                    console.warn('無法連線試算表，切換至備用展示資料');
	                    renderTimeline(fallbackData);
	                }
	            });
			}
			
			// 渲染時間軸 DOM 結構
			function renderTimeline(items) {
				const $container = $('#timeline-wrapper');
				$container.empty();

				// 按年份分組
				const groupedByYear = {};
				items.forEach(item => {
					const y = item.year || '歷史里程';
					if (!groupedByYear[y]) groupedByYear[y] = [];
					groupedByYear[y].push(item);
				});

				// 按年份降冪排列 (最新的年份在最上面)
				const sortedYears = Object.keys(groupedByYear).sort((a, b) => b - a);

				sortedYears.forEach(year => {
					// 年份標頭區塊
					let yearBlockHtml = `
						<div class="timeline-year-block">
							<div class="timeline-year-header">
								<div class="year-badge">
									<i class="fa-solid fa-flag-checkered me-2 text-warning"></i>${year}
								</div>
							</div>
					`;

					// 該年份下的所有月份事件
					groupedByYear[year].forEach(item => {
						const hasPhoto = item.photo && item.photo.trim() !== '';
						const monthText = item.month || '';
						
						// 動態判斷是否為「年度業績」關鍵字
						const isPerformance = monthText.includes('業績') || 
											  monthText.includes('Performance') || 
											  monthText.includes('Sales') || 
											  monthText.includes('Revenue');

						// 🔍 動態選擇 Icon 與 CSS Class
						const nodeStyleClass = isPerformance 
							? 'performance-dot'						// 金光璀璨節點
							: 'green-dot';							// 品牌綠節點
							
						const pillIconClass = isPerformance 
							? 'fa-solid fa-trophy'					// 業績採用獎盃 Icon
							: 'fa-regular fa-calendar-check';		// 一般月份採用日曆 Icon

						const pillStyleClass = isPerformance 
							? 'performance-pill'					// 金光璀璨標籤
							: 'month-pill';							// 品牌綠標籤
						
						yearBlockHtml += `
							<div class="timeline-item">
								<div class="timeline-node">
									<div class="node-dot ${nodeStyleClass}"></div>
								</div>

								<div class="timeline-content-card">
									<div class="${pillStyleClass} mb-2">
										<i class="${pillIconClass} me-1"></i> ${monthText}
									</div>
									<div class="card-body-wrapper ${hasPhoto ? 'has-image' : ''}">
										${hasPhoto ? `
											<div class="event-photo-container">
												<img src="${item.photo}" alt="UVACO History Image" class="event-photo" loading="lazy">
											</div>
										` : ''}
										<div class="event-text">
											${item.content}
										</div>
									</div>
								</div>
							</div>
						`;
					});

					yearBlockHtml += `</div>`;
					$container.append(yearBlockHtml);
				});
			}
	    </script>
	
	    <style>
			/* 全域品牌綠色系環境適應 */
			html, body {
				margin: 0;
				padding: 0;
				width: 100%;
				background-color: transparent;
				font-family: 'Noto Sans TC', sans-serif;
				color: #F1F5F9;
			}
			
			/* 載入中 Spinner */
			#loading-spinner {
				text-align: center;
				padding: 40px 0;
				color: #10B981;
			}

			.timeline-container {
				position: relative;
				padding: 20px 10px;
				max-width: 900px;
				margin: 0 auto;
			}

			/* 時間軸中央翡翠綠光軌 */
			.timeline-container::before {
				content: '';
				position: absolute;
				top: 40px;
				bottom: 20px;
				left: 28px;
				width: 3px;
				background: linear-gradient(180deg, #10B981 0%, #047857 50%, rgba(4, 120, 87, 0.1) 100%);
				box-shadow: 0 0 12px rgba(16, 185, 129, 0.5);
				border-radius: 2px;
			}

			.timeline-year-block { position: relative; margin-bottom: 35px; }
			.timeline-year-header { position: relative; margin-bottom: 20px; z-index: 2; }

			/* 年份標籤：翡翠漸層與金黃文字 */
			.year-badge {
				display: inline-flex;
				align-items: center;
				background: linear-gradient(135deg, #064E3B 0%, #022C22 100%);
				border: 1px solid #10B981;
				color: #FACC15;
				font-family: 'Montserrat', sans-serif;
				font-weight: 800;
				font-size: 1.35rem;
				padding: 6px 20px;
				border-radius: 30px;
				box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
			}

			.timeline-item { position: relative; padding-left: 60px; margin-bottom: 25px; }
			.timeline-node { position: absolute; left: 20px; top: 12px; transform: translateX(-50%); z-index: 3; }

			/* 綠色標準節點 */
			.node-dot.green-dot {
				width: 17px;
				height: 17px;
				background-color: #10B981;
				border: 3px solid #064E3B;
				border-radius: 50%;
				box-shadow: 0 0 10px #10B981;
				transition: all 0.3s ease;
			}

			/* 業績尊爵金色節點 */
			.node-dot.performance-dot {
				width: 18px;
				height: 18px;
				background-color: #FACC15;
				border: 3px solid #967903;
				border-radius: 50%;
				box-shadow: 0 0 12px #FACC15, 0 0 20px #FACC15;
			}

			/* 卡片本體：深綠質感懸浮層 */
			.timeline-content-card {
				background: #0B1E19;
				border: 1px solid #133E32;
				border-radius: 12px;
				padding: 18px 22px;
				box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
				transition: all 0.3s ease;
			}

			.timeline-content-card.green-card:hover {
				transform: translateY(-3px) translateX(3px);
				background: #102B24;
				border-color: #10B981;
				box-shadow: 0 12px 24px -5px rgba(16, 185, 129, 0.3);
			}

			.timeline-content-card.performance-card {
				border-color: rgba(250, 204, 21, 0.4);
				background: linear-gradient(145deg, #0B1E19 0%, #182C22 100%);
			}

			.timeline-content-card.performance-card:hover {
				border-color: #FACC15;
				box-shadow: 0 12px 24px -5px rgba(250, 204, 21, 0.35);
			}

			/* 公開版品牌綠標籤 */
			.month-pill {
				display: inline-block;
				background: rgba(16, 185, 129, 0.15);
				color: #34D399;
				border: 1px solid rgba(16, 185, 129, 0.4);
				font-weight: 700;
				font-size: 0.88rem;
				padding: 3px 12px;
				border-radius: 20px;
			}

			/* 業績尊爵金標籤 */
			.performance-pill {
				display: inline-block;
				background: rgba(250, 204, 21, 0.15);
				color: #FACC15;
				border: 1px solid rgba(250, 204, 21, 0.5);
				font-weight: 700;
				font-size: 0.88rem;
				padding: 3px 12px;
				border-radius: 20px;
				box-shadow: 0 0 10px rgba(250, 204, 21, 0.25);
			}

			.card-body-wrapper { display: flex; flex-direction: column; gap: 15px; margin-top: 10px; }
			@media (min-width: 768px) { .card-body-wrapper.has-image { flex-direction: row; align-items: flex-start; } }

			.event-photo-container { flex-shrink: 0; max-width: 100%; border-radius: 8px; overflow: hidden; border: 1px solid #133E32; }
			@media (min-width: 768px) { .event-photo-container { width: 220px; } }

			.event-photo { width: 100%; height: auto; display: block; object-fit: cover; }
			.event-text { color: #ECFDF5; font-size: 0.98rem; line-height: 1.7; }
		</style>
	</head>
	
	<body>
		<div class="timeline-container">
			<div id="timeline-wrapper">
				<div id="loading-spinner" class="text-center col-12">
					<div class="spinner-border mb-3" role="status" style="width: 2.5rem; height: 2.5rem;">
						<span class="visually-hidden">Loading...</span>
					</div>
					<div>UVACO 大事記同步中...</div>
				</div>
			</div>
		</div>
	</body>
</html>
