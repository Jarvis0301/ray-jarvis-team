                updateSeriesDropdowns();
                renderTypeFilterButtons();
                bindEvents();

                if (SPREADSHEET_ID) {
                    await fetchGoogleSheetsData();
                } else {
                    document.getElementById('syncStatus').innerHTML = '<i class="fas fa-database"></i> 使用備援資料庫';
                }

                renderProducts();
            });

            // 使用 PapaParse 解析 Google Sheets 數據 (GViz CSV API)
            async function fetchGoogleSheetsData() {
                try {
                    document.getElementById('syncStatus').innerHTML = '<i class="fas fa-spinner fa-spin"></i> 產品資訊同步中...';

                    const fetchSheet = async (sheetName) => {
                        const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
                        const res = await fetch(url);
                        const text = await res.text();
                        
                        // 使用 PapaParse 進行工業級 CSV 解析
                        const parsed = Papa.parse(text, {
                            header: false,
                            skipEmptyLines: true
                        });

                        return parsed.data.slice(1); // 扣除表頭列
                    };

                    // 並行抓取 4 個工作表
                    const [twData, myData, seriesData, typeData] = await Promise.all([
                        fetchSheet('台灣'),
                        fetchSheet('馬來西亞'),
                        fetchSheet('產品系列'),
                        fetchSheet('產品型態')
                    ]);

                    if (twData && twData.length > 0) appState.products.TW = mapProductRows(twData);
                    if (myData && myData.length > 0) appState.products.MY = mapProductRows(myData);
                    if (seriesData && seriesData.length > 0) appState.seriesList = parseSeriesRows(seriesData);

                    if (typeData && typeData.length > 0) {
                        appState.typeList = [{ name: "全部型態", icon: "fas fa-border-all" }];
                        typeData.forEach(row => {
                            if (row[0]) appState.typeList.push({ code: row[0], name: row[1], nameEn: row[2], icon: row[3] || "fas fa-tag", color: row[4] || "#94a3b8", bg: row[5] || "rgba(10, 25, 19, 0.88)" });
                        });
                        renderTypeFilterButtons();
                    }

                    document.getElementById('syncStatus').innerHTML = '<i class="fas fa-circle-check"></i> 雲端資料同步完成';
                } catch (err) {
                    console.warn("無法動態讀取 Google 試算表，使用預設資料:", err);
                    document.getElementById('syncStatus').innerHTML = '<i class="fas fa-triangle-exclamation"></i> 雲端同步失敗，切換至備援庫';
                }
            }

            // 轉換工作表列資料至產品物件
            function mapProductRows(rows) {
                return rows.map(r => ({
                    id: r[0] || '',
                    name: r[1] || '',
                    shortName: r[2] || '',
                    type: r[3] || '',
                    spec: r[4] || '',
                    price: r[5] || '',
                    sv: r[6] || '',
                    date: r[7] || '',
                    desc: r[10] || '',
                    url: r[12] || '#',
                    img: r[13] || ''
                })).filter(item => item.id !== '');
            }

            // 轉換工作表列資料至系列物件
            function parseSeriesRows(rows) {
                const seriesMap = [];

                rows.forEach(r => {
                    const code = (r[0] || '').trim();
                    const name = (r[1] || '').trim();
                    const nameEn = (r[2] || '').trim();
                    const icon = (r[3] || 'fas fa-tag').trim();
                    const color = (r[4] || '#52b788').trim();
                    const bg = (r[5] || 'rgba(10, 25, 19, 0.88)').trim();

                    if (!code) return;

                    // 長度 2 代表主系列 (如 "01")
                    if (code.length === 2) {
                        let main = seriesMap.find(s => s.code === code);
                        if (!main) {
                            main = { code, name, nameEn, icon, color, bg, subs: [] };
                            seriesMap.push(main);
                        } else {
                            main.name = name;
                            main.nameEn = nameEn;
                        }
                    } 
                    // 長度 4 代表次系列 (如 "0101")
                    else if (code.length === 4) {
                        const mainCode = code.slice(0, 2);
                        let main = seriesMap.find(s => s.code === mainCode);
                        if (!main) {
                            main = { code: mainCode, name: '', nameEn: '', subs: [] };
                            seriesMap.push(main);
                        }
                        main.subs.push({ code, name, nameEn, icon, color, bg });
                    }
                });

                return seriesMap.length > 0 ? seriesMap : defaultSeriesData;
            }

            // 取得多語系顯示名稱之輔助函式
            function getLanguageName(item, isMY) {
                if (!item) return '';
                //return isMY ? (item.nameEn || item.name) : item.name;
				return isMY ? item.nameEn : item.name;
            }

            // 更新產品系列下拉選單
            function updateSeriesDropdowns() {
                const mainSelect = document.getElementById('mainSeriesSelect');
                if (!mainSelect) return;

                const isMY = appState.country === 'MY';
                mainSelect.innerHTML = '<option value="ALL">全部主系列</option>';

                appState.seriesList.forEach(series => {
                    const displayName = getLanguageName(series, isMY);
					if (displayName) {
						const opt = document.createElement('option');
						opt.value = series.code;
						opt.textContent = `${series.code} ${displayName}`;
						mainSelect.appendChild(opt);
					}
                });

                mainSelect.value = 'ALL';
                updateSubSeriesDropdown(mainSelect.value);
            }

			// 更新產品次系列下拉選單
            function updateSubSeriesDropdown(mainCode) {
                const subSelect = document.getElementById('subSeriesSelect');
                if (!subSelect) return;

                const isMY = appState.country === 'MY';
                subSelect.innerHTML = '';

                if (mainCode === 'ALL') {
                    subSelect.disabled = true;
                    subSelect.innerHTML = '<option value="ALL">請先選擇主系列</option>';
                    return;
                }

                const targetSeries = appState.seriesList.find(s => s.code === mainCode);
                if (targetSeries && targetSeries.subs) {
                    subSelect.disabled = false;
                    const defaultOpt = document.createElement('option');
                    defaultOpt.value = 'ALL';
                    defaultOpt.textContent = '全部次分類';
                    subSelect.appendChild(defaultOpt);

                    targetSeries.subs.forEach(sub => {
                        const displayName = getLanguageName(sub, isMY);
						if (displayName) {
							const opt = document.createElement('option');
							opt.value = sub.code;
							opt.textContent = `${sub.code} ${displayName}`;
							subSelect.appendChild(opt);
						}
                    });
                }
            }

            // 生成型態按鈕列 (符合圖標與文字間 1 個半形空白規範)
            function renderTypeFilterButtons() {
                const container = document.getElementById('typeFilterContainer');
                container.innerHTML = '';

                appState.typeList.forEach(item => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = `type-btn ${appState.productType === (item.name === '全部型態' ? 'ALL' : item.name) ? 'active' : ''}`;
                    // 嚴格保留 1 個半形空白
                    btn.innerHTML = `<i class="${item.icon}"></i> ${item.name}`;
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        appState.productType = (item.name === '全部型態' ? 'ALL' : item.name);
                        renderProducts();
                    });
                    container.appendChild(btn);
                });
            }

            // 綁定 UI 事件
            function bindEvents() {
                document.getElementById('countrySelect').addEventListener('change', (e) => {
                    appState.country = e.target.value;
					appState.mainSeries = 'ALL';
                    updateSeriesDropdowns();
                    renderProducts();
                });

                document.getElementById('mainSeriesSelect').addEventListener('change', (e) => {
                    appState.mainSeries = e.target.value;
                    appState.subSeries = 'ALL';
                    updateSubSeriesDropdown(appState.mainSeries);
                    renderProducts();
                });

                document.getElementById('subSeriesSelect').addEventListener('change', (e) => {
                    appState.subSeries = e.target.value;
                    renderProducts();
                });

                document.getElementById('searchInput').addEventListener('input', (e) => {
                    appState.searchKeyword = e.target.value.trim().toLowerCase();
                    renderProducts();
                });
            }

            // 渲染產品網格
            function renderProducts() {
                const grid = document.getElementById('productGrid');
                if (!grid) return;
                grid.innerHTML = '';

                const isMY = appState.country === 'MY';
                const currentDataset = appState.products[appState.country] || [];

                const filtered = currentDataset.filter(item => {
                    // 1. 系列過濾 (依編號前綴對應)
                    if (appState.mainSeries !== 'ALL') {
                        if (item.id === '80050' || item.id === '80070') {
                            if (appState.mainSeries !== '03') {
                                return false;
                            } else {
                                return true;
                            }
                        }

                        if (appState.subSeries !== 'ALL') {
                            if (item.id.slice(2, 6) !== appState.subSeries) return false;
                        } else {
                            if (item.id.slice(2, 4) !== appState.mainSeries) return false;
                        }
                    }

                    // 2. 型態過濾
                    if (appState.productType !== 'ALL' && item.type !== appState.productType) {
                        return false;
                    }

                    // 3. 關鍵字搜尋
                    if (appState.searchKeyword !== '') {
                        const k = appState.searchKeyword;
                        const mName = item.name.toLowerCase().includes(k);
                        const mShort = item.shortName.toLowerCase().includes(k);
                        const mId = item.id.toLowerCase().includes(k);
                        const mDesc = item.desc.toLowerCase().includes(k);
                        if (!mName && !mShort && !mId && !mDesc) return false;
                    }

                    return true;
                });

                // 更新總數 (維護 1 個半形空白)
                document.getElementById('resultsCount').innerHTML = `<i class="fas fa-list-check"></i> 找到 ${filtered.length} 項符合條件的產品`;

                if (filtered.length === 0) {
                    grid.innerHTML = `
                        <div class="col-12">
                            <div class="no-data rounded">
                                <i class="fas fa-box-open"></i>
                                <p class="mb-0">未找到符合條件的產品，請調整篩選條件或搜尋關鍵字。</p>
                            </div>
                        </div>
                    `;
                    return;
                }

                // 渲染產品卡片 (動態抓取 Icon、文字與色彩)
                filtered.forEach(item => {
                    let seriesCode = item.id.slice(2, 6);
                    let seriesName = '未知系列';
                    let seriesIcon = 'fas fa-tag';
                    let seriesColor = '#52b788';
                    let seriesBg = 'rgba(10, 25, 19, 0.88)';

                    let typeIcon = 'fas fa-tag';
                    let typeColor = '#52b788';
                    let typeBg = 'rgba(10, 25, 19, 0.88)';

                    // 1. 動態匹配產品次系列 (含雙語系名稱、Icon、外框色彩、背景色)
                    appState.seriesList.forEach(series => {
                        if (item.id === '80050' || item.id === '80070') {
                            seriesCode = '0302';
                        }

                        const subSeries = series.subs.find(s => s.code === seriesCode);
                        if (subSeries) {
                            seriesName = getLanguageName(subSeries, isMY);
                            seriesIcon = subSeries.icon || 'fas fa-tag';
                            seriesColor = subSeries.color || '#52b788';
                            seriesBg = subSeries.bg || 'rgba(10, 25, 19, 0.88)';
                        }
                    });

                    // 2. 動態匹配產品型態 Icon 與色彩
                    appState.typeList.forEach(typeItem => {
                        if (typeItem.name === item.type) {
                            typeIcon = typeItem.icon || 'fas fa-tag';
                            typeColor = typeItem.color || '#52b788';
                            typeBg = typeItem.bg || 'rgba(10, 25, 19, 0.88)';
                        }
                    });

                    const col = document.createElement('div');
                    col.className = 'col col-12 col-sm-6 col-lg-3';
                    col.innerHTML = `
                        <div class="card h-100 product-card border-0">
                            <div class="card-img-wrapper position-relative">
                                <div class="card-badges">
                                    <span class="badge" style="color: ${seriesColor}; border-color: ${seriesColor}; background-color: ${seriesBg};">
                                        <i class="${seriesIcon}"></i> ${seriesName}
                                    </span>
                                    <span class="badge" style="color: ${typeColor}; border-color: ${typeColor}; background-color: ${typeBg};">
                                        <i class="${typeIcon}"></i> ${item.type}
                                    </span>
                                </div>
                                <img src="${item.img}" alt="${item.name}" loading="lazy" onerror="imgError(this)">
                            </div>
                            <div class="card-body d-flex flex-column p-3">
                                <h3 class="product-title h6 fw-bold mb-2">${item.name}</h3>
                                <p class="product-desc small mb-3">${item.desc || '暫無產品特色描述'}</p>
                                <div class="price-sv-block mt-auto mb-3 p-2 rounded d-flex justify-content-between align-items-center">
                                    <div class="price-tag fw-bold">${item.price}</div>
                                    <div class="sv-tag"><i class="fas fa-star"></i> ${item.sv} SV</div>
                                </div>
                                <a href="${item.url}" target="_blank" class="btn btn-detail w-100 text-center fw-bold">
                                    <i class="fas fa-arrow-up-right-from-square"></i> 查看產品詳情
                                </a>
                            </div>
                        </div>
                    `;
                    grid.appendChild(col);
                });
            }

            function imgError(imgDiv) {
                let currentSrc = imgDiv.src;

                if (currentSrc.endsWith('.jpg') && !imgDiv.dataset.triedPng) {
                    imgDiv.dataset.triedPng = "true";
                    imgDiv.src = currentSrc.replace(/\.jpg$/, '.png');
                    return;
                }

                let html = `<i class="fa-solid fa-boxes-stacked img-placeholder-icon"></i>`;
                $(imgDiv).replaceWith(html);
            }
        </script>

        <style>
            /* 核心色彩與變數系統 (UVACO Emerald Green Palette) */
            :root {
                --bg-dark: #192821;
                --bg-card: #163529;
                --bg-card-hover: #1e4738;
                --bg-input: #10261d;
                --border-color: #235240;
                --primary-accent: #52b788;
                --primary-hover: #74c69d;
                --text-main: #e8f5e9;
                --text-muted: #94a3b8;
                --gold-accent: #f59e0b;
                --radius: 12px;
                --shadow: 0 8px 24px rgba(7, 4, 4, 0.4);
            }

			/* 全域品牌綠色系環境適應 */
            html, body {
                background-color: var(--bg-dark);
                color: var(--text-main);
                font-family: 'Noto Sans TC', 'Roboto', sans-serif;
                margin: 0;
                padding: 0;
                -webkit-font-smoothing: antialiased;
            }

            /* 篩選控制面板 */
            .filter-section {
                background-color: var(--bg-card);
                border: 1px solid var(--border-color);
                border-radius: var(--radius);
                padding: 24px;
                margin-bottom: 24px;
                box-shadow: var(--shadow);
            }

            .form-group label {
                font-size: 0.88rem;
                font-weight: 700;
                margin-bottom: 8px;
                color: var(--primary-accent);
            }

            /* 表單元件 - 深色模式全域消除白底 */
            select.form-control,
            input.form-control,
            .form-select,
            .form-control {
                width: 100%;
                padding: 11px 38px 11px 14px;
                background-color: var(--bg-input) !important;
                color: var(--text-main) !important;
                border: 1px solid var(--border-color) !important;
                border-radius: 8px;
                font-size: 0.95rem;
                outline: none;
                transition: all 0.2s ease;
                appearance: none !important;
                -webkit-appearance: none !important;
                -moz-appearance: none !important;
                color-scheme: dark !important;
                background-image: url("data:image/svg+xml;utf8,<svg fill='%2352b788' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>") !important;
                background-repeat: no-repeat !important;
                background-position: right 12px center !important;
                background-size: 18px !important;
            }

            select.form-control option,
            .form-control option,
            optgroup {
                background-color: #10261d !important;
                color: #e8f5e9 !important;
                padding: 10px;
                color-scheme: dark !important;
            }

            .form-control:focus {
                border-color: var(--primary-accent) !important;
                box-shadow: 0 0 0 3px rgba(82, 183, 136, 0.25) !important;
            }

            .form-control:disabled {
                background-color: #163529 !important;
                color: #52796f !important;
                opacity: 0.65;
                cursor: not-allowed;
                border-color: var(--border-color) !important;
            }

            input.form-control:-webkit-autofill,
            input.form-control:-webkit-autofill:hover,
            input.form-control:-webkit-autofill:focus,
            select.form-control:-webkit-autofill {
                -webkit-text-fill-color: var(--text-main) !important;
                -webkit-box-shadow: 0 0 0px 1000px #10261d inset !important;
                transition: background-color 5000s ease-in-out 0s !important;
            }

            /* 型態篩選按鈕列 */
            .type-filter-title {
                font-size: 0.88rem;
                font-weight: 700;
                margin-bottom: 12px;
                color: var(--primary-accent);
            }

            .type-btn {
                background-color: var(--bg-input);
                border: 1px solid var(--border-color);
                border-radius: 20px;
                padding: 8px 18px;
                font-size: 0.88rem;
                font-weight: 500;
                color: var(--text-main);
                cursor: pointer;
                transition: all 0.2s ease;
                align-items: center;
            }

            .type-btn:hover {
                background-color: var(--border-color);
                color: var(--primary-hover);
            }

            .type-btn.active {
                background-color: var(--primary-accent);
                color: #05130d;
                border-color: var(--primary-accent);
                font-weight: 700;
                box-shadow: 0 4px 12px rgba(82, 183, 136, 0.3);
            }

            /* 狀態統計資訊 */
            .info-bar {
                background-color: rgba(22, 53, 41, 0.6);
                border-radius: 8px;
                border: 1px solid var(--border-color);
            }

            .results-count {
                font-size: 0.92rem;
                color: var(--text-muted);
            }

            .sync-status {
                font-size: 0.85rem;
                color: var(--primary-accent);
            }

            /* 產品卡片 */
            .product-card {
                background-color: var(--bg-card);
                border: 1px solid var(--border-color) !important;
                border-radius: var(--radius);
                overflow: hidden;
                box-shadow: var(--shadow);
                transition: transform 0.25s ease, border-color 0.25s ease;
            }

            .product-card:hover {
                transform: translateY(-5px);
                border-color: var(--primary-accent) !important;
                background-color: var(--bg-card-hover);
            }

            .card-img-wrapper {
                width: 100%;
                height: 220px;
                background-color: #10261d;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 16px;
                overflow: hidden;
            }

            .card-img-wrapper img {
                max-width: 100%;
                max-height: 100%;
                object-fit: contain;
                transition: transform 0.4s ease;
            }

            .product-card:hover .card-img-wrapper img {
                transform: scale(1.06);
            }

            .img-placeholder-icon {
                font-size: 3rem;
                color: #1B4D36;
            }

            /* 雙 Tag 橫向排列 */
            .card-badges {
                position: absolute;
                top: 10px;
                left: 10px;
                right: 10px;
                display: flex;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 6px;
                z-index: 2;
            }

            .badge {
                font-size: 0.75rem;
                padding: 4px 10px;
                border-radius: 6px;
                font-weight: 700;
                align-items: center;
                white-space: nowrap;
                backdrop-filter: blur(4px);
                border: 1px solid currentColor;
                box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
                transition: transform 0.2s ease;
            }

            .badge:hover {
                transform: scale(1.05);
            }

            .product-title {
                color: var(--text-main);
                line-height: 1.4;
            }

            .product-desc {
                color: var(--text-muted);
                display: -webkit-box;
                line-clamp: 2;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
                height: 3em;
            }

            .price-sv-block {
                background-color: var(--bg-input);
                border: 1px solid var(--border-color);
            }

            .price-tag {
                font-size: 1.15rem;
                color: var(--primary-accent);
            }

            .sv-tag {
                font-size: 0.85rem;
                color: var(--gold-accent);
                background-color: rgba(245, 158, 11, 0.15);
                border: 1px solid rgba(245, 158, 11, 0.3);
                padding: 2px 8px;
                border-radius: 12px;
            }

            .btn-detail {
                background-color: var(--primary-accent);
                color: #05130d;
                border: none;
                border-radius: 8px;
                padding: 11px;
                font-size: 0.92rem;
                transition: background-color 0.2s ease;
            }

            .btn-detail:hover {
                background-color: var(--primary-hover);
                color: #05130d;
            }

            .no-data {
                text-align: center;
                padding: 60px 20px;
                background-color: var(--bg-card);
                border: 1px solid var(--border-color);
                color: var(--text-muted);
            }

            .no-data i {
                font-size: 3rem;
                margin-bottom: 16px;
                color: var(--border-color);
            }
        </style>
    </head>
    
    <body>
        <div class="container py-4">
            <section class="filter-section">
                <div class="row g-3 mb-4">
                    <div class="col-12 col-sm-6 col-lg-3">
                        <div class="form-group">
                            <label for="countrySelect"><i class="fas fa-globe"></i> 選擇地區</label>
                            <select id="countrySelect" class="form-control">
                                <option value="TW">台灣</option>
                                <option value="MY">馬來西亞</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-12 col-sm-6 col-lg-3">
                        <div class="form-group">
                            <label for="mainSeriesSelect"><i class="fas fa-layer-group"></i> 產品主系列</label>
                            <select id="mainSeriesSelect" class="form-control">
                                <option value="ALL">全部主系列</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-12 col-sm-6 col-lg-3">
                        <div class="form-group">
                            <label for="subSeriesSelect"><i class="fas fa-sitemap"></i> 產品次系列</label>
                            <select id="subSeriesSelect" class="form-control" disabled>
                                <option value="ALL">請先選擇主系列</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-12 col-sm-6 col-lg-3">
                        <div class="form-group">
                            <label for="searchInput"><i class="fas fa-search"></i> 關鍵字搜尋</label>
                            <input type="text" id="searchInput" class="form-control" placeholder="輸入名稱、成分或編號...">

                </div>

                <div class="type-filter-title"><i class="fas fa-filter"></i> 產品型態</div>
                <div class="d-flex flex-wrap gap-2" id="typeFilterContainer"></div>
            </section>

            <div class="info-bar d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-4 p-3">
                <div class="results-count" id="resultsCount">
                    <i class="fas fa-list-check"></i> 正在初始化產品資料...
                </div>
                <div class="sync-status" id="syncStatus">
                    <i class="fas fa-cloud-arrow-down"></i> 產品資訊同步中...
                </div>
            </div>

            <main class="row g-4" id="productGrid"></main>
        </div>
    </body>
</html>
