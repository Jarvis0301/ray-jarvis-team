<!DOCTYPE html>
<html lang="zh-TW">
	<head>
	    <meta charset="UTF-8">
	    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	    <title>公司公告_馬來西亞</title>
	    
	    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
	    
	    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>
	    
	    <script>
	        $(document).ready(function() {
				getData()
			});
			
			function getData() {
	            // Google 試算表 ID
	            const SHEET_ID = '1RCto8TOW2efggT_eUAvb9N-DJT2Z0OlqiEsraVC8QcI'; 
	            // 試算表工作表名稱
	            const SHEET_NAME = '馬來西亞';
				// Google Visualization API Endpoint
	            const gvizUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;
	            
	            // 分類色彩配置對照表
	            const categoryMap = {
	                '重要': { itemClass: 'announcement-important', badgeClass: 'bg-danger' },
	                '活動': { itemClass: 'announcement-activy',    badgeClass: 'bg-primary' },
	                '權益': { itemClass: 'announcement-benefit',   badgeClass: 'bg-info text-dark' },
	                '產品': { itemClass: 'announcement-product',   badgeClass: 'bg-success' },
	                '法務': { itemClass: 'announcement-legal',     badgeClass: 'bg-warning text-dark' },
	                '其他': { itemClass: 'announcement-other',     badgeClass: 'bg-secondary' },
	                'Important': { itemClass: 'announcement-important', badgeClass: 'bg-danger' },
	                'Activity':    { itemClass: 'announcement-activy',    badgeClass: 'bg-primary' },
	                'Benefit':   { itemClass: 'announcement-benefit',   badgeClass: 'bg-info text-dark' },
	                'Product':   { itemClass: 'announcement-product',   badgeClass: 'bg-success' },
	                'Legal':     { itemClass: 'announcement-legal',     badgeClass: 'bg-warning text-dark' },
	                'Other':     { itemClass: 'announcement-other',     badgeClass: 'bg-secondary' }
	            };
	
	            // 發起 AJAX 請求動態抓取 Google 試算表資料
	            $.ajax({
	                url: gvizUrl,
	                dataType: 'text',
	                success: function(response) {
	                    try {
	                        // 清除「資料載入中」提示
	                        $('#announcement-container').empty();
	
	                        // 解析 Google gviz 回傳的包裹 JSON 字串
	                        const jsonString = response.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);/)[1];
	                        const data = JSON.parse(jsonString);
	                        const rows = data.table.rows;
	
	                        if (!rows || rows.length === 0) {
	                            $('#announcement-container').html('<div class="text-center text-muted py-4">目前尚無最新公告資料</div>');
	                            return;
	                        }
	
	                        // 遍歷試算表的每一行資料 (第 0 列為標頭，資料從 rows 開始)
	                        rows.forEach(function(row) {
	                            if (!row.c) return;
	
	                            // 讀取各欄位內容 (A:分類, B:標題, C:網址, D:日期)
	                            const category = row.c[0] && row.c[0].v ? $.trim(row.c[0].v) : '其他';
	                            const title    = row.c[1] && row.c[1].v ? row.c[1].v : '無標題';
	                            const linkUrl  = row.c[2] && row.c[2].v ? row.c[2].v : '#';
	                            
	                            // 日期格式化處理 (Handles gviz Date format or raw string)
	                            let dateStr = '';
	                            if (row.c[3] && row.c[3].f) {
	                                dateStr = row.c[3].f; // 使用格式化後的文字
	                            } else if (row.c[3] && row.c[3].v) {
	                                dateStr = row.c[3].v;
	                            } else {
	                                dateStr = '最新公告';
	                            }
	
	                            // 比對類別色彩 (若未比對成功則套用預設)
	                            const config = categoryMap[category] || { itemClass: 'announcement-other', badgeClass: 'bg-secondary' };
	
	                            // 動態建構公告卡片 HTML 結構
	                            const cardHtml = `
	                                <div class="announcement-item ${config.itemClass}">
	                                    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-2">
	                                        <div class="d-flex align-items-center gap-2 flex-wrap">
	                                            <span class="badge ${config.badgeClass}">${category}</span>
	                                            <a href="${linkUrl}" target="_blank" rel="noopener noreferrer" class="announcement-title fs-6">
	                                                ${title}
	                                            </a>
	                                        </div>
	                                        <div class="announcement-date">
	                                            <i class="fa-regular fa-calendar-days me-1"></i>${dateStr}
	                                        </div>
	                                    </div>
	                                </div>
	                            `;
	
	                            // 掛載至容器中
	                            $('#announcement-container').append(cardHtml);
	                        });
	
	                    } catch (e) {
	                        console.error('資料解析失敗:', e);
	                        $('#announcement-container').html('<div class="text-center text-danger py-4"><i class="fa-solid fa-triangle-exclamation me-2"></i>公告資料解析失敗，請檢查試算表格式。</div>');
	                    }
	                },
	                error: function(xhr, status, error) {
	                    console.error('請求失敗:', error);
	                    $('#announcement-container').html('<div class="text-center text-danger py-4"><i class="fa-solid fa-wifi me-2"></i>無法載入公告，請確認試算表共用權限已設定為「知道連結者皆可檢視」。</div>');
	                }
	            });
	        }
	    </script>
	    
	    <style>
	        html, body {
	            margin: 0;
	            padding: 0;
	            width: 100%;
	            background-color: transparent; /* 讓協作平台 #090D16 背景自然透出 */
	            font-family: 'Roboto', "Microsoft JhengHei", "微軟正黑體", "PingFang TC", sans-serif;
	            color: #f1f5f9;
	        }
			
			/* 載入中 Spinner */
			#loading-spinner {
				text-align: center;
				padding: 40px 0;
				color: #60A5FA;
			}
	        
	        .announcement-title, 
	        .badge, 
	        .announcement-date,
	        h1, h2, h3, h4, h5, h6 {
	            font-family: 'Montserrat', "Microsoft JhengHei", "微軟正黑體", "PingFang TC", sans-serif;
	        }
	
	        .announcement-stream {
	            padding: 10px 8px;
	        }
	
	        /* 暗黑風格卡片 */
	        .announcement-item {
	            background: #131B2E; /* 質感懸浮卡片層級感 */
	            border: 1px solid #1E293B;
	            border-left: 4px solid #3b82f6; /* 預設藍條 */
	            border-radius: 0 8px 8px 0;
	            padding: 12px 16px;
	            margin-bottom: 10px;
	            transition: all 0.2s ease-in-out;
	            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
	        }
	
	        /* 懸停動態：背景亮起 + 右移 */
	        .announcement-item:hover {
	            transform: translateX(4px);
	            background: #1A253E;
	            border-color: #334155;
	            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
	        }
	
	        /* 標題文字 */
	        .announcement-title {
	            color: #F1F5F9;
	            font-weight: 500;
	            text-decoration: none;
	            transition: color 0.2s ease;
	        }
	
	        /* 標題 hover：天藍色高亮 */
	        .announcement-title:hover {
	            color: #60A5FA;
	        }
	
	        /* 時間文字 */
	        .announcement-date {
	            color: #94A3B8;
	            font-size: 0.85rem;
	            white-space: nowrap;
	        }
	        
	        /* 各分類卡片左邊框顏色定義 */
	        .announcement-important { border-left-color: #dc3545; } /* 重要 (danger) */
	        .announcement-activy    { border-left-color: #0d6efd; } /* 活動 (primary) */
	        .announcement-benefit   { border-left-color: #0dcaf0; } /* 權益 (info) */
	        .announcement-product   { border-left-color: #198754; } /* 產品 (success) */
	        .announcement-legal     { border-left-color: #ffc107; } /* 法務 (warning) */
	        .announcement-other     { border-left-color: #6c757d; } /* 其他 (secondary) */
	    </style>
	</head>
	
	<body>
		<div class="announcement-stream" id="announcement-container">
		    <div id="loading-spinner" class="text-center col-12">
				<div class="spinner-border mb-3" role="status" style="width: 2.5rem; height: 2.5rem;">
		            <span class="visually-hidden">Loading...</span>
		        </div>
		        <div class="fs-6">最新公告同步中...</div>
		    </div>
		</div>
	</body>
</html>
