<!DOCTYPE html>
<html lang="zh-TW" data-bs-theme="dark-purple">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>庫存管理 | 榮祥團隊 - 核心版</title>

        <!-- 認證守衛 -->
        <script src="../assets/js/auth-guard.js"></script>
        
        <!-- 第三方函式庫加載器 -->
        <script src="../assets/js/vendor-loader.js"></script>

        <!-- 共用核心模組 -->
        <script src="../assets/js/common.js"></script>
        <link rel="stylesheet" href="../assets/css/common.css">

        <!-- 頁面專屬 -->
        <script src="./js/psi-stock.js" defer></script>
        <link rel="stylesheet" href="./css/psi-stock.css">
    </head>

    <body>
        <main class="container-fluid p-3 p-md-4">

            <!-- ==========================================================================
                1. 戰備物資態勢抬頭 (Sentinel Stock HUD)
                ========================================================================== -->
            <header class="row align-items-center mb-3">
                <h4 class="fw-bold mb-0 text-light">
                    <i class="fa-solid fa-boxes-stacked text-primary me-1"></i>庫存管理
                </h4>
            </header>
            
            <section class="glass-panel hud-bar mb-3">
                <div class="row align-items-center g-3 mb-3">
                    <!-- 四聯動態指標卡 -->
                    <div class="col-12 col-md-10 col-xl-6">
                        <div class="row row-cols-2 row-cols-md-4 g-2">
                            <div class="col">
                                <div class="stat-chip">
                                    <span class="text-secondary"><i class="fa-solid fa-box-open text-primary me-1"></i>整盒庫存</span>
                                    <span class="text-primary fs-6 fw-bold mono-num" id="hudTotalQty">0</span>
                                </div>
                            </div>
                            <div class="col">
                                <div class="stat-chip">
                                    <span class="text-secondary"><i class="fa-solid fa-circle-check text-success me-1"></i>自由可用</span>
                                    <span class="text-success fs-6 fw-bold mono-num" id="hudAvailableQty">0</span>
                                </div>
                            </div>
                            <div class="col">
                                <div class="stat-chip">
                                    <span class="text-secondary"><i class="fa-solid fa-lock text-warning me-1"></i>預扣鎖定</span>
                                    <span class="text-warning fs-6 fw-bold mono-num" id="hudReservedQty">0</span>
                                </div>
                            </div>
                            <div class="col">
                                <div class="stat-chip">
                                    <span class="text-secondary"><i class="fa-solid fa-shapes text-info me-1"></i>散裝庫存</span>
                                    <span class="text-info fs-6 fw-bold mono-num" id="hudTotalPieces">0</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-md-0 col-xl-4 d-none d-xl-block">
                    </div>
                    <div class="col-12 col-md-2 col-xl-2 d-flex justify-content-md-end">
                        <button class="btn btn-secondary btn-sm rounded-pill w-100" id="btnOpenAddModal" onclick="openAddStockModal()">
                            <i class="fa-solid fa-plus me-1"></i>新增庫存
                        </button>
                    </div>
                </div>

                <div class="row align-items-center g-3 mt-2 border-top border-purple-subtle">
                    <!-- 1. 據點下拉 (由 UISelectOptions 動態注入) -->
                    <div class="col-12 col-md-3 col-xl-3">
                        <label class="form-label text-secondary fw-bold mb-1" for="filterWarehouse">
                            <i class="fa-solid fa-warehouse text-primary me-1"></i>據點倉儲
                        </label>
                        <select class="form-select form-select-sm" id="filterWarehouse">
                            <option value="ALL">全部據點倉儲</option>
                        </select>
                    </div>

                    <!-- 2. 產品下拉 (由 UISelectOptions 動態注入) -->
                    <div class="col-12 col-md-3 col-xl-3">
                        <label class="form-label text-secondary fw-bold mb-1" for="filterProduct">
                            <i class="fa-solid fa-box text-info me-1"></i>產品品項
                        </label>
                        <select class="form-select form-select-sm" id="filterProduct">
                            <option value="ALL">全部產品品項</option>
                        </select>
                    </div>

                    <!-- 3. 時效下拉 -->
                    <div class="col-6 col-md-3 col-xl-3">
                        <label class="form-label text-secondary fw-bold mb-1" for="filterExpiry">
                            <i class="fa-solid fa-hourglass-half text-warning me-1"></i>時效區間
                        </label>
                        <select class="form-select form-select-sm" id="filterExpiry">
                            <option value="ALL">全部時效</option>
                            <option value="NORMAL">效期充裕 (&gt;90天)</option>
                            <option value="WARNING">近效期 (&le;90天)</option>
                            <option value="DANGER">極限警示 (&le;30天)</option>
                            <option value="EXPIRED">已逾期 (&le;0天)</option>
                        </select>
                    </div>

                    <!-- 4. 狀態下拉 -->
                    <div class="col-6 col-md-3 col-xl-3">
                        <label class="form-label text-secondary fw-bold mb-1" for="filterStatus">
                            <i class="fa-solid fa-shield-halved text-success me-1"></i>庫存狀態
                        </label>
                        <select class="form-select form-select-sm" id="filterStatus">
                            <option value="ALL">全部狀態</option>
                            <option value="NORMAL">自由流通</option>
                            <option value="LOCKED">盤點/異常凍結</option>
                        </select>
                    </div>
                </div>
            </section>

            <!-- ==========================================================================
                2. 視覺化戰術儀表 (Chart Horizon Matrix)
                ========================================================================== -->
            <section class="row g-3 mb-4">
                <!-- 1. 據點倉儲分佈佔比 -->
                <div class="col-12 col-sm-6 col-xl-3">
                    <div class="card card-custom h-100 p-3">
                        <div class="d-flex align-items-center justify-content-between mb-2">
                            <span class="fw-bold text-white"><i class="fa-solid fa-warehouse text-primary me-1"></i>據點容積佔比</span>
                            <span class="badge badge-secondary">現貨盒數</span>
                        </div>
                        <div style="height: 180px; position: relative;">
                            <canvas id="chartWarehouseShare"></canvas>
                        </div>
                    </div>
                </div>

                <!-- 2. 產品品項分佈佔比 -->
                <div class="col-12 col-sm-6 col-xl-3">
                    <div class="card card-custom h-100 p-3">
                        <div class="d-flex align-items-center justify-content-between mb-2">
                            <span class="fw-bold text-white"><i class="fa-solid fa-box text-info me-1"></i>產品品項佔比</span>
                            <span class="badge badge-secondary">現貨盒數</span>
                        </div>
                        <div style="height: 180px; position: relative;">
                            <canvas id="chartProductShare"></canvas>
                        </div>
                    </div>
                </div>

                <!-- 3. 時效區間階梯佔比 -->
                <div class="col-12 col-sm-6 col-xl-3">
                    <div class="card card-custom h-100 p-3">
                        <div class="d-flex align-items-center justify-content-between mb-2">
                            <span class="fw-bold text-white"><i class="fa-solid fa-hourglass-half text-warning me-1"></i>效期狀態佔比</span>
                            <span class="badge badge-secondary">現貨盒數</span>
                        </div>
                        <div style="height: 180px; position: relative;">
                            <canvas id="chartExpiryShare"></canvas>
                        </div>
                    </div>
                </div>

                <!-- 4. 庫存管制狀態佔比 -->
                <div class="col-12 col-sm-6 col-xl-3">
                    <div class="card card-custom h-100 p-3">
                        <div class="d-flex align-items-center justify-content-between mb-2">
                            <span class="fw-bold text-white"><i class="fa-solid fa-shield-halved text-success me-1"></i>管制狀態佔比</span>
                            <span class="badge badge-secondary">現貨盒數</span>
                        </div>
                        <div style="height: 180px; position: relative;">
                            <canvas id="chartStatusShare"></canvas>
                        </div>
                    </div>
                </div>
            </section>

            <!-- ==========================================================================
                3. 批號庫存動態戰術表 (DataTable 2.x 表 302: psi_stocks)
                ========================================================================== -->
            <section class="glass-panel p-3 mb-4">
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3 pb-2 border-bottom">
                    <div class="d-flex align-items-center gap-2">
                        <span class="text-white fw-bold"><i class="fa-solid fa-table-list text-primary me-1"></i>批號庫存清單</span>
                    </div>
                </div>

                <div class="table-responsive">
                    <table id="stockMasterTable" class="table table-dark-custom table-hover align-middle w-100">
                        <thead>
                            <tr>
                                <th>庫存單號</th>
                                <th>據點倉儲</th>
                                <th>產品品項</th>
                                <th>官方生產批號</th>
                                <th>有效截止日</th>
                                <th>實體現貨</th>
                                <th>預扣鎖定</th>
                                <th>可用盒數</th>
                                <th>成本 / SV</th>
                                <th>狀態標記</th>
                                <th class="text-end">戰術操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- 由 DataTables 動態渲染 -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>

        <!-- ==========================================================================
            4. 庫存批號維護 Modal (表 302: psi_stocks 實體 17 欄位 CRUD，下拉選單由共用模組接管)
            ========================================================================== -->
        <div class="modal fade" id="stockModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <section class="modal-content">
                    <header class="modal-header border-bottom border-secondary border-opacity-25 py-3 px-4">
                        <h5 class="modal-title fw-bold text-white" id="stockModalLabel">
                            <i class="fa-solid fa-box-archive text-primary me-1"></i>庫存批號主檔編輯
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </header>
                    <div class="modal-body p-3 p-md-4">
                        <form id="stockForm" novalidate>
                            <input type="hidden" id="formMode" value="add">
                            <input type="hidden" id="fieldCreatedAt" value="">
                            <input type="hidden" id="fieldCreatedBy" value="">

                            <div class="row g-3 mb-3">
                                <div class="col-12 col-md-4">
                                    <label class="form-label" for="fieldId">庫存唯一代碼 <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control form-control-sm" id="fieldId" readonly required>
                                </div>
                                <div class="col-12 col-md-4">
                                    <label class="form-label" for="fieldWarehouseId">存放據點倉儲 <span class="text-danger">*</span></label>
                                    <select class="form-select form-select-sm" id="fieldWarehouseId" required style="width: 100%;">
                                        <option value="">-- 請選擇存放據點倉儲 --</option>
                                    </select>
                                </div>
                                <div class="col-12 col-md-4">
                                    <label class="form-label" for="fieldProductId">產品品項 SKU <span class="text-danger">*</span></label>
                                    <select class="form-select form-select-sm" id="fieldProductId" required style="width: 100%;">
                                        <option value="">-- 請選擇產品品項 --</option>
                                    </select>
                                </div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-12 col-md-6">
                                    <label class="form-label" for="fieldBatchNo">官方生產批號 <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control form-control-sm" id="fieldBatchNo" placeholder="如：20260315A5" required>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label class="form-label" for="fieldExpiryDate">有效截止日期 <span class="text-danger">*</span></label>
                                    <input type="date" class="form-control form-control-sm" id="fieldExpiryDate" required>
                                </div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-12 col-md-3">
                                    <label class="form-label" for="fieldQuantity">密封整盒現貨 <span class="text-danger">*</span></label>
                                    <input type="number" class="form-control form-control-sm" id="fieldQuantity" min="0" value="0" required>
                                    <div class="form-text text-muted small">完整未拆封盒裝數</div>
                                </div>
                                <div class="col-12 col-md-3">
                                    <label class="form-label" for="fieldPiecesQty">散裝剩餘支/條 <span class="text-danger">*</span></label>
                                    <input type="number" class="form-control form-control-sm" id="fieldPiecesQty" min="0" value="0" required>
                                    <div class="form-text text-muted small">拆盒零售/體驗零散數</div>
                                </div>
                                <div class="col-12 col-md-3">
                                    <label class="form-label" for="fieldReservedQty">代領預扣盒數 <span class="text-danger">*</span></label>
                                    <input type="number" class="form-control form-control-sm" id="fieldReservedQty" min="0" value="0" required>
                                    <div class="form-text text-muted small">訂單已成立未提領</div>
                                </div>
                                <div class="col-12 col-md-3">
                                    <label class="form-label" for="fieldAvailableQty">自由可用盒數</label>
                                    <input type="number" class="form-control form-control-sm bg-dark text-success fw-bold" id="fieldAvailableQty" readonly>
                                    <div class="form-text text-muted small">盒裝現貨扣除預扣</div>
                                </div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-12 col-md-4">
                                    <label class="form-label" for="fieldCurrencyCode">幣別</label>
                                    <select class="form-select form-select-sm" id="fieldCurrencyCode">
                                        <option value="TWD">TWD (新台幣)</option>
                                        <option value="MYR">MYR (馬來幣)</option>
                                    </select>
                                </div>
                                <div class="col-12 col-md-4">
                                    <label class="form-label" for="fieldCostPrice">成本單價</label>
                                    <input type="number" step="0.01" class="form-control form-control-sm" id="fieldCostPrice" value="0">
                                </div>
                                <div class="col-12 col-md-4">
                                    <label class="form-label" for="fieldSvPoint">單盒 SV 點數</label>
                                    <input type="number" class="form-control form-control-sm" id="fieldSvPoint" value="0">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="fieldRemarks">庫存備註說明</label>
                                <input type="text" class="form-control form-control-sm" id="fieldRemarks" placeholder="如：大馬拓荒展業樣品備貨、總部大批提貨待驗收...">
                            </div>

                            <div class="form-check form-switch mt-2">
                                <input class="form-check-input" type="checkbox" role="switch" id="fieldIsLocked">
                                <label class="form-check-label text-white small fw-bold" for="fieldIsLocked">
                                    <i class="fa-solid fa-lock text-danger me-1"></i>品質異常或盤點凍結出庫標記
                                </label>
                            </div>
                        </form>
                    </div>
                    <footer class="modal-footer border-top border-secondary border-opacity-25 d-flex justify-content-end gap-2 p-3">
                        <button type="button" class="btn btn-muted btn-sm rounded-pill px-3" data-bs-dismiss="modal">
                            <i class="fa-solid fa-xmark me-1"></i>取消
                        </button>
                        <button type="button" class="btn btn-secondary btn-sm rounded-pill px-3" onclick="saveStockItem()">
                            <i class="fa-solid fa-floppy-disk me-1"></i>儲存
                        </button>
                    </footer>
                </section>
            </div>
        </div>
    </body>
</html>
