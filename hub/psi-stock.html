<!DOCTYPE html>
<html lang="zh-TW" data-bs-theme="dark-purple">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>庫存管理 | 榮祥團隊 - 核心版</title>

        <!-- 認證守衛 -->
        <script src="../assets/js/auth-guard.js"></script>
        
        <!-- 第三方函式庫加載器 -->
        <script src="../assets/js/vendor-loader.js"></script>

        <!-- 共用核心模組 -->
        <script src="../assets/js/common.js"></script>
        <link rel="stylesheet" href="../assets/css/common.css">

        <!-- 頁面專屬 -->
        <script src="./js/psi-stock.js" defer></script>
        <link rel="stylesheet" href="./css/psi-stock.css">
    </head>

    <body>
        <main class="container-fluid p-3 p-md-4">

            <!-- ==========================================================================
                1. 戰備物資態勢抬頭 (Sentinel Stock HUD)
                ========================================================================== -->
            <header class="glass-panel hud-sentinel-bar mb-4">
                <div class="row align-items-center g-3">
                    <div class="col-12 col-xl-5">
                        <div class="h4 fw-bold text-white">
                            <i class="fa-solid fa-boxes-stacked text-primary"></i> 庫存管理
                        </div>
                    </div>

                    <!-- 四聯動態指標卡 -->
                    <div class="col-12 col-xl-7">
                        <div class="row g-2">
                            <div class="col-6 col-md-3">
                                <div class="card h-100 p-3">
                                    <div class="d-flex justify-content-between align-items-center mb-1">
                                        <span class="text-secondary small">在線實體總盒數</span>
                                        <i class="fa-solid fa-box-open text-primary"></i>
                                    </div>
                                    <div class="d-flex align-items-baseline gap-1">
                                        <span class="h4 fw-bold text-white mb-0" id="hudTotalQty">0</span>
                                        <span class="text-secondary small">盒</span>
                                    </div>
                                </div>
                            </div>
                            <div class="col-6 col-md-3">
                                <div class="card h-100 p-3">
                                    <div class="d-flex justify-content-between align-items-center mb-1">
                                        <span class="text-secondary small">自由可用現貨</span>
                                        <i class="fa-solid fa-circle-check text-success"></i>
                                    </div>
                                    <div class="d-flex align-items-baseline gap-1">
                                        <span class="h4 fw-bold text-success mb-0" id="hudAvailableQty">0</span>
                                        <span class="text-secondary small">盒</span>
                                    </div>
                                </div>
                            </div>
                            <div class="col-6 col-md-3">
                                <div class="card h-100 p-3">
                                    <div class="d-flex justify-content-between align-items-center mb-1">
                                        <span class="text-secondary small">代領預扣鎖定</span>
                                        <i class="fa-solid fa-lock text-warning"></i>
                                    </div>
                                    <div class="d-flex align-items-baseline gap-1">
                                        <span class="h4 fw-bold text-warning mb-0" id="hudReservedQty">0</span>
                                        <span class="text-secondary small">盒</span>
                                    </div>
                                </div>
                            </div>
                            <div class="col-6 col-md-3">
                                <div class="card h-100 p-3">
                                    <div class="d-flex justify-content-between align-items-center mb-1">
                                        <span class="text-secondary small">有效期限預警批數</span>
                                        <i class="fa-solid fa-triangle-exclamation text-danger"></i>
                                    </div>
                                    <div class="d-flex align-items-baseline gap-1">
                                        <span class="h4 fw-bold text-danger mb-0" id="hudExpiringBatches">0</span>
                                        <span class="text-secondary small">批 (&le;90天)</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                <!-- 據點維度篩選與操作按鈕 -->
                <div class="row align-items-center justify-content-between g-3 mt-2 pt-3 border-top border-purple-subtle">
                    <div class="col-12 col-md-7">
                        <div class="d-flex flex-wrap gap-2 align-items-center">
                            <span class="text-secondary small fw-bold"><i class="fa-solid fa-warehouse text-primary"></i> 據點維度：</span>
                            <button type="button" class="filter-pill-btn active" data-filter-wh="ALL">
                                <i class="fa-solid fa-globe"></i> 全域多倉總覽
                            </button>
                            <button type="button" class="filter-pill-btn" data-filter-wh="WH-TW-TP">
                                <i class="fa-solid fa-building"></i> 台北營運中心
                            </button>
                            <button type="button" class="filter-pill-btn" data-filter-wh="WH-HOME-RAY">
                                <i class="fa-solid fa-shield-halved"></i> Ray 居家戰備私倉
                            </button>
                            <button type="button" class="filter-pill-btn" data-filter-wh="WH-MY-KL01">
                                <i class="fa-solid fa-plane-departure"></i> 吉隆坡海外前進基地
                            </button>
                        </div>
                    </div>

                    <div class="col-12 col-md-5 text-md-end">
                        <button class="btn btn-secondary btn-sm rounded-pill" id="btnOpenAddModal" onclick="openAddStockModal()">
                            <i class="fa-solid fa-plus"></i> 新增庫存批號
                        </button>
                    </div>
                </div>
            </header>

            <!-- ==========================================================================
                2. 視覺化戰術儀表 (Chart Horizon Matrix)
                ========================================================================== -->
            <section class="row g-3 mb-4">
                <div class="col-12 col-lg-4">
                    <div class="card-custom h-100 p-3">
                        <div class="d-flex align-items-center justify-content-between mb-2">
                            <span class="fw-bold text-white small"><i class="fa-solid fa-chart-pie text-primary"></i> 跨倉實體庫存容積佔比</span>
                            <span class="badge bg-secondary bg-opacity-25 text-light small">現貨盒數</span>
                        </div>
                        <div style="height: 175px; position: relative;">
                            <canvas id="chartWarehouseShare"></canvas>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-lg-8">
                    <div class="card-custom h-100 p-3">
                        <div class="d-flex align-items-center justify-content-between mb-2">
                            <span class="fw-bold text-white small"><i class="fa-solid fa-hourglass-half text-secondary"></i> FIFO 批號有效期限時空階梯 (距過期天數)</span>
                            <div class="d-flex gap-2 small">
                                <span class="text-danger">&le;30 天 (極危)</span>
                                <span class="text-warning">&le;90 天 (近效期)</span>
                                <span class="text-success">&gt;90 天 (充裕)</span>
                            </div>
                        </div>
                        <div style="height: 175px; position: relative;">
                            <canvas id="chartExpiryTimeline"></canvas>
                        </div>
                    </div>
                </div>
            </section>

            <!-- ==========================================================================
                3. 批號庫存動態戰術表 (DataTable 2.x 表 302: psi_stocks)
                ========================================================================== -->
            <section class="glass-panel p-3 mb-4">
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3 pb-2 border-bottom" style="border-color: var(--uvaco-border, rgba(168, 85, 247, 0.2)) !important;">
                    <div class="d-flex flex-wrap align-items-center gap-2">
                        <span class="text-white fw-bold"><i class="fa-solid fa-filter text-primary"></i> 狀態快篩：</span>
                        <button type="button" class="filter-pill-btn active" data-filter-status="ALL">全部批號</button>
                        <button type="button" class="filter-pill-btn" data-filter-status="NORMAL">
                            <i class="fa-solid fa-circle-check text-success"></i> 自由流通
                        </button>
                        <button type="button" class="filter-pill-btn" data-filter-status="WARNING_EXPIRY">
                            <i class="fa-solid fa-stopwatch text-warning"></i> 近效期 (&le;90天)
                        </button>
                        <button type="button" class="filter-pill-btn" data-filter-status="LOCKED">
                            <i class="fa-solid fa-lock text-danger"></i> 盤點/異常凍結
                        </button>
                    </div>

                    <div class="d-flex align-items-center gap-2">
                        <span class="badge bg-secondary bg-opacity-25 text-light" id="tableRecordBadge">載入中...</span>
                    </div>
                </div>

                <div class="table-responsive">
                    <table id="stockMasterTable" class="table table-dark-custom table-hover align-middle w-100">
                        <thead>
                            <tr>
                                <th>主鍵</th>
                                <th>所在據點倉儲</th>
                                <th>產品品項</th>
                                <th>官方生產批號</th>
                                <th>有效截止日</th>
                                <th>實體現貨</th>
                                <th>預扣鎖定</th>
                                <th>可用盒數</th>
                                <th>成本 / SV</th>
                                <th>狀態標記</th>
                                <th class="text-end">戰術操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- 由 DataTables 動態渲染 -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>

        <!-- ==========================================================================
            4. 庫存批號維護 Modal (表 302: psi_stocks 實體 17 欄位 CRUD，下拉選單由共用模組接管)
            ========================================================================== -->
        <div class="modal fade" id="stockModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <section class="modal-content">
                    <header class="modal-header border-bottom border-secondary border-opacity-25 py-3 px-4">
                        <h5 class="modal-title fw-bold text-white" id="stockModalLabel">
                            <i class="fa-solid fa-box-archive text-primary"></i> 庫存批號主檔編輯
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </header>
                    <div class="modal-body p-3 p-md-4">
                        <form id="stockForm">
                            <input type="hidden" id="formMode" value="add">
                            <input type="hidden" id="fieldCreatedAt" value="">
                            <input type="hidden" id="fieldCreatedBy" value="">

                            <div class="row g-3 mb-3">
                                <div class="col-12 col-md-4">
                                    <label class="form-label" for="fieldId">庫存唯一代碼 <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control form-control-sm" id="fieldId" readonly required>
                                </div>
                                <div class="col-12 col-md-4">
                                    <label class="form-label" for="fieldWarehouseId">存放據點倉儲 <span class="text-danger">*</span></label>
                                    <select class="form-select form-select-sm" id="fieldWarehouseId" required style="width: 100%;">
                                        <option value="">-- 請選擇存放據點倉儲 --</option>
                                    </select>
                                </div>
                                <div class="col-12 col-md-4">
                                    <label class="form-label" for="fieldProductId">產品品項 SKU <span class="text-danger">*</span></label>
                                    <select class="form-select form-select-sm" id="fieldProductId" required style="width: 100%;">
                                        <option value="">-- 請選擇產品品項 --</option>
                                    </select>
                                </div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-12 col-md-6">
                                    <label class="form-label" for="fieldBatchNo">官方生產批號 <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control form-control-sm" id="fieldBatchNo" placeholder="如：20260315A5" required>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label class="form-label" for="fieldExpiryDate">有效截止日期 <span class="text-danger">*</span></label>
                                    <input type="date" class="form-control form-control-sm" id="fieldExpiryDate" required>
                                </div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-12 col-md-3">
                                    <label class="form-label" for="fieldQuantity">密封整盒現貨 <span class="text-danger">*</span></label>
                                    <input type="number" class="form-control form-control-sm" id="fieldQuantity" min="0" value="0" required>
                                    <div class="form-text text-muted small">完整未拆封盒裝數</div>
                                </div>
                                <div class="col-12 col-md-3">
                                    <label class="form-label" for="fieldPiecesQty">散裝剩餘支/條 <span class="text-danger">*</span></label>
                                    <input type="number" class="form-control form-control-sm" id="fieldPiecesQty" min="0" value="0" required>
                                    <div class="form-text text-muted small">拆盒零售/體驗零散數</div>
                                </div>
                                <div class="col-12 col-md-3">
                                    <label class="form-label" for="fieldReservedQty">代領預扣盒數 <span class="text-danger">*</span></label>
                                    <input type="number" class="form-control form-control-sm" id="fieldReservedQty" min="0" value="0" required>
                                    <div class="form-text text-muted small">訂單已成立未提領</div>
                                </div>
                                <div class="col-12 col-md-3">
                                    <label class="form-label" for="fieldAvailableQty">自由可用盒數</label>
                                    <input type="number" class="form-control form-control-sm bg-dark text-success fw-bold" id="fieldAvailableQty" readonly>
                                    <div class="form-text text-muted small">盒裝現貨扣除預扣</div>
                                </div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-12 col-md-4">
                                    <label class="form-label" for="fieldCurrencyCode">幣別</label>
                                    <select class="form-select form-select-sm" id="fieldCurrencyCode">
                                        <option value="TWD">TWD (新台幣)</option>
                                        <option value="MYR">MYR (馬來幣)</option>
                                    </select>
                                </div>
                                <div class="col-12 col-md-4">
                                    <label class="form-label" for="fieldCostPrice">成本單價</label>
                                    <input type="number" step="0.01" class="form-control form-control-sm" id="fieldCostPrice" value="0">
                                </div>
                                <div class="col-12 col-md-4">
                                    <label class="form-label" for="fieldSvPoint">單盒 SV 點數</label>
                                    <input type="number" class="form-control form-control-sm" id="fieldSvPoint" value="0">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="fieldRemarks">庫存備註說明</label>
                                <input type="text" class="form-control form-control-sm" id="fieldRemarks" placeholder="如：大馬拓荒展業樣品備貨、總部大批提貨待驗收...">
                            </div>

                            <div class="form-check form-switch mt-2">
                                <input class="form-check-input" type="checkbox" role="switch" id="fieldIsLocked">
                                <label class="form-check-label text-white small fw-bold" for="fieldIsLocked">
                                    <i class="fa-solid fa-lock text-danger"></i> 品質異常或盤點凍結出庫標記
                                </label>
                            </div>
                        </form>
                    </div>
                    <footer class="modal-footer border-top border-secondary border-opacity-25 d-flex justify-content-end gap-2 p-3">
                        <button type="button" class="btn btn-muted btn-sm rounded-pill px-3" data-bs-dismiss="modal">
                            <i class="fa-solid fa-xmark"></i> 取消
                        </button>
                        <button type="button" class="btn btn-secondary btn-sm rounded-pill px-3" onclick="saveStockItem()">
                            <i class="fa-solid fa-floppy-disk"></i> 儲存
                        </button>
                    </footer>
                </section>
            </div>
        </div>
    </body>
</html>
