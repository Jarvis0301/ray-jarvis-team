<!DOCTYPE html>
<html lang="zh-TW" data-bs-theme="dark-purple">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>據點倉儲調度中樞 (H31000) | 榮祥團隊戰術控制台</title>
    
    <!-- Bootstrap 5.3.3 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Font Awesome 6.5.2 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Flag Icons 7.2.3 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css">
    <!-- DataTables 2.0+ CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/2.0.8/css/dataTables.bootstrap5.min.css">
    <!-- Google Noto Sans TC -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;600;700&display=swap">

    <style>
        /* ==========================================================================
           核心版：暗夜魅影紫主題變數 (Dark Cyber Purple Tokens)
           ========================================================================== */
        :root, [data-bs-theme="dark-purple"] {
            --uvaco-bg-base: #0b0612;
            --uvaco-bg-surface: #140b22;
            --uvaco-bg-card: rgba(26, 14, 44, 0.75);
            --uvaco-bg-card-hover: rgba(38, 20, 64, 0.92);
            
            --uvaco-primary: #8b5cf6;
            --uvaco-primary-rgb: 139, 92, 246;
            --uvaco-primary-hover: #7c3aed;
            --uvaco-primary-gradient: linear-gradient(135deg, #8b5cf6 0%, #d946ef 100%);
            
            --uvaco-secondary: #c084fc;
            --uvaco-accent: #38bdf8;
            --uvaco-warning: #fbbf24;
            --uvaco-danger: #f43f5e;
            --uvaco-success: #34d399;
            
            --uvaco-border: rgba(139, 92, 246, 0.22);
            --uvaco-border-glow: rgba(168, 85, 247, 0.5);
            
            --uvaco-text-main: #f3e8ff;
            --uvaco-text-muted: #a78bfa;
            --uvaco-radius-lg: 18px;
            --uvaco-radius-md: 12px;
            --uvaco-font-mono: 'JetBrains Mono', monospace;
        }

        body {
            background-color: var(--uvaco-bg-base);
            background-image: 
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.14) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(217, 70, 239, 0.10) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(56, 189, 248, 0.05) 0px, transparent 60%);
            background-attachment: fixed;
            color: var(--uvaco-text-main);
            font-family: 'Noto Sans TC', sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .mono-num {
            font-family: var(--uvaco-font-mono);
        }

        /* 玻璃面板 */
        .glass-panel {
            background: var(--uvaco-bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--uvaco-border);
            border-radius: var(--uvaco-radius-lg);
            box-shadow: 0 8px 32px 0 rgba(139, 92, 246, 0.15);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-panel:hover {
            border-color: var(--uvaco-border-glow);
        }

        /* 戰術抬頭 HUD */
        .hud-header {
            padding: 1.25rem 1.5rem;
            margin-bottom: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .hud-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--uvaco-primary-gradient);
        }

        /* 狀態呼吸燈 */
        .live-pulse {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--uvaco-success);
            box-shadow: 0 0 8px var(--uvaco-success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 6px rgba(52, 211, 153, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
        }

        /* 戰術 Pills 按鈕 */
        .btn-filter-pill {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(139, 92, 246, 0.25);
            color: var(--uvaco-text-muted);
            border-radius: 50px;
            padding: 0.4rem 1rem;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-filter-pill:hover, .btn-filter-pill.active {
            background: var(--uvaco-primary-gradient);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 4px 14px rgba(139, 92, 246, 0.4);
        }

        /* 倉位全息數位艙 (Pod) */
        .warehouse-pod {
            position: relative;
            background: var(--uvaco-bg-card);
            border: 1px solid var(--uvaco-border);
            border-radius: var(--uvaco-radius-lg);
            padding: 1.4rem;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }

        .warehouse-pod:hover {
            transform: translateY(-5px);
            background: var(--uvaco-bg-card-hover);
            border-color: var(--uvaco-secondary);
            box-shadow: 0 14px 30px rgba(139, 92, 246, 0.25);
        }

        .pod-type-badge {
            font-size: 0.72rem;
            padding: 0.25rem 0.65rem;
            border-radius: 6px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .badge-official { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
        .badge-overseas { background: rgba(232, 121, 249, 0.15); color: #e879f9; border: 1px solid rgba(232, 121, 249, 0.3); }
        .badge-private { background: rgba(139, 92, 246, 0.15); color: #c084fc; border: 1px solid rgba(139, 92, 246, 0.3); }

        .pod-action-btn {
            background: rgba(139, 92, 246, 0.12);
            border: 1px solid rgba(139, 92, 246, 0.3);
            color: var(--uvaco-text-main);
            border-radius: var(--uvaco-radius-md);
            padding: 0.38rem 0.75rem;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .pod-action-btn:hover {
            background: var(--uvaco-primary);
            color: #ffffff;
            border-color: var(--uvaco-primary);
        }

        /* 模態彈窗自訂樣式 */
        .modal-content-purple {
            background: #140a24;
            border: 1px solid var(--uvaco-border-glow);
            color: var(--uvaco-text-main);
            border-radius: var(--uvaco-radius-lg);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        }

        .form-control-purple, .form-select-purple {
            background-color: rgba(11, 6, 18, 0.8) !important;
            border: 1px solid rgba(139, 92, 246, 0.3) !important;
            color: #ffffff !important;
            border-radius: var(--uvaco-radius-md);
        }

        .form-control-purple:focus, .form-select-purple:focus {
            border-color: var(--uvaco-secondary) !important;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.35) !important;
        }

        /* DataTables 自訂紫色主題 */
        .table-purple {
            --bs-table-bg: transparent;
            --bs-table-color: var(--uvaco-text-main);
            border-color: rgba(139, 92, 246, 0.15);
        }

        .table-purple th {
            background: rgba(139, 92, 246, 0.1);
            color: var(--uvaco-secondary);
            font-weight: 600;
            border-bottom: 2px solid rgba(139, 92, 246, 0.3);
            font-size: 0.85rem;
        }

        .table-purple td {
            vertical-align: middle;
            border-bottom: 1px solid rgba(139, 92, 246, 0.12);
            font-size: 0.88rem;
        }

        .dataTables_wrapper .dataTables_paginate .paginate_button.current {
            background: var(--uvaco-primary) !important;
            border-color: var(--uvaco-primary) !important;
            color: #ffffff !important;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <main class="container-fluid px-3 px-lg-4 py-3">

        <!-- ==========================================================================
             1. 戰術指揮狀態抬頭 (HUD Header)
             ========================================================================== -->
        <section class="glass-panel hud-header">
            <div class="row align-items-center g-3">
                <div class="col-12 col-xl-5">
                    <div class="d-flex align-items-center gap-3">
                        <div class="d-flex align-items-center justify-content-center rounded-3" style="width: 48px; height: 48px; background: rgba(139, 92, 246, 0.15); border: 1px solid rgba(139, 92, 246, 0.3); color: #c084fc; font-size: 1.4rem;">
                            <i class="fa-solid fa-warehouse"></i>
                        </div>
                        <div>
                            <div class="d-flex align-items-center gap-2">
                                <span class="live-pulse"></span>
                                <span class="badge bg-dark border border-purple text-uppercase" style="font-size: 0.7rem; color: #c084fc; border-color: rgba(139, 92, 246, 0.3) !important;">
                                    <i class="fa-solid fa-shield-halved"></i> 核心極密授權
                                </span>
                                <span class="text-secondary small">|</span>
                                <span class="text-secondary small mono-num" id="current-timestamp">2026-09-02 12:00:00</span>
                            </div>
                            <h2 class="h4 mb-0 fw-bold mt-1 text-white">
                                <i class="fa-solid fa-map-location-dot text-primary"></i> 據點倉儲管理中樞
                            </h2>
                        </div>
                    </div>
                </div>

                <!-- 即時戰區據點快照 -->
                <div class="col-12 col-xl-7">
                    <div class="row g-2 text-center text-md-start">
                        <div class="col-6 col-sm-3">
                            <div class="p-2 rounded" style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(139, 92, 246, 0.15);">
                                <div class="text-secondary small">
                                    <span class="fi fi-tw me-1"></span> 台灣戰區據點
                                </div>
                                <div class="h5 mb-0 fw-bold mono-num text-info mt-1" id="stat-tw-count">0 處</div>
                            </div>
                        </div>
                        <div class="col-6 col-sm-3">
                            <div class="p-2 rounded" style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(139, 92, 246, 0.15);">
                                <div class="text-secondary small">
                                    <span class="fi fi-my me-1"></span> 大馬前進樞紐
                                </div>
                                <div class="h5 mb-0 fw-bold mono-num text-warning mt-1" id="stat-my-count">0 處</div>
                            </div>
                        </div>
                        <div class="col-6 col-sm-3">
                            <div class="p-2 rounded" style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(139, 92, 246, 0.15);">
                                <div class="text-secondary small">
                                    <i class="fa-solid fa-vault text-secondary"></i> 自用中繼私倉
                                </div>
                                <div class="h5 mb-0 fw-bold mono-num text-white mt-1" id="stat-private-count">0 處</div>
                            </div>
                        </div>
                        <div class="col-6 col-sm-3">
                            <div class="p-2 rounded" style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(139, 92, 246, 0.15);">
                                <div class="text-secondary small">
                                    <i class="fa-solid fa-circle-check text-success"></i> 營運中比例
                                </div>
                                <div class="h5 mb-0 fw-bold mono-num text-success mt-1" id="stat-active-rate">100%</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 控制列：篩選 Pills 與操作按鈕 -->
            <div class="row align-items-center justify-content-between g-3 mt-2 pt-3 border-top" style="border-color: rgba(139, 92, 246, 0.15) !important;">
                <div class="col-12 col-lg-7">
                    <div class="d-flex flex-wrap gap-2 align-items-center">
                        <span class="text-secondary small me-1">
                            <i class="fa-solid fa-filter"></i> 據點類型：
                        </span>
                        <button class="btn btn-filter-pill active" data-filter="ALL">
                            <i class="fa-solid fa-border-all"></i> 全部 (<span id="count-all">0</span>)
                        </button>
                        <button class="btn btn-filter-pill" data-filter="OFFICIAL_CENTER">
                            <i class="fa-solid fa-building-flag"></i> 官方營運中心 (<span id="count-official">0</span>)
                        </button>
                        <button class="btn btn-filter-pill" data-filter="PRIVATE_HUB">
                            <i class="fa-solid fa-vault"></i> 自用中繼倉 (<span id="count-private">0</span>)
                        </button>
                        <button class="btn btn-filter-pill" data-filter="TRANSIT_OVERSEAS">
                            <i class="fa-solid fa-plane-departure"></i> 海外跨境倉 (<span id="count-overseas">0</span>)
                        </button>
                    </div>
                </div>

                <div class="col-12 col-lg-5">
                    <div class="d-flex justify-content-lg-end gap-2">
                        <!-- 快速過濾 -->
                        <div class="input-group input-group-sm" style="max-width: 200px;">
                            <span class="input-group-text bg-dark border-purple text-secondary" style="border-color: rgba(139, 92, 246, 0.25);">
                                <i class="fa-solid fa-magnifying-glass"></i>
                            </span>
                            <input type="text" id="quick-search" class="form-control bg-dark text-white border-purple" placeholder="代碼 / 名稱..." style="border-color: rgba(139, 92, 246, 0.25);">
                        </div>
                        
                        <!-- 視圖切換 -->
                        <div class="btn-group btn-group-sm">
                            <button class="btn btn-outline-secondary active" id="view-grid-btn" title="全息艙位視圖">
                                <i class="fa-solid fa-grip"></i>
                            </button>
                            <button class="btn btn-outline-secondary" id="view-table-btn" title="數據表格視圖">
                                <i class="fa-solid fa-table-list"></i>
                            </button>
                        </div>

                        <!-- 雲端同步與新增據點按鈕 -->
                        <button class="btn btn-sm btn-outline-light" id="btn-sync" onclick="fetchGoogleSheetsData()" title="同步 Google 試算表">
                            <i class="fa-solid fa-arrows-rotate"></i>
                        </button>
                        <button class="btn btn-sm btn-primary px-3 fw-bold" id="btnOpenAddModal" onclick="openAddModal()">
                            <i class="fa-solid fa-plus"></i> 新增據點
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- ==========================================================================
             2. 倉位全息數位艙視圖 (Grid View)
             ========================================================================== -->
        <section id="warehouse-grid-container" class="row g-3 mb-4">
            <!-- 由 JavaScript 動態繪製 -->
        </section>

        <!-- ==========================================================================
             3. 盤點審計表格視圖 (Table View)
             ========================================================================== -->
        <section id="warehouse-table-container" class="glass-panel p-3 d-none mb-4">
            <div class="d-flex align-items-center justify-content-between mb-3">
                <h5 class="mb-0 text-white fw-bold">
                    <i class="fa-solid fa-table-cells text-secondary"></i> 全域據點倉儲主檔總表 (表 301)
                </h5>
                <span class="badge bg-purple-subtle text-white border border-purple">
                    <i class="fa-solid fa-database text-info"></i> 試算表同步實體
                </span>
            </div>
            <div class="table-responsive">
                <table id="warehouse-datatable" class="table table-purple table-hover align-middle w-100">
                    <thead>
                        <tr>
                            <th>代碼 (id)</th>
                            <th>據點名稱</th>
                            <th>類型 (type)</th>
                            <th>市場</th>
                            <th>地址</th>
                            <th>電話</th>
                            <th>營業時間</th>
                            <th>狀態</th>
                            <th>排序</th>
                            <th class="text-end">管理操作</th>
                        </tr>
                    </thead>
                    <tbody id="warehouse-table-body">
                        <!-- 資料由 DataTable 渲染 -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- ==========================================================================
         4. 新增 / 編輯據點 Modal (表 301 欄位)
         ========================================================================== -->
    <div class="modal fade" id="warehouseModal" tabindex="-1" aria-labelledby="warehouseModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content modal-content-purple">
                <div class="modal-header border-purple" style="border-color: rgba(139, 92, 246, 0.2) !important;">
                    <h5 class="modal-title fw-bold text-white" id="warehouseModalLabel">
                        <i class="fa-solid fa-warehouse text-primary"></i> 據點倉儲配置
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="warehouseForm">
                        <input type="hidden" id="formMode" value="add">
                        <input type="hidden" id="fieldCreatedAt" value="">
                        <input type="hidden" id="fieldCreatedBy" value="">

                        <div class="row g-3 mb-3">
                            <div class="col-12 col-md-6">
                                <label class="form-label small text-secondary fw-bold">據點唯一代碼 (id) *</label>
                                <input type="text" class="form-control form-control-purple mono-num" id="fieldId" placeholder="如：WH-TW-TP, WH-HOME-RAY" required>
                                <div class="form-text text-muted small">主鍵 (PK)，如 WH-TW-N01 或 WH-MY-KUL</div>
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label small text-secondary fw-bold">據點中文名稱 (warehouse_name) *</label>
                                <input type="text" class="form-control form-control-purple" id="fieldName" placeholder="如：台北總公司營運中心" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-12 col-md-4">
                                <label class="form-label small text-secondary fw-bold">倉儲類型 (warehouse_type) *</label>
                                <select class="form-select form-select-purple" id="fieldType" required>
                                    <option value="OFFICIAL_CENTER">官方營運中心</option>
                                    <option value="PRIVATE_HUB">自用中繼倉</option>
                                    <option value="TRANSIT_OVERSEAS">海外跨境倉</option>
                                </select>
                            </div>
                            <div class="col-12 col-md-4">
                                <label class="form-label small text-secondary fw-bold">所屬市場 (country_code) *</label>
                                <select class="form-select form-select-purple" id="fieldCountry" required>
                                    <option value="TW">TW (台灣市場)</option>
                                    <option value="MY">MY (馬來西亞市場)</option>
                                </select>
                            </div>
                            <div class="col-12 col-md-4">
                                <label class="form-label small text-secondary fw-bold">選單排序 (sort_order)</label>
                                <input type="number" class="form-control form-control-purple mono-num" id="fieldSortOrder" value="10">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small text-secondary fw-bold">據點實體地址 (address)</label>
                            <input type="text" class="form-control form-control-purple" id="fieldAddress" placeholder="輸入完整實體地址，供地圖導航與單據標記">
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-12 col-md-6">
                                <label class="form-label small text-secondary fw-bold">聯絡專線 (contact_phone)</label>
                                <input type="text" class="form-control form-control-purple mono-num" id="fieldPhone" placeholder="如：02-2791-1055">
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label small text-secondary fw-bold">營業開放時間 (operating_hours)</label>
                                <input type="text" class="form-control form-control-purple" id="fieldHours" placeholder="如：週一至週五 09:00 - 18:00">
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-12 col-md-6">
                                <label class="form-label small text-secondary fw-bold">經度座標 (longitude)</label>
                                <input type="text" class="form-control form-control-purple mono-num" id="fieldLongitude" placeholder="如：121.5746">
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label small text-secondary fw-bold">緯度座標 (latitude)</label>
                                <input type="text" class="form-control form-control-purple mono-num" id="fieldLatitude" placeholder="如：25.0601">
                            </div>
                        </div>

                        <div class="form-check form-switch mt-3">
                            <input class="form-check-input" type="checkbox" role="switch" id="fieldIsActive" checked>
                            <label class="form-check-label text-white small fw-bold" for="fieldIsActive">
                                <i class="fa-solid fa-power-off text-success"></i> 啟用此據點營運 (is_active = 'Y')
                            </label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-purple" style="border-color: rgba(139, 92, 246, 0.2) !important;">
                    <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary btn-sm px-4 fw-bold" onclick="saveWarehouseItem()">
                        <i class="fa-solid fa-floppy-disk"></i> 儲存據點資料
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ==========================================================================
         JavaScript 核心驅動：Bootstrap 5, jQuery, PapaParse, DataTables
         ========================================================================== -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.datatables.net/2.0.8/js/dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/2.0.8/js/dataTables.bootstrap5.min.js"></script>

    <script>
        // ==========================================================================
        // 1. Google 雲端試算表設定與資料庫核心轉接器

         */
        function getVal(row, colIndex, defaultVal = '') {
            if (!row || !Array.isArray(row)) return defaultVal;
            if (row[colIndex] !== undefined && row[colIndex] !== null && String(row[colIndex]).trim() !== '') {

            }

        // ==========================================================================

        // ==========================================================================
        async function fetchGoogleSheetsData() {
            AppLoading.show('<i class="fa-solid fa-cloud-arrow-down text-primary"></i> 正在同步據點...', '載入最新結構');
            try {
                const fetchSheet = async (sheetName) => {
                    const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}&_=${Date.now()}`;
                    const res = await fetch(url, { cache: 'no-store' });
                    if (!res.ok) throw new Error(`HTTP 通訊錯誤狀態碼: ${res.status}`);
                    const text = await res.text();

                    const parsed = Papa.parse(text, {
                        header: false,
                        skipEmptyLines: true
                    });

                    // 依照規則跳過第 1 列欄位名稱
                    return (parsed.data || []).slice(1);
                };

                const rawRows = await fetchSheet(SHEET_NAME);

                if (!rawRows || rawRows.length === 0) {
                    throw new Error(`試算表『${SHEET_NAME}』工作表中未讀取到任何有效數據。`);
                }

                appState.warehouses = parseWarehouseTable(rawRows);
                refreshView();
                AppToast.success(`已成功自 Google 試算表同步 ${appState.warehouses.length} 處據點`);
            } catch (err) {
                console.warn("Google Sheets 據點倉儲讀取失敗，載入備份展示資料:", err);
                loadFallbackData();
                refreshView();
                AppToast.warning("試算表連線中斷，已切換至離線戰術據點快照。");
            } finally {
                AppLoading.hide();
            }
        }

        /**
         * 依據表 301 欄位順序進行 Index 映射解析
         */
        function parseWarehouseTable(rows) {
            return rows.map((r, idx) => {
                return {
                    id: getVal(r, 0, `WH-TW-${String(idx + 1).padStart(2, '0')}`),      // Col 0: id (PK)
                    warehouse_name: getVal(r, 1, '未命名據點'),                        // Col 1: warehouse_name
                    warehouse_type: getVal(r, 2, 'OFFICIAL_CENTER'),                  // Col 2: warehouse_type
                    country_code: getVal(r, 3, 'TW').toUpperCase(),                   // Col 3: country_code
                    address: getVal(r, 4, ''),                                         // Col 4: address
                    contact_phone: getVal(r, 5, ''),                                   // Col 5: contact_phone
                    operating_hours: getVal(r, 6, '09:00 - 18:00'),                   // Col 6: operating_hours
                    latitude: parseFloat(getVal(r, 7, '0')) || null,                  // Col 7: latitude
                    longitude: parseFloat(getVal(r, 8, '0')) || null,                 // Col 8: longitude
                    is_active: getVal(r, 9, 'Y').toUpperCase(),                        // Col 9: is_active
                    sort_order: parseInt(getVal(r, 10, String((idx + 1) * 10)), 10) || 10, // Col 10: sort_order
                    created_by: getVal(r, 11, 'SYSTEM'),                               // Col 11: created_by
                    created_at: getVal(r, 12, '2026-01-01 00:00:00'),                  // Col 12: created_at
                    modified_by: getVal(r, 13, 'SYSTEM'),                              // Col 13: modified_by
                    modified_at: getVal(r, 14, '2026-01-01 00:00:00')                  // Col 14: modified_at
                };
            }).filter(w => w.warehouse_name !== '未命名據點');
        }

        function refreshView() {
            const filtered = getFilteredList();
            renderStats(appState.warehouses);
            renderGridPods(filtered);
            renderWarehouseDataTable(filtered);
            applyUIPermissions();

        function getFilteredList() {
            return appState.warehouses.filter(w => {
                // 類型過濾
                if (appState.currentFilter !== 'ALL' && w.warehouse_type !== appState.currentFilter) {
                    return false;
                }
                // 關鍵字過濾
                if (appState.searchKeyword) {
                    const matchId = w.id.toLowerCase().includes(appState.searchKeyword);
                    const matchName = w.warehouse_name.toLowerCase().includes(appState.searchKeyword);
                    const matchAddress = (w.address || '').toLowerCase().includes(appState.searchKeyword);
                    return matchId || matchName || matchAddress;
                }
                return true;
            }).sort((a, b) => a.sort_order - b.sort_order);
        }

        function renderWarehouseDataTable(list) {
            const formattedData = list.map(w => formatTableRow(w));

            if (warehouseDataTableInstance) {
                warehouseDataTableInstance.clear();
                warehouseDataTableInstance.rows.add(formattedData);
                warehouseDataTableInstance.draw();
            } else {
                warehouseDataTableInstance = $('#warehouse-datatable').DataTable({
                    data: formattedData,
                    responsive: true,
                    pageLength: 5,
                    columns: [
                        { data: 'id' },
                        { data: 'name' },
                        { data: 'type' },
                        { data: 'country' },
                        { data: 'address' },
                        { data: 'phone' },
                        { data: 'hours' },
                        { data: 'status' },
                        { data: 'sort' },
                        { data: 'actions' }

                    language: {

                            last: "最後一頁",
                            next: "下一頁",
                            previous: "上一頁"
                        },
                        zeroRecords: "無符合據點資料"
                    }
                });

        function formatTableRow(w) {
            const hasAdminRights = isMasterAdmin();
            const flagCode = (w.country_code || 'tw').toLowerCase();

            let typeBadge = '<span class="badge badge-official">官方營運中心</span>';
            if (w.warehouse_type === 'PRIVATE_HUB') typeBadge = '<span class="badge badge-private">自用中繼倉</span>';
            if (w.warehouse_type === 'TRANSIT_OVERSEAS') typeBadge = '<span class="badge badge-overseas">海外跨境倉</span>';

            const activePill = w.is_active === 'Y' 
                ? '<span class="badge bg-success-subtle text-success">營運中</span>'
                : '<span class="badge bg-danger-subtle text-danger">已停用</span>';

            const actionButtons = hasAdminRights ? `
                <button class="btn btn-sm btn-outline-primary py-1 px-2" onclick="openEditModal('${w.id}')"><i class="fa-solid fa-pen"></i></button>
                <button class="btn btn-sm btn-outline-danger py-1 px-2 ms-1" onclick="deleteWarehouseItem('${w.id}')"><i class="fa-solid fa-trash-alt"></i></button>
            ` : '<span class="text-muted small"><i class="fa-solid fa-lock"></i> 唯讀</span>';

            return {
                id: `<span class="mono-num fw-bold text-info">${w.id}</span>`,
                name: `<div class="fw-bold text-white">${w.warehouse_name}</div>`,
                type: typeBadge,
                country: `<span class="fi fi-${flagCode} me-1"></span> ${w.country_code}`,
                address: `<div class="small text-secondary text-truncate" style="max-width: 180px;">${w.address || '-'}</div>`,
                phone: `<span class="mono-num small">${w.contact_phone || '-'}</span>`,
                hours: `<span class="small text-secondary">${w.operating_hours || '-'}</span>`,
                status: activePill,
                sort: `<span class="mono-num">${w.sort_order}</span>`,
                actions: actionButtons
            };
        }

            $('#fieldSortOrder').val(w.sort_order);
            $('#fieldIsActive').prop('checked', w.is_active === 'Y');
            $('#fieldCreatedAt').val(w.created_at);
            $('#fieldCreatedBy').val(w.created_by);

            new bootstrap.Modal(document.getElementById('warehouseModal')).show();
        }

        async function saveWarehouseItem() {
            const mode = $('#formMode').val();
            const id = $('#fieldId').val().trim();
            const name = $('#fieldName').val().trim();

            if (!id || !name) {
                AppToast.warning("據點代碼與據點名稱為必填欄位！");
                return;
            }

            const currentUser = getCurrentUser();
            const nowStr = getFormattedNow();

            const existing = appState.warehouses.find(w => w.id === id);
            const createdBy = (mode === 'edit' && existing) ? (existing.created_by || currentUser) : currentUser;
            const createdAt = (mode === 'edit' && existing) ? (existing.created_at || nowStr) : nowStr;

            // 依表 301 psi_warehouses 物理順序組成 rowData 陣列 (Index 0 ~ 14)
            const rowDataArray = [
                id,                                                     // Col 0: id
                name,                                                   // Col 1: warehouse_name
                $('#fieldType').val(),                                  // Col 2: warehouse_type
                $('#fieldCountry').val().toUpperCase(),                 // Col 3: country_code
                $('#fieldAddress').val().trim(),                        // Col 4: address
                $('#fieldPhone').val().trim(),                          // Col 5: contact_phone
                $('#fieldHours').val().trim(),                          // Col 6: operating_hours
                $('#fieldLatitude').val().trim() || '',                 // Col 7: latitude
                $('#fieldLongitude').val().trim() || '',                // Col 8: longitude
                $('#fieldIsActive').is(':checked') ? 'Y' : 'N',         // Col 9: is_active
                parseInt($('#fieldSortOrder').val(), 10) || 10,         // Col 10: sort_order
                createdBy,                                              // Col 11: created_by
                createdAt,                                              // Col 12: created_at
                currentUser,                                            // Col 13: modified_by
                nowStr                                                  // Col 14: modified_at
            ];

            const updatedObj = {
                id: id,
                warehouse_name: name,
                warehouse_type: $('#fieldType').val(),
                country_code: $('#fieldCountry').val().toUpperCase(),
                address: $('#fieldAddress').val().trim(),
                contact_phone: $('#fieldPhone').val().trim(),
                operating_hours: $('#fieldHours').val().trim(),
                latitude: parseFloat($('#fieldLatitude').val()) || null,
                longitude: parseFloat($('#fieldLongitude').val()) || null,
                is_active: $('#fieldIsActive').is(':checked') ? 'Y' : 'N',
                sort_order: parseInt($('#fieldSortOrder').val(), 10) || 10,
                created_by: createdBy,
                created_at: createdAt,
                modified_by: currentUser,
                modified_at: nowStr
            };

            const $btnSave = $('button[onclick="saveWarehouseItem()"]');
            try {
                $btnSave.prop('disabled', true).html('<i class="fa-solid fa-spinner fa-spin"></i> 寫入中...');

                if (window.SheetAdapter) {
                    if (mode === 'add') {
                        await SheetAdapter.createRow(SHEET_NAME, id, rowDataArray);
                        appState.warehouses.push(updatedObj);
                    } else {
                        await SheetAdapter.updateRow(SHEET_NAME, id, rowDataArray);
                        const index = appState.warehouses.findIndex(w => w.id === id);
                        if (index !== -1) appState.warehouses[index] = updatedObj;
                    }
                } else {
                    // 本地測試模式
                    if (mode === 'add') {
                        appState.warehouses.push(updatedObj);
                    } else {
                        const index = appState.warehouses.findIndex(w => w.id === id);
                        if (index !== -1) appState.warehouses[index] = updatedObj;
                    }
                }

                refreshView();

                const modalEl = document.getElementById('warehouseModal');
                const modalInstance = bootstrap.Modal.getInstance(modalEl);
                if (modalInstance) modalInstance.hide();

                AppToast.success(`據點【${id}】資料儲存成功！`);
            } catch (err) {
                AppToast.error("寫入失敗：" + err.message);
            } finally {
                $btnSave.prop('disabled', false).html('<i class="fa-solid fa-floppy-disk"></i> 儲存據點資料');
            }
        }

        async function deleteWarehouseItem(warehouseId) {
            if (!confirm(`確定要自 Google 試算表中永久刪除據點【${warehouseId}】嗎？`)) return;

            try {
                if (window.SheetAdapter) {
                    await SheetAdapter.deleteRow(SHEET_NAME, warehouseId);
                }
                appState.warehouses = appState.warehouses.filter(w => w.id !== warehouseId);
                refreshView();
                AppToast.success(`據點【${warehouseId}】已自雲端試算表刪除！`);
            } catch (err) {
                AppToast.error("刪除失敗：" + err.message);
            }
        }
    </script>
</body>
</html>
