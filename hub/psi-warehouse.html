<!DOCTYPE html>
<html lang="zh-TW" data-bs-theme="dark-purple">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>據點倉儲戰術調度中樞 | 葡眾三軌數位戰情系統</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/2.0.8/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap">

    <style>
        /* ==========================================================================
           核心版：暗夜魅影紫主題變數 (Dark Cyber Purple Tokens)
           ========================================================================== */
        :root, [data-bs-theme="dark-purple"] {
            --uvaco-bg-base: #0b0612;
            --uvaco-bg-surface: #140b22;
            --uvaco-bg-card: rgba(26, 14, 44, 0.75);
            --uvaco-bg-card-hover: rgba(38, 20, 64, 0.9);
            --uvaco-bg-glass: rgba(22, 11, 38, 0.65);
            
            --uvaco-primary: #8b5cf6;
            --uvaco-primary-rgb: 139, 92, 246;
            --uvaco-primary-hover: #7c3aed;
            --uvaco-primary-gradient: linear-gradient(135deg, #8b5cf6 0%, #d946ef 100%);
            
            --uvaco-secondary: #c084fc;
            --uvaco-accent: #38bdf8;
            --uvaco-warning: #fbbf24;
            --uvaco-danger: #f43f5e;
            --uvaco-success: #34d399;
            
            --uvaco-border: rgba(139, 92, 246, 0.22);
            --uvaco-border-glow: rgba(168, 85, 247, 0.45);
            
            --uvaco-text-main: #f3e8ff;
            --uvaco-text-muted: #a78bfa;
            --uvaco-text-sub: #94a3b8;
            
            --uvaco-radius-lg: 20px;
            --uvaco-radius-md: 14px;
            --uvaco-radius-sm: 8px;
            
            --uvaco-shadow-neon: 0 8px 32px 0 rgba(139, 92, 246, 0.18);
            --uvaco-font-mono: 'JetBrains Mono', monospace;
        }

        body {
            background-color: var(--uvaco-bg-base);
            background-image: 
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(217, 70, 239, 0.08) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(56, 189, 248, 0.04) 0px, transparent 60%);
            background-attachment: fixed;
            color: var(--uvaco-text-main);
            font-family: 'Noto Sans TC', sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* 玻璃擬態面板 */
        .glass-panel {
            background: var(--uvaco-bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--uvaco-border);
            border-radius: var(--uvaco-radius-lg);
            box-shadow: var(--uvaco-shadow-neon);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-panel:hover {
            border-color: var(--uvaco-border-glow);
        }

        /* 戰術抬頭 HUD 容器 */
        .hud-header {
            padding: 1.5rem;
            margin-bottom: 1.75rem;
            position: relative;
            overflow: hidden;
        }

        .hud-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--uvaco-primary-gradient);
        }

        .mono-num {
            font-family: var(--uvaco-font-mono);
            letter-spacing: -0.5px;
        }

        /* 呼吸燈指示點 */
        .live-pulse {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--uvaco-success);
            box-shadow: 0 0 10px var(--uvaco-success);
            animation: pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 8px rgba(52, 211, 153, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
        }

        /* 戰術維度切換 Pills */
        .btn-filter-pill {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(139, 92, 246, 0.25);
            color: var(--uvaco-text-muted);
            border-radius: 50px;
            padding: 0.45rem 1.1rem;
            font-size: 0.88rem;
            font-weight: 500;
            transition: all 0.25s ease;
        }

        .btn-filter-pill:hover, .btn-filter-pill.active {
            background: var(--uvaco-primary-gradient);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
            transform: translateY(-1px);
        }

        /* 倉儲全息數位艙 (Digital Twin Pod) */
        .warehouse-pod {
            position: relative;
            background: var(--uvaco-bg-card);
            border: 1px solid var(--uvaco-border);
            border-radius: var(--uvaco-radius-lg);
            padding: 1.5rem;
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .warehouse-pod:hover {
            transform: translateY(-6px);
            background: var(--uvaco-bg-card-hover);
            border-color: var(--uvaco-secondary);
            box-shadow: 0 16px 36px rgba(139, 92, 246, 0.25);
        }

        .warehouse-pod::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: rgba(255, 255, 255, 0.06);
            transition: all 0.3s;
        }

        .warehouse-pod.type-official::after { background: #38bdf8; }
        .warehouse-pod.type-overseas::after { background: #e879f9; }
        .warehouse-pod.type-private::after { background: #8b5cf6; }

        .pod-type-badge {
            font-size: 0.72rem;
            text-transform: uppercase;
            padding: 0.25rem 0.65rem;
            border-radius: 6px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .badge-official { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
        .badge-overseas { background: rgba(232, 121, 249, 0.15); color: #e879f9; border: 1px solid rgba(232, 121, 249, 0.3); }
        .badge-private { background: rgba(139, 92, 246, 0.15); color: #c084fc; border: 1px solid rgba(139, 92, 246, 0.3); }

        /* 水位進度條與微光 */
        .capacity-track {
            height: 7px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .capacity-bar {
            height: 100%;
            border-radius: 10px;
            transition: width 1s ease-in-out;
        }

        .cap-safe { background: linear-gradient(90deg, #34d399, #10b981); }
        .cap-warn { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
        .cap-danger { background: linear-gradient(90deg, #f43f5e, #e11d48); }

        /* 戰備動作按鈕 */
        .pod-action-btn {
            background: rgba(139, 92, 246, 0.12);
            border: 1px solid rgba(139, 92, 246, 0.3);
            color: var(--uvaco-text-main);
            border-radius: var(--uvaco-radius-sm);
            padding: 0.4rem 0.75rem;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .pod-action-btn:hover {
            background: var(--uvaco-primary);
            color: #fff;
            border-color: var(--uvaco-primary);
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.5);
        }

        /* 跨國調度管線 (Logistics Pipeline Strip) */
        .pipeline-card {
            background: linear-gradient(135deg, rgba(26, 14, 44, 0.9) 0%, rgba(17, 7, 31, 0.95) 100%);
            border: 1px dashed rgba(168, 85, 247, 0.35);
            border-radius: var(--uvaco-radius-lg);
            padding: 1.25rem 1.5rem;
        }

        .pipeline-node {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .pipeline-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--uvaco-secondary);
            font-size: 1.1rem;
        }

        /* 抽屜與彈窗自訂樣式 */
        .offcanvas-purple {
            background: #110820;
            color: var(--uvaco-text-main);
            border-left: 1px solid var(--uvaco-border-glow);
        }

        .modal-content-purple {
            background: #150a26;
            border: 1px solid var(--uvaco-border-glow);
            color: var(--uvaco-text-main);
            border-radius: var(--uvaco-radius-lg);
        }

        /* DataTable 暗夜魅影紫客製化 */
        .table-purple {
            --bs-table-bg: transparent;
            --bs-table-color: var(--uvaco-text-main);
            border-color: rgba(139, 92, 246, 0.15);
        }

        .table-purple th {
            background: rgba(139, 92, 246, 0.1);
            color: var(--uvaco-secondary);
            font-weight: 600;
            border-bottom: 2px solid rgba(139, 92, 246, 0.3);
            font-size: 0.85rem;
        }

        .table-purple td {
            vertical-align: middle;
            border-bottom: 1px solid rgba(139, 92, 246, 0.12);
            font-size: 0.88rem;
        }

        .dataTables_wrapper .dataTables_paginate .paginate_button.current {
            background: var(--uvaco-primary) !important;
            border-color: var(--uvaco-primary) !important;
            color: #fff !important;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <main class="container-fluid px-3 px-lg-4 py-3">

        <section class="glass-panel hud-header">
            <div class="row align-items-center g-3">
                <div class="col-12 col-xl-5">
                    <div class="d-flex align-items-center gap-3">
                        <div class="pipeline-icon" style="width: 48px; height: 48px; font-size: 1.4rem;">
                            <i class="fa-solid fa-boxes-stacked"></i>
                        </div>
                        <div>
                            <div class="d-flex align-items-center gap-2">
                                <span class="live-pulse"></span>
                                <span class="badge bg-dark border border-purple text-uppercase" style="font-size: 0.7rem; color: #c084fc;">
                                    <i class="fa-solid fa-shield-halved"></i> 核心極密授權
                                </span>
                                <span class="text-secondary small">|</span>
                                <span class="text-secondary small mono-num" id="current-timestamp">2026-08-19 12:00:00</span>
                            </div>
                            <h2 class="h4 mb-0 fw-bold mt-1 text-white">
                                <i class="fa-solid fa-warehouse text-primary"></i> 全域據點倉儲調度中樞
                            </h2>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-xl-7">
                    <div class="row g-2 text-center text-md-start">
                        <div class="col-6 col-sm-3">
                            <div class="p-2 rounded" style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(139, 92, 246, 0.15);">
                                <div class="text-secondary small">
                                    <span class="fi fi-tw me-1"></span> 台灣戰區據點
                                </div>
                                <div class="h5 mb-0 fw-bold mono-num text-info mt-1" id="stat-tw-count">4 處</div>
                            </div>
                        </div>
                        <div class="col-6 col-sm-3">
                            <div class="p-2 rounded" style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(139, 92, 246, 0.15);">
                                <div class="text-secondary small">
                                    <span class="fi fi-my me-1"></span> 大馬前進樞紐
                                </div>
                                <div class="h5 mb-0 fw-bold mono-num text-warning mt-1" id="stat-my-count">2 處</div>
                            </div>
                        </div>
                        <div class="col-6 col-sm-3">
                            <div class="p-2 rounded" style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(139, 92, 246, 0.15);">
                                <div class="text-secondary small">
                                    <i class="fa-solid fa-boxes-packing text-secondary"></i> 現存總盒數
                                </div>
                                <div class="h5 mb-0 fw-bold mono-num text-white mt-1" id="stat-total-boxes">1,480 盒</div>
                            </div>
                        </div>
                        <div class="col-6 col-sm-3">
                            <div class="p-2 rounded" style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(139, 92, 246, 0.15);">
                                <div class="text-secondary small">
                                    <i class="fa-solid fa-sack-dollar text-success"></i> 總庫存貨值
                                </div>
                                <div class="h5 mb-0 fw-bold mono-num text-success mt-1" id="stat-total-value">NT$ 2.45M</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row align-items-center justify-content-between g-3 mt-2 pt-3 border-top border-purple-subtle" style="border-color: rgba(139, 92, 246, 0.15) !important;">
                <div class="col-12 col-lg-7">
                    <div class="d-flex flex-wrap gap-2 align-items-center">
                        <span class="text-secondary small me-1">
                            <i class="fa-solid fa-filter"></i> 據點類型：
                        </span>
                        <button class="btn btn-filter-pill active" data-filter="ALL">
                            <i class="fa-solid fa-border-all"></i> 全部倉儲 (<span id="count-all">6</span>)
                        </button>
                        <button class="btn btn-filter-pill" data-filter="OFFICIAL">
                            <i class="fa-solid fa-building-flag"></i> 官方營業處 (<span id="count-official">3</span>)
                        </button>
                        <button class="btn btn-filter-pill" data-filter="OVERSEAS">
                            <i class="fa-solid fa-plane-departure"></i> 海外拓荒樞紐 (<span id="count-overseas">1</span>)
                        </button>
                        <button class="btn btn-filter-pill" data-filter="PRIVATE">
                            <i class="fa-solid fa-vault"></i> 核心私有庫 (<span id="count-private">2</span>)
                        </button>
                    </div>
                </div>

                <div class="col-12 col-lg-5">
                    <div class="d-flex justify-content-lg-end gap-2">
                        <div class="input-group input-group-sm" style="max-width: 220px;">
                            <span class="input-group-text bg-dark border-purple text-secondary" style="border-color: rgba(139, 92, 246, 0.25);">
                                <i class="fa-solid fa-magnifying-glass"></i>
                            </span>
                            <input type="text" id="quick-search" class="form-control bg-dark text-white border-purple" placeholder="過濾代碼 / 名稱..." style="border-color: rgba(139, 92, 246, 0.25);">
                        </div>
                        
                        <div class="btn-group btn-group-sm">
                            <button class="btn btn-outline-secondary active" id="view-grid-btn" title="全息艙位卡視圖">
                                <i class="fa-solid fa-grip"></i>
                            </button>
                            <button class="btn btn-outline-secondary" id="view-table-btn" title="詳細盤點表視圖">
                                <i class="fa-solid fa-list-check"></i>
                            </button>
                        </div>

                        <button class="btn btn-sm btn-primary px-3" id="btn-open-dispatch" data-bs-toggle="offcanvas" data-bs-target="#offcanvasDispatch">
                            <i class="fa-solid fa-paper-plane"></i> 快速調撥
                        </button>
                        <button class="btn btn-sm btn-outline-light" id="btn-sync-gviz" title="同步 Google 試算表">
                            <i class="fa-solid fa-arrows-rotate"></i>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <section class="pipeline-card mb-4">
            <div class="row align-items-center g-3">
                <div class="col-12 col-md-3">
                    <div class="pipeline-node">
                        <div class="pipeline-icon">
                            <i class="fa-solid fa-truck-fast"></i>
                        </div>
                        <div>
                            <div class="text-uppercase small text-secondary fw-bold">在途戰略物資</div>
                            <div class="h6 mb-0 text-white fw-bold">跨國調撥即時管線</div>
                        </div>
                    </div>
                </div>
                
                <div class="col-12 col-md-9">
                    <div class="row g-2 align-items-center">
                        <div class="col-12 col-lg-6">
                            <div class="p-2 rounded d-flex align-items-center justify-content-between" style="background: rgba(139, 92, 246, 0.08); border: 1px solid rgba(139, 92, 246, 0.2);">
                                <div class="d-flex align-items-center gap-2">
                                    <span class="badge bg-warning text-dark"><i class="fa-solid fa-plane"></i> 航空空運中</span>
                                    <span class="small text-white">台北總倉 ➔ 吉隆坡前進基地</span>
                                </div>
                                <div class="text-end">
                                    <span class="small mono-num text-info fw-bold">40 盒 樟芝/康貝兒</span>
                                    <span class="badge bg-dark border border-secondary text-secondary ms-1">預計 08/22 抵達</span>
                                </div>
                            </div>
                        </div>
                        <div class="col-12 col-lg-6">
                            <div class="p-2 rounded d-flex align-items-center justify-content-between" style="background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.2);">
                                <div class="d-flex align-items-center gap-2">
                                    <span class="badge bg-info text-dark"><i class="fa-solid fa-van-shuttle"></i> 同城調撥</span>
                                    <span class="small text-white">榮祥私倉 ➔ 台北營業處自提</span>
                                </div>
                                <div class="text-end">
                                    <span class="small mono-num text-success fw-bold">15 盒 995飲品</span>
                                    <span class="badge bg-dark border border-secondary text-secondary ms-1">本日 16:30 前</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section id="warehouse-grid-container" class="row g-3 mb-4">
            </section>

        <section id="warehouse-table-container" class="glass-panel p-3 d-none mb-4">
            <div class="d-flex align-items-center justify-content-between mb-3">
                <h5 class="mb-0 text-white fw-bold">
                    <i class="fa-solid fa-table-cells text-secondary"></i> 全域據點倉儲精確庫存與負責人總表
                </h5>
                <span class="badge bg-purple-subtle text-white border border-purple">
                    <i class="fa-solid fa-circle-check text-success"></i> 實時同步完成
                </span>
            </div>
            <div class="table-responsive">
                <table id="warehouse-datatable" class="table table-purple table-hover align-middle w-100">
                    <thead>
                        <tr>
                            <th>代碼</th>
                            <th>據點名稱</th>
                            <th>類型</th>
                            <th>地區</th>
                            <th>當前庫存 / 水位</th>
                            <th>現存貨值 (TWD)</th>
                            <th>負責人 / 電話</th>
                            <th>警報狀態</th>
                            <th class="text-end">調度操作</th>
                        </tr>
                    </thead>
                    <tbody id="warehouse-table-body">
                        </tbody>
                </table>
            </div>
        </section>

    </main>

    <div class="offcanvas offcanvas-end offcanvas-purple" tabindex="-1" id="offcanvasDispatch" aria-labelledby="offcanvasDispatchLabel" style="width: 420px;">
        <div class="offcanvas-header border-bottom border-purple" style="border-color: rgba(139, 92, 246, 0.2) !important;">
            <h5 class="offcanvas-title fw-bold text-white" id="offcanvasDispatchLabel">
                <i class="fa-solid fa-dolly text-primary"></i> 發起戰略物資調撥單
            </h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <form id="form-quick-dispatch">
                <div class="mb-3">
                    <label class="form-label text-secondary small fw-bold">調撥單號 (自動生成)</label>
                    <input type="text" class="form-control bg-dark text-white mono-num border-purple" value="TR-20260819-003" readonly style="border-color: rgba(139, 92, 246, 0.25);">
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label class="form-label text-secondary small fw-bold">來源出庫倉</label>
                        <select class="form-select bg-dark text-white border-purple" id="dispatch-from-wh" style="border-color: rgba(139, 92, 246, 0.25);">
                            <option value="WH-TW-N01">台北總倉 (WH-TW-N01)</option>
                            <option value="HUB-RAY-01" selected>榮祥核心私倉 (HUB-RAY-01)</option>
                            <option value="WH-MY-KL01">吉隆坡前進基地</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <label class="form-label text-secondary small fw-bold">目的入庫倉</label>
                        <select class="form-select bg-dark text-white border-purple" id="dispatch-to-wh" style="border-color: rgba(139, 92, 246, 0.25);">
                            <option value="WH-MY-KL01" selected>吉隆坡前進基地 (WH-MY-KL01)</option>
                            <option value="WH-TW-N01">台北總倉 (WH-TW-N01)</option>
                            <option value="WH-TW-C01">台中營業處自提</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label text-secondary small fw-bold">調撥品項與規格</label>
                    <select class="form-select bg-dark text-white border-purple" id="dispatch-product" style="border-color: rgba(139, 92, 246, 0.25);">
                        <option value="0303001">TW0303001 - 葡眾樟芝益 (24包/盒)</option>

                const twCount = list.filter(w => w.region === 'TW').length;

                const totalBoxes = list.reduce((sum, w) => sum + Number(w.totalBoxes || 0), 0);

                const keyword = $('#quick-search').val().toLowerCase().trim();

                let filtered = activeWarehouseList.filter(item => {
                    // 類型標籤過濾
                    if (currentFilter === 'OFFICIAL' && item.type !== 'OFFICIAL_CENTER') return false;
                    if (currentFilter === 'OVERSEAS' && item.type !== 'TRANSIT_OVERSEAS') return false;
                    if (currentFilter === 'PRIVATE' && item.type !== 'PRIVATE_HUB') return false;

                    // 關鍵字過濾
                    if (keyword) {
                        const matchCode = item.code.toLowerCase().includes(keyword);
                        const matchName = item.name.toLowerCase().includes(keyword);
                        const matchContact = item.contact.toLowerCase().includes(keyword);
                        return matchCode || matchName || matchContact;
                    }
                    return true;

                renderWarehouseTable(filtered);

                                    <td><span class="badge bg-warning-subtle text-warning">近效期促銷</span></td>
                                </tr>
                                <tr>
                                    <td class="mono-num">TW0303003</td>
                                    <td>995超級營養液</td>
                                    <td class="mono-num">L260719C</td>

                const detailModal = new bootstrap.Modal(document.getElementById('modalWarehouseDetail'));
                detailModal.show();

            // 點擊快捷調撥按鈕
            $(document).on('click', '.btn-quick-transfer', function () {
                const whCode = $(this).data('code');
                $('#dispatch-from-wh').val(whCode);
                const offcanvas = new bootstrap.Offcanvas(document.getElementById('offcanvasDispatch'));
                offcanvas.show();
            });

            // 發起調撥確認
            $('#btn-submit-dispatch').on('click', function () {
                const btn = $(this);
                btn.prop('disabled', true).html('<i class="fa-solid fa-spinner fa-spin"></i> 鎖定庫存並建立單據中...');

                setTimeout(() => {
                    btn.prop('disabled', false).html('<i class="fa-solid fa-check"></i> 確認建立調撥並鎖定庫存');
                    const offcanvas = bootstrap.Offcanvas.getInstance(document.getElementById('offcanvasDispatch'));
                    offcanvas.hide();
                    alert('【戰術調撥成功】調撥單號 TR-20260819-003 已建立，已發送跨國在途物流通知！');
                }, 700);
            });

            // 試算表同步按鈕
            $('#btn-sync-gviz').on('click', function () {
                const btn = $(this);
                btn.prop('disabled', true).html('<i class="fa-solid fa-arrows-rotate fa-spin"></i>');
                
                setTimeout(() => {
                    btn.prop('disabled', false).html('<i class="fa-solid fa-arrows-rotate"></i>');
                    updateTopMetrics(activeWarehouseList);
                    applyFilters();
                }, 600);
            });

            // 初始化加載
            updateTopMetrics(activeWarehouseList);
            applyFilters();
        });
    </script>
