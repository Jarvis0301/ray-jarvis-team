<!DOCTYPE html>
<html lang="zh-TW" data-bs-theme="dark-purple">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>據點倉儲調度中樞 (H31000) | 榮祥團隊戰術控制台</title>
        
        <!-- 認證守衛 -->
        <script src="../assets/js/auth-guard.js"></script>
        
        <!-- 第三方函式庫加載器 -->
        <script src="../assets/js/vendor-loader.js"></script>

        <!-- 共用核心模組 -->
        <script src="../assets/js/common.js"></script>
        <link rel="stylesheet" href="../assets/css/common.css">

        <!-- 頁面專屬 -->
        <script src="./js/psi-warehouse.js" defer></script>
        <link rel="stylesheet" href="./css/psi-warehouse.css">
    </head>
    
    <body>
        <main class="container-fluid p-3 p-md-4">

            <header class="glass-panel mb-4">
                <div class="row align-items-center g-3">
                    <div class="col-12 col-xl-5">
                        <div class="h4 fw-bold text-white">
                            <i class="fa-solid fa-map-location-dot text-primary"></i> 據點倉儲
                        </div>
                    </div>

                    <div class="col-12 col-xl-7">
                        <div class="row g-2 text-center text-md-start">
                            <div class="col-6 col-sm-3">
                                <div class="hud-pill">
                                    <div class="text-secondary">
                                        <span class="flag-icon flag-tw me-1"></span> 台灣據點
                                    </div>
                                    <div class="h5 mb-0 fw-bold mono-num text-info mt-1" id="stat-tw-count">0 處</div>
                                </div>
                            </div>
                            <div class="col-6 col-sm-3">
                                <div class="hud-pill">
                                    <div class="text-secondary">
                                        <span class="flag-icon flag-my me-1"></span> 大馬據點
                                    </div>
                                    <div class="h5 mb-0 fw-bold mono-num text-warning mt-1" id="stat-my-count">0 處</div>
                                </div>
                            </div>
                            <div class="col-6 col-sm-3">
                                <div class="hud-pill">
                                    <div class="text-secondary">
                                        <i class="fa-solid fa-vault text-secondary"></i> 自用常備倉
                                    </div>
                                    <div class="h5 mb-0 fw-bold mono-num text-white mt-1" id="stat-private-count">0 處</div>
                                </div>
                            </div>
                            <div class="col-6 col-sm-3">
                                <div class="hud-pill">
                                    <div class="text-secondary">
                                        <i class="fa-solid fa-circle-check text-success"></i> 營運中比例
                                    </div>
                                    <div class="h5 mb-0 fw-bold mono-num text-success mt-1" id="stat-active-rate">0%</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 控制列 -->
                <div class="row align-items-center justify-content-between g-3 mt-2 pt-3 border-top border-purple-subtle">
                    <div class="col-12 col-lg-7">
                        <div class="d-flex flex-wrap gap-2 align-items-center">
                            <button type="button" class="filter-pill-btn active" data-filter="ALL">
                                <i class="fa-solid fa-border-all"></i> 全部 (<span id="count-all">0</span>)
                            </button>
                            <button type="button" class="filter-pill-btn" data-filter="官方營運中心">
                                <i class="fa-solid fa-building-flag"></i> 官方營運中心 (<span id="count-official">0</span>)
                            </button>
                            <button type="button" class="filter-pill-btn" data-filter="自用常備倉">
                                <i class="fa-solid fa-vault"></i> 自用常備倉 (<span id="count-private">0</span>)
                            </button>
                            <button type="button" class="filter-pill-btn" data-filter="海外商務倉">
                                <i class="fa-solid fa-plane-departure"></i> 海外商務倉 (<span id="count-overseas">0</span>)
                            </button>
                            <button type="button" class="filter-pill-btn" data-filter="物流在途倉">
                                <i class="fa-solid fa-truck-fast"></i> 物流在途倉 (<span id="count-transit">0</span>)
                            </button>
                        </div>
                    </div>

                    <div class="col-12 col-lg-4">
                        <div class="d-flex justify-content-lg-end gap-2">
                            <div class="input-group input-group-sm" style="max-width: 50%">
                                <span class="input-group-text bg-dark border-purple text-secondary">
                                    <i class="fa-solid fa-magnifying-glass"></i>
                                </span>
                                <input type="text" id="quick-search" class="form-control form-control-sm" placeholder="代碼 / 名稱...">
                            </div>

                            <div class="btn-group btn-group-sm">
                                <button class="btn btn-outline-secondary active" id="view-grid-btn" title="網格卡片視圖">
                                    <i class="fa-solid fa-grip"></i> 卡片
                                </button>
                                <button class="btn btn-outline-secondary" id="view-table-btn" title="數據表格視圖">
                                    <i class="fa-solid fa-table-list"></i> 表格
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 col-lg-1 d-flex justify-content-lg-end">
                        <button class="btn btn-secondary btn-sm rounded-pill" id="btnOpenAddModal" onclick="openAddModal()">
                            <i class="fa-solid fa-plus"></i> 新增據點
                        </button>
                    </div>
                </div>
            </header>

            <section id="warehouse-grid-container" class="row g-3 mb-4"></section>

            <section id="warehouse-table-container" class="glass-panel p-3 d-none mb-4">
                <div class="d-flex align-items-center justify-content-between mb-3">
                    <h5 class="mb-0 text-white fw-bold">
                        <i class="fa-solid fa-table-cells text-secondary"></i> 據點倉儲總表
                    </h5>
                </div>
                <div class="table-responsive">
                    <table id="warehouse-datatable" class="table table-dark-custom table-hover align-middle w-100">
                        <thead>
                            <tr>
                                <th>據點</th>
                                <th>類型</th>
                                <th>市場</th>
                                <th>地址</th>
                                <th>電話</th>
                                <th>營業時間</th>
                                <th>狀態</th>
                                <th class="text-end">操作</th>
                            </tr>
                        </thead>
                        <tbody id="warehouse-table-body"></tbody>
                    </table>
                </div>
            </section>

        </main>

        <div class="modal fade" id="warehouseModal" tabindex="-1" aria-labelledby="warehouseModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <section class="modal-content">
                    <header class="modal-header border-bottom border-secondary border-opacity-25 py-3 px-4">
                        <h5 class="modal-title fw-bold text-white" id="warehouseModalLabel">
                            <i class="fa-solid fa-warehouse text-primary"></i> 據點倉儲配置
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </header>
                    <div class="modal-body p-3 p-md-4">
                        <form id="warehouseForm">
                            <input type="hidden" id="formMode" value="add">
                            <input type="hidden" id="fieldCreatedAt" value="">
                            <input type="hidden" id="fieldCreatedBy" value="">

                            <div class="row g-3 mb-3">
                                <div class="col-12 col-md-6">
                                    <label class="form-label" for="fieldId">據點唯一代碼 <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control form-control-sm mono-num" id="fieldId" placeholder="如：WH-TW-TP, WH-HOME-RAY" required>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label class="form-label" for="fieldName">據點中文名稱 <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control form-control-sm" id="fieldName" placeholder="如：台北總公司營運中心" required>
                                </div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-12 col-md-6">
                                    <label class="form-label" for="fieldType">倉儲類型 <span class="text-danger">*</span></label>
                                    <select class="form-select form-select-sm" id="fieldType" required>
                                        <option value="官方營運中心">官方營運中心</option>
                                        <option value="自用常備倉">自用常備倉</option>
                                        <option value="海外商務倉">海外商務倉</option>
                                        <option value="物流在途倉">物流在途倉</option>
                                    </select>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label class="form-label" for="fieldCountry">所屬市場 <span class="text-danger">*</span></label>
                                    <select class="form-select form-select-sm" id="fieldCountry" required>
                                        <option value="TW">TW (台灣市場)</option>
                                        <option value="MY">MY (馬來西亞市場)</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="fieldAddress">據點實體地址</label>
                                <input type="text" class="form-control form-control-sm" id="fieldAddress" placeholder="輸入完整實體地址，供地圖導航與單據標記">
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="fieldRemarks">據點備註</label>
                                <input type="text" class="form-control form-control-sm" id="fieldRemarks" placeholder="如：提貨櫃台在 2F、大馬公寓物業門禁密碼、特約停車折抵方式">
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-12 col-md-6">
                                    <label class="form-label" for="fieldPhone">聯絡專線</label>
                                    <input type="text" class="form-control form-control-sm mono-num" id="fieldPhone" placeholder="如：02-2791-1055">
                                </div>
                                <div class="col-12 col-md-6">
                                    <label class="form-label" for="fieldHours">營業開放時間</label>
                                    <input type="text" class="form-control form-control-sm" id="fieldHours" placeholder="如：週一至週五 09:00 - 18:00">
                                </div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-12 col-md-6">
                                    <label class="form-label" for="fieldLongitude">經度座標</label>
                                    <input type="text" class="form-control form-control-sm mono-num" id="fieldLongitude" placeholder="如：121.5746">
                                </div>
                                <div class="col-12 col-md-6">
                                    <label class="form-label" for="fieldLatitude">緯度座標</label>
                                    <input type="text" class="form-control form-control-sm mono-num" id="fieldLatitude" placeholder="如：25.0601">
                                </div>
                            </div>

                            <div class="form-check form-switch mt-3">
                                <input class="form-check-input" type="checkbox" role="switch" id="fieldIsActive" checked>
                                <label class="form-check-label text-white fw-bold" for="fieldIsActive">
                                    <i class="fa-solid fa-power-off text-success"></i> 啟用此據點營運
                                </label>
                            </div>
                        </form>
                    </div>
                    <footer class="modal-footer border-top border-secondary border-opacity-25 d-flex justify-content-end gap-2 p-3">
                        <button type="button" class="btn btn-muted btn-sm rounded-pill px-3" data-bs-dismiss="modal">
                            <i class="fa-solid fa-xmark"></i> 取消
                        </button>
                        <button type="button" class="btn btn-secondary btn-sm rounded-pill px-3" onclick="saveWarehouseItem()">
                            <i class="fa-solid fa-floppy-disk"></i> 儲存
                        </button>
                    </footer>
                </section>
            </div>
        </div>

    </body>
</html>
