<!DOCTYPE html>
<html lang="zh-TW" data-bs-theme="dark-purple">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>據點倉儲 | 榮祥團隊 - 核心版</title>
        
        <!-- 認證守衛 -->
        <script src="../assets/js/auth-guard.js"></script>
        
        <!-- 第三方函式庫加載器 -->
        <script src="../assets/js/vendor-loader.js"></script>

        <!-- 共用核心模組 -->
        <script src="../assets/js/common.js"></script>
        <link rel="stylesheet" href="../assets/css/common.css">

        <!-- 頁面專屬 -->
        <script src="./js/psi-warehouse.js" defer></script>
        <link rel="stylesheet" href="./css/psi-warehouse.css">
    </head>
    
    <body>
        <main class="container-fluid p-3 p-md-4">

            <header class="row align-items-center mb-3">
                <h4 class="fw-bold mb-0 text-light">
                    <i class="fa-solid fa-map-location-dot text-primary me-1"></i>據點倉儲
                </h4>
            </header>

            <section class="glass-panel hud-bar mb-3">
                <div class="row align-items-center g-3 mb-3">
                    <div class="col-12">
                        <div class="row row-cols-2 row-cols-md-3 row-cols-xl-6 g-2">
                            <div class="col">
                                <div class="stat-chip">
                                    <span class="text-secondary"><i class="flag-icon flag-tw me-1"></i>台灣據點</span>
                                    <span class="text-cyan fs-6 fw-bold mono-num" id="stat-tw-count">0</span>
                                </div>
                            </div>
                            <div class="col">
                                <div class="stat-chip">
                                    <span class="text-secondary"><i class="flag-icon flag-my me-1"></i>大馬據點</span>
                                    <span class="text-yellow fs-6 fw-bold mono-num" id="stat-my-count">0</span>
                                </div>
                            </div>
                            <div class="col">
                                <div class="stat-chip">
                                    <span class="text-secondary"><i class="fa-solid fa-building-flag text-primary me-1"></i>官方營運中心</span>
                                    <span class="text-primary fs-6 fw-bold mono-num" id="stat-official-count">0</span>
                                </div>
                            </div>
                            <div class="col">
                                <div class="stat-chip">
                                    <span class="text-secondary"><i class="fa-solid fa-vault text-teal me-1"></i>自用倉儲</span>
                                    <span class="text-teal fs-6 fw-bold mono-num" id="stat-private-count">0</span>
                                </div>
                            </div>
                            <div class="col">
                                <div class="stat-chip">
                                    <span class="text-secondary"><i class="fa-solid fa-plane-departure text-orange me-1"></i>海外倉儲</span>
                                    <span class="text-orange fs-6 fw-bold mono-num" id="stat-overseas-count">0</span>
                                </div>
                            </div>
                            <div class="col">
                                <div class="stat-chip">
                                    <span class="text-secondary"><i class="fa-solid fa-check-circle text-success me-1"></i>營運中</span>
                                    <span class="text-success fs-6 fw-bold mono-num" id="stat-active-count">0</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 控制列 -->
                <div class="row align-items-center g-3 mt-2 border-top border-purple-subtle">
                    <div class="col-12 col-md-12 col-xl-6">
                        <div class="row row-cols-2 row-cols-md-auto g-2">
                            <div class="col col-12">
                                <button type="button" class="filter-pill-btn w-100 active" data-filter="ALL">
                                    <i class="fa-solid fa-border-all me-1"></i>全部
                                </button>
                            </div>
                            <div class="col">
                                <button type="button" class="filter-pill-btn w-100" data-filter="官方營運中心">
                                    <i class="fa-solid fa-building-flag me-1"></i>官方營運中心
                                </button>
                            </div>
                            <div class="col">
                                <button type="button" class="filter-pill-btn w-100" data-filter="自用常備倉">
                                    <i class="fa-solid fa-vault me-1"></i>自用常備倉
                                </button>
                            </div>
                            <div class="col">
                                <button type="button" class="filter-pill-btn w-100" data-filter="海外商務倉">
                                    <i class="fa-solid fa-plane-departure me-1"></i>海外商務倉
                                </button>
                            </div>
                            <div class="col">
                                <button type="button" class="filter-pill-btn w-100" data-filter="物流在途倉">
                                    <i class="fa-solid fa-truck-fast me-1"></i>物流在途倉
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 col-md-6 col-xl-2">
                        <div class="input-group input-group-sm">
                            <span class="input-group-text bg-dark border-purple text-secondary">
                                <i class="fa-solid fa-magnifying-glass"></i>
                            </span>
                            <input type="text" id="quick-search" class="form-control form-control-sm" placeholder="代碼 / 名稱...">
                        </div>
                    </div>

                    <div class="col-12 col-md-4 col-xl-2">
                        <div class="row">
                            <div class="col btn-group btn-group-sm">
                                <button class="btn btn-outline-secondary btn-sm active" id="view-grid-btn" title="網格卡片視圖">
                                    <i class="fa-solid fa-grip me-1"></i>卡片
                                </button>
                                <button class="btn btn-outline-secondary btn-sm" id="view-table-btn" title="數據表格視圖">
                                    <i class="fa-solid fa-table-list me-1"></i>表格
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 col-md-2 col-xl-2 d-flex justify-content-md-end">
                        <button class="btn btn-secondary btn-sm rounded-pill w-100" id="btnOpenAddModal" onclick="openAddModal()">
                            <i class="fa-solid fa-plus me-1"></i>新增據點
                        </button>
                    </div>
                </div>
            </section>

            <section id="warehouse-grid-container" class="row g-3 mb-4"></section>

            <section id="warehouse-table-container" class="glass-panel p-3 d-none mb-4">
                <div class="d-flex align-items-center justify-content-between mb-3">
                    <h5 class="mb-0 text-white fw-bold">
                        <i class="fa-solid fa-table-cells text-secondary me-1"></i>據點倉儲總表
                    </h5>
                </div>
                <div class="table-responsive">
                    <table id="warehouse-datatable" class="table table-dark-custom table-hover align-middle w-100">
                        <thead>
                            <tr>
                                <th>據點</th>
                                <th>類型</th>
                                <th>市場</th>
                                <th>地址</th>
                                <th>電話</th>
                                <th>營業時間</th>
                                <th>狀態</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="warehouse-table-body"></tbody>
                    </table>
                </div>
            </section>

        </main>

        <div class="modal fade" id="warehouseModal" tabindex="-1" aria-labelledby="warehouseModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <section class="modal-content">
                    <header class="modal-header border-bottom border-secondary border-opacity-25 py-3 px-4">
                        <h5 class="modal-title fw-bold text-white" id="warehouseModalLabel">
                            <i class="fa-solid fa-warehouse text-primary me-1"></i>據點倉儲配置
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </header>
                    <div class="modal-body p-3 p-md-4">
                        <form id="warehouseForm">
                            <input type="hidden" id="formMode" value="add">
                            <input type="hidden" id="fieldCreatedAt" value="">
                            <input type="hidden" id="fieldCreatedBy" value="">

                            <div class="row g-3 mb-3">
                                <div class="col-12 col-md-6">
                                    <label class="form-label" for="fieldId">據點唯一代碼 <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control form-control-sm mono-num" id="fieldId" placeholder="如：WH-TW-TP, WH-HOME-RAY" required>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label class="form-label" for="fieldName">據點中文名稱 <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control form-control-sm" id="fieldName" placeholder="如：台北總公司營運中心" required>
                                </div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-12 col-md-6">
                                    <label class="form-label" for="fieldType">倉儲類型 <span class="text-danger">*</span></label>
                                    <select class="form-select form-select-sm" id="fieldType" required>
                                        <option value="官方營運中心">官方營運中心</option>
                                        <option value="自用常備倉">自用常備倉</option>
                                        <option value="海外商務倉">海外商務倉</option>
                                        <option value="物流在途倉">物流在途倉</option>
                                    </select>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label class="form-label" for="fieldCountry">所屬市場 <span class="text-danger">*</span></label>
                                    <select class="form-select form-select-sm" id="fieldCountry" required>
                                        <option value="TW">🇹🇼 台灣 (TW)</option>
                                        <option value="MY">🇲🇾 馬來西亞 (MY)</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="fieldAddress">據點實體地址</label>
                                <input type="text" class="form-control form-control-sm" id="fieldAddress" placeholder="輸入完整實體地址，供地圖導航與單據標記">
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="fieldRemarks">據點備註</label>
                                <input type="text" class="form-control form-control-sm" id="fieldRemarks" placeholder="如：提貨櫃台在 2F、大馬公寓物業門禁密碼、特約停車折抵方式">
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-12 col-md-6">
                                    <label class="form-label" for="fieldPhone">聯絡專線</label>
                                    <input type="text" class="form-control form-control-sm mono-num" id="fieldPhone" placeholder="如：02-2791-1055">
                                </div>
                                <div class="col-12 col-md-6">
                                    <label class="form-label" for="fieldHours">營業開放時間</label>
                                    <input type="text" class="form-control form-control-sm" id="fieldHours" placeholder="如：週一至週五 09:00 - 18:00">
                                </div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-12 col-md-6">
                                    <label class="form-label" for="fieldLongitude">經度座標</label>
                                    <input type="text" class="form-control form-control-sm mono-num" id="fieldLongitude" placeholder="如：121.5746">
                                </div>
                                <div class="col-12 col-md-6">
                                    <label class="form-label" for="fieldLatitude">緯度座標</label>
                                    <input type="text" class="form-control form-control-sm mono-num" id="fieldLatitude" placeholder="如：25.0601">
                                </div>
                            </div>

                            <div class="form-check form-switch mt-3">
                                <input class="form-check-input" type="checkbox" role="switch" id="fieldIsActive" checked>
                                <label class="form-check-label text-white fw-bold" for="fieldIsActive">
                                    <i class="fa-solid fa-power-off text-success me-1"></i>啟用此據點營運
                                </label>
                            </div>
                        </form>
                    </div>
                    <footer class="modal-footer border-top border-secondary border-opacity-25 d-flex justify-content-end gap-2 p-3">
                        <button type="button" class="btn btn-muted btn-sm rounded-pill px-3" data-bs-dismiss="modal">
                            <i class="fa-solid fa-xmark me-1"></i>取消
                        </button>
                        <button type="button" class="btn btn-secondary btn-sm rounded-pill px-3" onclick="saveWarehouseItem()">
                            <i class="fa-solid fa-floppy-disk me-1"></i>儲存
                        </button>
                    </footer>
                </section>
            </div>
        </div>

    </body>
</html>
