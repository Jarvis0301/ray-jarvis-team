<head>

    <style>
        :root {
            --bg-base: #0c0915;
            --bg-surface: #15102a;
            --bg-surface-elevated: #1e173b;
            --border-color: rgba(139, 92, 246, 0.18);
            --border-highlight: rgba(168, 85, 247, 0.45);
            --primary-purple: #8b5cf6;
            --primary-purple-rgb: 139, 92, 246;
            --neon-accent: #c084fc;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --badge-rules: #8b5cf6;
            --badge-clause: #06b6d4;
            --badge-notice: #f59e0b;
            --badge-penalty: #ef4444;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(139, 92, 246, 0.08) 0%, transparent 40%),

            background-attachment: fixed;

        /* 頂部合規監控指標條 */

            background: linear-gradient(135deg, rgba(30, 23, 59, 0.7) 0%, rgba(21, 16, 42, 0.9) 100%);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }

        .stat-badge {
            background: rgba(139, 92, 246, 0.12);
            border: 1px solid rgba(139, 92, 246, 0.25);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            transition: all 0.3s ease;
        }
        .stat-badge:hover {
            border-color: var(--neon-accent);
            transform: translateY(-2px);
        }

        /* 玻璃擬態主容器 */
        .glass-panel {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            padding: 1.5rem;
        }

        /* 分類篩選膠囊 */
        .nav-pills-custom .nav-link {
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 0.5rem 1.25rem;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.25s ease;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .nav-pills-custom .nav-link.active,
        .nav-pills-custom .nav-link:hover {
            color: #fff;
            background: linear-gradient(135deg, #7c3aed, #9333ea);
            border-color: var(--neon-accent);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
        }

        /* DataTables 核心深紫自訂外觀 */
        .table-custom {
            color: var(--text-main) !important;
            vertical-align: middle;
            border-color: rgba(255, 255, 255, 0.05) !important;
        }
        .table-custom thead th {
            background: rgba(30, 23, 59, 0.85) !important;
            color: var(--neon-accent) !important;
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--border-color) !important;
            padding: 1rem 0.75rem;
        }
        .table-custom tbody tr {
            background: transparent;
            transition: background 0.2s;
        }
        .table-custom tbody tr:hover {
            background: rgba(139, 92, 246, 0.08) !important;
        }
        .table-custom td {
            padding: 1rem 0.75rem;
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04) !important;
        }

        /* 自訂 Badge 樣式 */
        .badge-cat-rules { background: rgba(139, 92, 246, 0.2); color: #c084fc; border: 1px solid rgba(139, 92, 246, 0.4); }
        .badge-cat-clause { background: rgba(6, 182, 212, 0.2); color: #67e8f9; border: 1px solid rgba(6, 182, 212, 0.4); }
        .badge-cat-notice { background: rgba(245, 158, 11, 0.2); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.4); }
        .badge-cat-penalty { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }

        .rank-pill {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e5e7eb;
            font-size: 0.75rem;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
        }

        /* 模態視窗與側邊抽屜深色優化 */
        .modal-content, .offcanvas {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            backdrop-filter: blur(16px);
        }
        .modal-header, .offcanvas-header, .modal-footer {
            border-color: var(--border-color);
        }

        .form-control-custom, .form-select-custom {
            background: rgba(15, 11, 28, 0.8) !important;
            border: 1px solid var(--border-color) !important;
            color: #fff !important;
            border-radius: 8px;
        }
        .form-control-custom:focus, .form-select-custom:focus {
            border-color: var(--neon-accent) !important;
            box-shadow: 0 0 10px rgba(192, 132, 252, 0.25) !important;
        }

        /* 自訂滾動條 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: var(--bg-surface-elevated); border-radius: 3px; border: 1px solid var(--border-color); }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-purple); }
    </style>
</head>

<script>
    /**
     * 葡眾網站核心架構 - 培訓模組 (表15: trn_policy_docs)
     * 中台轉接字典 (sys_api_configs) 欄位解耦對映
     */
    const POLICY_DOC_CONFIG = {
        // 模擬 Google Sheets 連接 (實際環境替換為 GViz URL)
        sheetName: "trn_policy_docs",

        fieldAdapter: {
            "doc_id": "守則識別碼",
            "doc_code": "公文編號",
            "title": "規章文件全銜",
            "version": "版本編號",

            "file_size_kb": "檔案大小KB",

            "created_by": "建立者",

            "updated_at": "最後更新時間"
        }
    };

    let dataTableInstance = null;

    /**
     * 資料適配解耦器 (將 Google 試算表欄位轉譯為標準資料模型)
     */
    function transformSheetData(rawSheetRows) {
        const adapter = POLICY_DOC_CONFIG.fieldAdapter;
        return rawSheetRows.map(row => {
            const mapped = {};
            for (let [entityKey, sheetColName] of Object.entries(adapter)) {
                mapped[entityKey] = row[sheetColName] !== undefined ? row[sheetColName] : "";
            }
            // 型態標準化
            mapped.is_active = (String(mapped.is_active).toUpperCase() === "TRUE");
            mapped.file_size_kb = parseInt(mapped.file_size_kb, 10) || 0;
            return mapped;
        });
    }

    /**
     * 規章類別 Badge 產生器
     */
    function renderCategoryBadge(category) {
        const catMap = {
            "RULES": { text: "營業守則", class: "badge-cat-rules", icon: "fa-book-bookmark" },
            "CLAUSE": { text: "制度條文", class: "badge-cat-clause", icon: "fa-file-lines" },
            "NOTICE": { text: "官方函文", class: "badge-cat-notice", icon: "fa-bullhorn" },
            "PENALTY": { text: "處分規範", class: "badge-cat-penalty", icon: "fa-triangle-exclamation" }
        };
        const config = catMap[category] || { text: category, class: "badge-cat-rules", icon: "fa-file" };
        return `<span class="badge ${config.class} px-2 py-1"><i class="fa-solid ${config.icon}"></i> ${config.text}</span>`;
    }

    /**
     * 職級門檻 Badge 產生器
     */
    function renderRankBadge(rank) {
        const rankMap = {
            "MEM": { name: "會員以上 (全體)", color: "text-light", border: "border-secondary" },
            "MGR": { name: "經理級 (MGR)", color: "text-warning", border: "border-warning" },
            "DIR": { name: "總監級 (DIR)", color: "text-info", border: "border-info" },
            "DIA": { name: "藍鑽級 (DIA)", color: "text-danger", border: "border-danger" }
        };
        const r = rankMap[rank] || { name: rank, color: "text-light", border: "border-secondary" };
        return `<span class="rank-pill ${r.border} ${r.color}"><i class="fa-solid fa-id-badge"></i> ${r.name}</span>`;
    }

    /**
     * 初始化與重新渲染 DataTable
     */
    function initDataTable(data) {
        if (dataTableInstance) {
            dataTableInstance.destroy();
        }

        const tbody = $('#policyTableBody');
        tbody.empty();

        data.forEach(item => {
            const statusHtml = item.is_active 
                ? `<span class="badge bg-success bg-opacity-25 text-success border border-success"><i class="fa-solid fa-check"></i> 現行生效</span>`
                : `<span class="badge bg-secondary bg-opacity-25 text-muted border border-secondary"><i class="fa-solid fa-box-archive"></i> 歷史作廢</span>`;

            const tr = `
                <tr data-category="${item.category}" data-id="${item.doc_id}">
                    <td><span class="font-monospace text-light fw-bold">${item.doc_code}</span></td>
                    <td>${renderCategoryBadge(item.category)}</td>
                    <td>
                        <div class="fw-bold text-white mb-0">${item.title}</div>
                        <small class="text-muted"><i class="fa-regular fa-file-pdf text-danger"></i> ${(item.file_size_kb / 1024).toFixed(2)} MB</small>
                    </td>
                    <td><span class="badge bg-dark border border-secondary text-info">${item.version}</span></td>
                    <td>${renderRankBadge(item.min_required_rank)}</td>
                    <td><small class="text-muted"><i class="fa-regular fa-calendar"></i> ${item.effective_date}</small></td>
                    <td>${statusHtml}</td>
                    <td class="text-center">
                        <div class="btn-group btn-group-sm">
                            <button class="btn btn-outline-info btn-preview" title="公文詳情與鑑權"><i class="fa-solid fa-eye"></i></button>
                            <button class="btn btn-outline-light btn-edit" title="編輯規章"><i class="fa-solid fa-pen-to-square"></i></button>
                            <a href="${item.file_url}" target="_blank" class="btn btn-outline-warning" title="雲端下載"><i class="fa-solid fa-arrow-up-right-from-square"></i></a>
                        </div>
                    </td>
                </tr>
            `;
            tbody.append(tr);
        });

        dataTableInstance = $('#policyDocsTable').DataTable({
            responsive: true,
            pageLength: 10,
            dom: '<"row mb-2"<"col-12"tr>><"row align-items-center mt-3"<"col-sm-6 text-muted small"i><"col-sm-6 d-flex justify-content-end"p>>',
            language: {
                zeroRecords: "查無符合條件的營運規章檔案",
                info: "顯示第 _START_ 至 _END_ 筆，共 _TOTAL_ 筆公文",
                infoEmpty: "無可用的公文紀錄",
                paginate: {
                    next: '<i class="fa-solid fa-chevron-right"></i>',
                    previous: '<i class="fa-solid fa-chevron-left"></i>'
                }
            }
        });

        updateHeaderStatistics(data);
    }

    /**
     * 更新頂部合規監控指標
     */
    function updateHeaderStatistics(data) {
        const activeCount = data.filter(d => d.is_active).length;
        const highRankCount = data.filter(d => ["DIR", "DIA"].includes(d.min_required_rank) && d.is_active).length;

        $('#statActiveCount').text(activeCount);
        $('#statHighRankCount').text(highRankCount);
    }

    /**
     * 側邊抽屜渲染公文詳情
     */
    function openPreviewDrawer(docId) {
        const doc = localPolicyDocs.find(d => d.doc_id === docId);
        if (!doc) return;

        const body = $('#docPreviewBody');
        body.html(`
            <div class="p-3 mb-3 rounded-3" style="background: rgba(139, 92, 246, 0.1); border: 1px solid var(--border-color);">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="font-monospace text-info">${doc.doc_code}</span>
                    <span class="badge bg-dark border border-secondary">${doc.version}</span>
                </div>
                <h6 class="text-white fw-bold mb-0">${doc.title}</h6>
            </div>

            <div class="list-group list-group-flush mb-4 rounded-3 border border-secondary overflow-hidden">
                <div class="list-group-item bg-dark text-light border-secondary d-flex justify-content-between">
                    <span class="text-muted"><i class="fa-solid fa-tag"></i> 規章類別</span>
                    <span>${renderCategoryBadge(doc.category)}</span>
                </div>
                <div class="list-group-item bg-dark text-light border-secondary d-flex justify-content-between">
                    <span class="text-muted"><i class="fa-solid fa-shield-halved"></i> 最低授權職級</span>
                    <span>${renderRankBadge(doc.min_required_rank)}</span>
                </div>
                <div class="list-group-item bg-dark text-light border-secondary d-flex justify-content-between">
                    <span class="text-muted"><i class="fa-solid fa-calendar-check"></i> 實施生效日</span>
                    <span>${doc.effective_date}</span>
                </div>
                <div class="list-group-item bg-dark text-light border-secondary d-flex justify-content-between">
                    <span class="text-muted"><i class="fa-solid fa-hard-drive"></i> 檔案容量</span>
                    <span>${(doc.file_size_kb / 1024).toFixed(2)} MB</span>
                </div>
                <div class="list-group-item bg-dark text-light border-secondary d-flex justify-content-between">
                    <span class="text-muted"><i class="fa-solid fa-clock-rotate-left"></i> 最後更新</span>
                    <span>${doc.updated_at}</span>
                </div>
            </div>

            <div class="d-grid gap-2">
                <a href="${doc.file_url}" target="_blank" class="btn btn-outline-info">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i> 開啟 Google Drive 雲端檢視
                </a>
                <button class="btn btn-outline-secondary" data-bs-dismiss="offcanvas">
                    <i class="fa-solid fa-xmark"></i> 關閉檢視
                </button>
            </div>
        `);

        const offcanvas = new bootstrap.Offcanvas(document.getElementById('docPreviewOffcanvas'));
        offcanvas.show();
    }

    // DOM Ready 初始化
    $(document).ready(function () {
        // 載入並適配初始資料
        localPolicyDocs = transformSheetData(SEED_DATA_SHEET);
        initDataTable(localPolicyDocs);

        // 全域即時檢索綁定
        $('#tableGlobalSearch').on('keyup', function () {
            if (dataTableInstance) {
                dataTableInstance.search(this.value).draw();
            }
        });

        // 矩陣分類標籤 Filter
        $('#categoryTabs .nav-link').on('click', function (e) {
            e.preventDefault();
            $('#categoryTabs .nav-link').removeClass('active');
            $(this).addClass('active');

            const filter = $(this).data('filter');
            if (filter === 'ALL') {
                dataTableInstance.column(1).search('').draw();
            } else {
                dataTableInstance.column(1).search(filter).draw();
            }
        });

        // 綁定抽屜預覽按鈕
        $(document).on('click', '.btn-preview', function () {
            const tr = $(this).closest('tr');
            const docId = tr.data('id');
            openPreviewDrawer(docId);
        });

        // 編輯公文按鈕
        $(document).on('click', '.btn-edit', function () {
            const tr = $(this).closest('tr');
            const docId = tr.data('id');
            const doc = localPolicyDocs.find(d => d.doc_id === docId);
            if (!doc) return;

            $('#formDocId').val(doc.doc_id);
            $('#formDocCode').val(doc.doc_code);
            $('#formCategory').val(doc.category);
            $('#formTitle').val(doc.title);
            $('#formVersion').val(doc.version);
            $('#formEffectiveDate').val(doc.effective_date);
            $('#formMinRank').val(doc.min_required_rank);
            $('#formFileUrl').val(doc.file_url);
            $('#formFileSize').val(doc.file_size_kb);
            $('#formIsActive').prop('checked', doc.is_active);

            $('#docFormModalLabel').html('<i class="fa-solid fa-file-pen text-warning"></i> 編輯現有規章公文');
            $('#docFormModal').modal('show');
        });

        // 儲存並寫入試算表
        $('#btnSaveDoc').on('click', function () {
            const docId = $('#formDocId').val() || `DOC-UUID-${Date.now()}`;
            const isEditing = Boolean($('#formDocId').val());

            const newDoc = {
                doc_id: docId,
                doc_code: $('#formDocCode').val(),
                category: $('#formCategory').val(),
                title: $('#formTitle').val(),
                version: $('#formVersion').val(),
                effective_date: $('#formEffectiveDate').val(),
                min_required_rank: $('#formMinRank').val(),
                file_url: $('#formFileUrl').val(),
                file_size_kb: parseInt($('#formFileSize').val(), 10) || 0,
                is_active: $('#formIsActive').is(':checked'),
                created_by: "SYSTEM_HUB",
                updated_at: new Date().toISOString().replace('T', ' ').substring(0, 19)
            };

            if (!newDoc.doc_code || !newDoc.title || !newDoc.file_url) {
                Swal.fire({
                    icon: 'warning',
                    title: '欄位未填寫完整',
                    text: '請確認公文編號、文件全銜與雲端 URL 已完整輸入',
                    background: '#15102a',
                    color: '#fff'
                });
                return;
            }

            if (isEditing) {
                const idx = localPolicyDocs.findIndex(d => d.doc_id === docId);
                if (idx !== -1) localPolicyDocs[idx] = newDoc;
            } else {
                localPolicyDocs.unshift(newDoc);
            }

            $('#docFormModal').modal('hide');
            initDataTable(localPolicyDocs);

            Swal.fire({
                icon: 'success',
                title: '寫入成功',
                text: `規章 ${newDoc.doc_code} 已同步解耦寫入 Google 試算表`,
                background: '#15102a',
                color: '#fff',
                confirmButtonColor: '#7c3aed'
            });
        });

        // 重新整理與同步試算表按鈕
        $('#btnRefreshData').on('click', function () {
            Swal.fire({
                title: '同步 Google 試算表中...',
                html: '<i class="fa-solid fa-spinner fa-2x text-primary my-2"></i><br>透過 sys_api_configs 執行欄位字典映射',
                background: '#15102a',
                color: '#fff',
                showConfirmButton: false,
                timer: 900
            }).then(() => {
                localPolicyDocs = transformSheetData(SEED_DATA_SHEET);
                initDataTable(localPolicyDocs);
            });
        });
    });
</script>
</body>
</html>
