<!DOCTYPE html>
<html lang="zh-TW" data-bs-theme="dark-purple">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>庫存預警 | 榮祥團隊 - 核心版</title>

        <!-- 認證守衛 -->
        <script src="../assets/js/auth-guard.js"></script>

        <!-- 第三方函式庫加載器 -->
        <script src="../assets/js/vendor-loader.js"></script>

        <!-- 共用核心模組 -->
        <script src="../assets/js/common.js"></script>
        <link rel="stylesheet" href="../assets/css/common.css">
        

        <!-- 頁面專屬 -->
        <script src="./js/psi-alerts.js" defer></script>
        <link rel="stylesheet" href="./css/psi-alerts.css">
    </head>

    <body>
        <main class="container-fluid p-3 p-md-4">

            <!-- 1. 頂部 HUD 狀態區塊 -->
            <header class="row align-items-center mb-3">
                <h4 class="fw-bold mb-0 text-light">
                    <i class="fa-solid fa-triangle-exclamation text-primary me-1"></i> 庫存預警
                </h4>
            </header>

            <section class="mb-3">
                <div class="row align-items-center g-3">
                    <div class="col-12">
                        <div class="row row-cols-2 row-cols-md-3 row-cols-xl-6 g-2">
                            <div class="col">
                                <div class="stat-chip">
                                    <span class="text-secondary"><i class="fa-solid fa-hourglass-half text-primary me-1"></i> 預警數量</span>
                                    <span class="text-primary fs-6 fw-bold mono-num" id="count-alerts-total">0</span>
                                </div>
                            </div>
                            <div class="col">
                                <div class="stat-chip">
                                    <span class="text-secondary"><i class="fa-solid fa-bell text-info me-1"></i> 待處理預警</span>
                                    <span class="text-info fs-6 fw-bold mono-num" id="stat-pending-count">0</span>
                                </div>
                            </div>
                            <div class="col">
                                <div class="stat-chip">
                                    <span class="text-secondary"><i class="fa-solid fa-circle-exclamation text-orange me-1"></i> 低於水位</span>
                                    <span class="text-orange fs-6 fw-bold mono-num" id="stat-stockout-count">0</span>
                                </div>
                            </div>
                            <div class="col">
                                <div class="stat-chip">
                                    <span class="text-secondary"><i class="fa-solid fa-hourglass-half text-warning me-1"></i> 接近有效日期</span>
                                    <span class="text-warning fs-6 fw-bold mono-num" id="stat-expiry90-count">0</span>
                                </div>
                            </div>
                            <div class="col">
                                <div class="stat-chip">
                                    <span class="text-secondary"><i class="fa-solid fa-triangle-exclamation text-danger me-1"></i> 即將過期</span>
                                    <span class="text-danger fs-6 fw-bold mono-num" id="stat-expiry30-count">0</span>
                                </div>
                            </div>
                            <div class="col">
                                <div class="stat-chip">
                                    <span class="text-secondary"><i class="fa-solid fa-skull text-accent me-1"></i> 已過期</span>
                                    <span class="text-accent fs-6 fw-bold mono-num" id="stat-expired-count">0</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 2. 主視圖切換頁籤（拉出為獨立 nav 語意化共用元件） -->
            <nav aria-label="庫存預警工作區頁籤" class="mb-3">
                <ul class="nav nav-tabs" id="psiAlertTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button type="button" class="nav-link active" id="tab-btn-alerts" onclick="switchMainWorkspace('ALERTS')" role="tab">
                            <i class="fa-solid fa-triangle-exclamation me-1"></i> 即時預警
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button type="button" class="nav-link" id="tab-btn-thresholds" onclick="switchMainWorkspace('THRESHOLDS')" role="tab">
                            <i class="fa-solid fa-sliders me-1"></i> 門檻規則
                        </button>
                    </li>
                </ul>
            </nav>

            <section id="workspace-alerts" class="glass-panel p-3 mb-4">
                <div class="row align-items-center g-3 pb-3 border-bottom">
                    <div class="col-12 col-md-12 col-xl-11">
                        <div class="row row-cols-2 row-cols-md-auto g-2">
                            <div class="col col-12">
                                <button type="button" class="filter-pill-btn w-100 active" data-alert-filter="ALL">
                                    <i class="fa-solid fa-border-all me-1"></i> 全部
                                </button>
                            </div>
                            <div class="col">
                                <button type="button" class="filter-pill-btn w-100" data-alert-filter="低於安全水位">
                                    <i class="fa-solid fa-triangle-exclamation me-1"></i> 低於安全水位
                                </button>
                            </div>
                            <div class="col">
                                <button type="button" class="filter-pill-btn w-100" data-alert-filter="90天近效期">
                                    <i class="fa-solid fa-hourglass-half me-1"></i> 90天近效期
                                </button>
                            </div>
                            <div class="col">
                                <button type="button" class="filter-pill-btn w-100" data-alert-filter="30天極危效期">
                                    <i class="fa-solid fa-triangle-exclamation me-1"></i> 30天極危效期
                                </button>
                            </div>
                            <div class="col">
                                <button type="button" class="filter-pill-btn w-100" data-alert-filter="已過期">
                                    <i class="fa-solid fa-skull me-1"></i> 已過期
                                </button>
                            </div>
                            <div class="col">
                                <button type="button" class="filter-pill-btn w-100" data-alert-filter="品質鎖定">
                                    <i class="fa-solid fa-lock me-1"></i> 品質鎖定
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 col-md-2 col-xl-1 d-flex justify-content-md-end">
                        <button type="button" class="btn btn-secondary btn-sm rounded-pill w-100" onclick="triggerBatchResolve()" title="批次知悉處理">
                            <i class="fa-solid fa-check-double"></i> 批次知悉
                        </button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table id="alertsDataTable" class="table table-dark-custom table-hover align-middle w-100">
                        <thead>
                            <tr>
                                <th  style="width: 40px;"><input type="checkbox" id="check-all-alerts" class="form-check-input"></th>
                                <th>告警編號</th>
                                <th>預警類型</th>
                                <th>據點倉儲</th>
                                <th>產品品項</th>
                                <th>批號快照</th>
                                <th>在庫存量 / 門檻</th>
                                <th>效期倒數</th>
                                <th>嚴重性</th>
                                <th>處置狀態</th>
                                <th>處置操作</th>
                            </tr>
                        </thead>
                        <tbody id="alerts-table-body">
                        </tbody>
                    </table>
                </div>
            </section>

            <section id="workspace-thresholds" class="glass-panel p-3 mb-4 d-none">
                <div class="row align-items-center g-3 pb-3 border-bottom">
                    <div class="col-12 col-md-10 col-xl-10">
                        <h5 class="fw-bold text-white mb-0">
                            <i class="fa-solid fa-sliders text-primary"></i> 各據點安全水位門檻規則
                        </h5>
                        <div class="text-secondary small mt-1">
                            <i class="fa-solid fa-info-circle"></i> 自由可用庫存 &le; 門檻值時自動觸發告警，支援隨時啟動/暫停即時掃描。
                        </div>
                    </div>
                    <div class="col-12 col-md-2 col-xl-2 d-flex justify-content-md-end">
                        <button class="btn btn-secondary btn-sm rounded-pill w-100" id="btnOpenAddThreshold" onclick="openAddThresholdModal()">
                            <i class="fa-solid fa-plus"></i> 新增門檻規則
                        </button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table id="thresholdsDataTable" class="table table-dark-custom table-hover align-middle w-100">
                        <thead>
                            <tr>
                                <th>門檻代碼</th>
                                <th>據點倉儲</th>
                                <th>產品品項</th>
                                <th>安全門檻盒數</th>
                                <th>監控狀態</th>
                                <th>規則維護</th>
                            </tr>
                        </thead>
                        <tbody id="thresholds-table-body">
                        </tbody>
                    </table>
                </div>
            </section>

        </main>

        <div class="modal fade" id="thresholdModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <section class="modal-content">
                    <header class="modal-header border-bottom border-secondary border-opacity-25 py-3 px-4">
                            <i class="fa-solid fa-sliders text-primary"></i> 門檻規則調整
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </header>
                    <div class="modal-body p-3 p-md-4">
                        <form id="thresholdForm">
                            <input type="hidden" id="thresholdFormMode" value="add">
                            <input type="hidden" id="thresholdFieldCreatedAt" value="">
                            <input type="hidden" id="thresholdFieldCreatedBy" value="">

                            <div class="mb-3">
                                <label class="form-label" for="fieldThresholdId">門檻唯一識別碼 (id) <span class="text-danger">*</span></label>
                                <input type="text" class="form-control form-control-sm" id="fieldThresholdId" placeholder="由系統依據點與產品自動生成..." readonly required>
                                <div class="form-text text-muted small">主鍵 (PK)，依「倉儲據點ID_產品SKU ID」格式自動生成（例如：WH-TW-TP_TW0101001）</div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-12 col-md-6">
                                    <label class="form-label">據點倉儲 <span class="text-danger">*</span></label>
                                    <select class="form-select form-select-sm" id="fieldThresholdWarehouse" required>
                                    </select>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label class="form-label">產品品項 <span class="text-danger">*</span></label>
                                    <select class="form-select form-select-sm" id="fieldThresholdProduct" required>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">安全存量門檻盒數 <span class="text-danger">*</span></label>
                                <input type="number" class="form-control form-control-sm" id="fieldThresholdQty" min="0" value="0" required>
                                <div class="form-text text-muted small">當在線可用存量小於或等於此數值時觸發預警</div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">備註</label>
                                <input type="text" class="form-control form-control-sm" id="fieldThresholdRemarks" placeholder="例如：大馬招商拓荒備貨、月末衝刺緩衝...">
                            </div>

                            <div class="form-check form-switch mt-3">
                                <input class="form-check-input" type="checkbox" role="switch" id="fieldThresholdIsMonitored" checked>
                                <label class="form-check-label" for="fieldThresholdIsMonitored">
                                    <i class="fa-solid fa-bell text-warning"></i> 啟動門檻即時監控
                                </label>
                            </div>
                        </form>
                    </div>
                    <footer class="modal-footer border-top border-secondary border-opacity-25 d-flex justify-content-end gap-2 p-3">
                        <button type="button" class="btn btn-muted btn-sm rounded-pill px-3" data-bs-dismiss="modal">
                            <i class="fa-solid fa-xmark"></i> 取消
                        </button>
                        <button type="button" class="btn btn-secondary btn-sm rounded-pill px-3" onclick="saveThresholdItem()">
                            <i class="fa-solid fa-floppy-disk"></i> 儲存
                        </button>
                    </footer>
                </section>
            </div>
        </div>

        <div class="modal fade" id="resolveAlertModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <section class="modal-content">
                    <header class="modal-header border-bottom border-secondary border-opacity-25 py-3 px-4">
                        <h5 class="modal-title fw-bold text-white">
                            <i class="fa-solid fa-wand-magic-sparkles text-primary"></i> 執行告警戰術處置
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </header>
                    <div class="modal-body p-3 p-md-4">
                        <input type="hidden" id="resolveAlertId" value="">
                        
                        <div class="card p-3 mb-3">
                            <div class="d-flex justify-content-between mb-1">
                                <span class="text-secondary">預警項目：</span>
                                <span class="text-white fw-bold" id="resolveAlertItemText">-</span>
                            </div>
                            <div class="d-flex justify-content-between mb-1">
                                <span class="text-secondary">所屬據點：</span>
                                <span class="text-info" id="resolveAlertWhText">-</span>
                            </div>
                            <div class="d-flex justify-content-between">
                                <span class="text-secondary">建議處置：</span>
                                <span class="text-warning" id="resolveAlertSuggestedText">-</span>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label"><i class="fa-solid fa-code-branch"></i> 變更處理狀態 (status)</label>
                            <select class="form-select form-select-sm" id="resolveStatusSelect">
                                <option value="已知悉">已知悉 (排入日常監控)</option>
                                <option value="已轉特惠促銷/試用">已轉特惠促銷/試用 (優先消化)</option>
                                <option value="已結案出清">已結案出清 (調撥完成/已補貨)</option>
                                <option value="未處理">重設為未處理</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label"><i class="fa-solid fa-comment-dots"></i> 結案備註或調度說明</label>
                            <input type="text" class="form-control form-control-sm" id="resolveRemarksInput" placeholder="輸入處置動作例如：已自台北總倉調撥 30 盒至大馬...">
                        </div>
                    </div>
                    <footer class="modal-footer border-top border-secondary border-opacity-25 d-flex justify-content-end gap-2 p-3">
                        <button type="button" class="btn btn-muted btn-sm rounded-pill px-3" data-bs-dismiss="modal">
                            <i class="fa-solid fa-xmark"></i> 取消
                        </button>
                        <button type="button" class="btn btn-secondary btn-sm rounded-pill px-3" onclick="saveAlertResolution()">
                            <i class="fa-solid fa-check"></i> 確認處置並回寫
                        </button>
                    </footer>
                </div>
            </div>
        </div>
        
    </body>
</html>
