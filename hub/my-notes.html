    <style>
        /* ==========================================================================
           核心版極密魅影紫 (Phantom Purple) Design System Tokens
           ========================================================================== */
        :root, [data-bs-theme="dark-purple"] {
            --uv-bg-base: #0a0518;
            --uv-bg-surface: #120924;
            --uv-bg-card: rgba(23, 12, 44, 0.75);
            --uv-bg-card-hover: rgba(36, 18, 68, 0.85);
            --uv-border-subtle: rgba(139, 92, 246, 0.2);
            --uv-border-active: rgba(167, 139, 250, 0.5);
            
            --uv-primary: #8b5cf6;
            --uv-primary-light: #a78bfa;
            --uv-secondary: #c084fc;
            --uv-accent-pink: #ec4899;
            --uv-accent-cyan: #06b6d4;
            --uv-accent-amber: #f59e0b;
            --uv-accent-emerald: #10b981;
            
            --uv-text-main: #f8fafc;
            --uv-text-muted: #94a3b8;
            --uv-glow-purple: 0 0 25px rgba(139, 92, 246, 0.25);
            --uv-glow-pink: 0 0 20px rgba(236, 72, 153, 0.3);
        }

        body {
            background-color: var(--uv-bg-base);
            color: var(--uv-text-main);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 15% 10%, rgba(139, 92, 246, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(236, 72, 153, 0.08) 0%, transparent 45%);
            background-attachment: fixed;
        }

        /* 玻璃擬態戰術容器 */
        .glass-panel {
            background: var(--uv-bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--uv-border-subtle);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-panel:hover {
            border-color: var(--uv-border-active);
        }

        /* 頂部戰略抬頭資訊 HUD */
        .hud-header {
            border-bottom: 1px solid var(--uv-border-subtle);
            padding: 1.5rem 0 1.25rem 0;
            margin-bottom: 2rem;
        }

        /* 商機意向階梯徽章 */
        .stage-pill {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.25rem 0.65rem;
            border-radius: 50rem;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
        }
        .stage-S { background: linear-gradient(135deg, #ec4899, #be185d); color: #fff; box-shadow: var(--uv-glow-pink); }
        .stage-A { background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: #fff; box-shadow: var(--uv-glow-purple); }
        .stage-B { background: rgba(59, 130, 246, 0.25); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); }
        .stage-C { background: rgba(148, 163, 184, 0.15); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.3); }

        /* 人脈情報檔案卡 (Dossier Card) */
        .dossier-card {
            border-radius: 16px;
            background: var(--uv-bg-surface);
            border: 1px solid var(--uv-border-subtle);
            overflow: hidden;
            position: relative;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        }
        .dossier-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), var(--uv-glow-purple);
            border-color: var(--uv-primary-light);
        }
        .dossier-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--uv-primary);
            transition: width 0.2s ease;
        }
        .dossier-card.priority-S::before { background: var(--uv-accent-pink); }
        .dossier-card.priority-A::before { background: var(--uv-primary); }
        .dossier-card.priority-B::before { background: var(--uv-accent-cyan); }
        .dossier-card:hover::before { width: 6px; }

        /* 雙面名片視窗 (Flip Business Card) */
        .card-flip-container {
            perspective: 1000px;
            cursor: pointer;
            height: 130px;
        }
        .card-flip-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
        .card-flip-container.flipped .card-flip-inner {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 12px;
            padding: 1rem;
        }
        .card-front {
            background: linear-gradient(135deg, rgba(35, 17, 65, 0.9), rgba(18, 9, 36, 0.95));
            border: 1px dashed rgba(167, 139, 250, 0.4);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .card-back {
            background: linear-gradient(135deg, #1e1136, #0d0618);
            border: 1px solid var(--uv-primary);
            transform: rotateY(180deg);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* 標籤雲 Tag Pill */
        .tag-badge {
            background: rgba(139, 92, 246, 0.12);
            color: #ddd6fe;
            border: 1px solid rgba(139, 92, 246, 0.3);
            font-size: 0.75rem;
            padding: 0.2rem 0.55rem;
            border-radius: 6px;
            display: inline-block;
            margin: 0.15rem;
            transition: all 0.2s ease;
        }
        .tag-badge:hover {
            background: var(--uv-primary);
            color: #fff;
        }

        /* 語音備忘播放器模擬 */
        .voice-memo-bar {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--uv-border-subtle);
            border-radius: 100px;
            padding: 0.35rem 0.75rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            width: 100%;
        }
        .wave-anim {
            display: flex;
            align-items: center;
            gap: 2px;
            height: 16px;
            flex-grow: 1;
        }
        .wave-bar {
            width: 3px;
            background: var(--uv-primary-light);
            border-radius: 2px;
            animation: pulseWave 1.2s infinite ease-in-out;
        }
        .wave-bar:nth-child(2) { height: 12px; animation-delay: 0.2s; }
        .wave-bar:nth-child(3) { height: 16px; animation-delay: 0.4s; }
        .wave-bar:nth-child(4) { height: 8px; animation-delay: 0.1s; }
        .wave-bar:nth-child(5) { height: 14px; animation-delay: 0.3s; }
        .wave-bar:nth-child(6) { height: 10px; animation-delay: 0.5s; }
        @keyframes pulseWave {
            0%, 100% { transform: scaleY(0.4); opacity: 0.4; }
            50% { transform: scaleY(1); opacity: 1; }
        }

        /* 時空流歷程線條 (Timeline Mode) */
        .timeline-stream {
            position: relative;
            padding-left: 2rem;
        }
        .timeline-stream::before {
            content: '';
            position: absolute;
            left: 7px;
            top: 10px;
            bottom: 10px;
            width: 2px;
            background: linear-gradient(to bottom, var(--uv-primary), var(--uv-accent-pink), rgba(139, 92, 246, 0.1));
        }
        .timeline-node {
            position: relative;
            margin-bottom: 2rem;
        }
        .timeline-node::before {
            content: '';
            position: absolute;
            left: -2rem;
            top: 6px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--uv-bg-base);
            border: 3px solid var(--uv-primary);
            box-shadow: 0 0 10px var(--uv-primary);
        }
        .timeline-node.node-S::before {
            border-color: var(--uv-accent-pink);
            box-shadow: 0 0 10px var(--uv-accent-pink);
        }

        /* 按鈕自定義美化 */
        .btn-glow-primary {
            background: linear-gradient(135deg, var(--uv-primary), #6d28d9);
            color: #fff;
            border: none;
            box-shadow: var(--uv-glow-purple);
            transition: all 0.25s ease;
        }
        .btn-glow-primary:hover {
            background: linear-gradient(135deg, #9d4edd, #5b21b6);
            color: #fff;
            box-shadow: 0 0 25px rgba(167, 139, 250, 0.4);
            transform: translateY(-1px);
        }
        .btn-glow-pink {
            background: linear-gradient(135deg, #ec4899, #be185d);
            color: #fff;
            border: none;
            box-shadow: var(--uv-glow-pink);
        }
        .btn-glow-pink:hover {
            background: linear-gradient(135deg, #f472b6, #9d174d);
            color: #fff;
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.5);
        }

        /* 表單控制元件優化 */
        .form-control, .form-select {
            background-color: rgba(18, 9, 36, 0.8) !important;
            border: 1px solid var(--uv-border-subtle) !important;
            color: var(--uv-text-main) !important;
            border-radius: 8px;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--uv-primary) !important;
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.3) !important;
        }
        .form-control::placeholder {
            color: #64748b;
        }

        /* DataTable 深色主題無縫適配 */
        .dataTables_wrapper .dataTables_length,
        .dataTables_wrapper .dataTables_filter,
        .dataTables_wrapper .dataTables_info,
        .dataTables_wrapper .dataTables_paginate {
            color: var(--uv-text-muted) !important;
            font-size: 0.85rem;
            margin-top: 0.75rem;
        }
        table.dataTable {
            border-collapse: collapse !important;
            border-color: var(--uv-border-subtle) !important;
        }
        table.dataTable tbody tr {
            background-color: transparent !important;
        }
        table.dataTable tbody tr:hover {
            background-color: rgba(139, 92, 246, 0.08) !important;
        }
        table.dataTable td, table.dataTable th {
            border-bottom: 1px solid var(--uv-border-subtle) !important;
            padding: 12px 14px !important;
        }
    </style>
</head>

                `<span class="badge bg-dark border border-secondary">${item.note_id}</span>`,
                `<strong>${item.contact_name}</strong><br><small class="text-muted">${item.organization}</small>`,
                `<span class="stage-pill stage-${item.lead_stage}">${item.lead_stage} 級</span>`,
                `<div class="small text-truncate" style="max-width: 250px;" title="${item.key_points}">${item.key_points}</div>`,
                `<small class="text-warning">${item.next_action}</small><br><span class="text-muted" style="font-size: 0.75rem;">截止: ${item.action_deadline}</span>`,
                `<span class="badge bg-purple-subtle text-purple">${item.assignee}</span>`,
                item.is_converted_crm ? `<span class="badge bg-success">已轉入</span>` : `<span class="badge bg-secondary">未建檔</span>`,
                `<div class="text-end">
                    <button class="btn btn-sm btn-outline-primary" onclick="editNote('${item.note_id}')"><i class="fa-solid fa-pen"></i></button>
                 </div>`
            ]);

            dataTableInstance = $('#tableNotes').DataTable({
                data: tableData,
                pageLength: 10,
                ordering: true,
                responsive: true,
                language: {
                    search: "_INPUT_",
                    searchPlaceholder: "過濾表格資料...",
                    lengthMenu: "每頁 _MENU_ 筆",
                    info: "顯示第 _START_ 至 _END_ 筆，共 _TOTAL_ 筆",
                    paginate: {
                        first: "首頁",
                        last: "末頁",
                        next: "下一頁",
                        previous: "上一頁"
                    }
                }
            });
        }

        // 7. 多維度動態篩選引擎
        function applyFilters() {
            const keyword = $('#inputSearch').val().toLowerCase().trim();
            const stage = $('#filterStage').val();
            const author = $('#filterAuthor').val();

            const filtered = fieldNotesData.filter(item => {
                const matchKeyword = !keyword || 
                    item.contact_name.toLowerCase().includes(keyword) ||
                    item.organization.toLowerCase().includes(keyword) ||
                    item.key_points.toLowerCase().includes(keyword) ||
                    item.tags.some(t => t.toLowerCase().includes(keyword));

                const matchStage = (stage === 'ALL') || (item.lead_stage === stage);
                const matchAuthor = (author === 'ALL') || (item.author === author);

                return matchKeyword && matchStage && matchAuthor;
            });

            renderDossierCards(filtered);
            renderTimeline(filtered);
            initDataTable(filtered);
        }

        function filterByTag(tag) {
            $('#inputSearch').val(tag);
            applyFilters();
        }

        // 8. 戰情微型指標更新
        function updateDashboardStats() {
            const hotCount = fieldNotesData.filter(d => d.lead_stage === 'S' || d.lead_stage === 'A').length;
            const convertedCount = fieldNotesData.filter(d => d.is_converted_crm).length;
            const audioCount = fieldNotesData.filter(d => !!d.voice_memo_url).length;

            $('#statHotLeads').html(`${hotCount} <small class="fs-6 text-pink fw-normal" style="color: var(--uv-accent-pink);">/ ${fieldNotesData.length} 人</small>`);
            $('#statConvertedCrm').text(convertedCount);
            $('#statAudioCount').text(audioCount);
        }

        // 9. 提交新增 / 編輯表單
        function submitNoteForm() {
            const noteId = $('#fieldNoteId').val() || `NOTE-202608-00${fieldNotesData.length + 1}`;
            const tagsArray = $('#inputTags').val().split(/[,，]/).map(t => t.trim()).filter(Boolean);

            const newNote = {
                note_id: noteId,
                trip_id: "MY-202608-KL",
                author: $('#selectAuthor').val(),
                contact_name: $('#inputContactName').val().trim(),
                target_role: $('#selectTargetRole').val(),
                lead_stage: $('#selectLeadStage').val(),
                organization: $('#inputOrganization').val().trim(),
                phone: $('#inputPhone').val().trim(),
                line_whatsapp: $('#inputLine').val().trim(),
                meeting_time: $('#inputMeetingTime').val() || new Date().toISOString().slice(0, 16).replace('T', ' '),
                location: $('#inputLocation').val().trim() || '吉隆坡出差行程',
                key_points: $('#inputKeyPoints').val().trim(),
                next_action: $('#inputNextAction').val().trim(),
                action_deadline: $('#inputDeadline').val() || '2026-08-30',
                assignee: $('#selectAssignee').val(),
                tags: tagsArray.length ? tagsArray : ['大馬考察'],
                card_img_url: $('#inputCardUrl').val().trim(),
                voice_memo_url: $('#inputVoiceUrl').val().trim(),
                is_converted_crm: $('#chkAutoConvertCrm').is(':checked'),
                status: "FOLLOWING"
            };

            const existingIndex = fieldNotesData.findIndex(d => d.note_id === noteId);
            if (existingIndex > -1) {
                fieldNotesData[existingIndex] = newNote;
            } else {
                fieldNotesData.unshift(newNote);
            }

            // 關閉 Modal 並重設
            const modalEl = document.getElementById('modalAddNote');
            const modalInstance = bootstrap.Modal.getInstance(modalEl);
            modalInstance.hide();
            $('#formNoteMaster')[0].reset();
            $('#fieldNoteId').val('');

            // 重新渲染
            applyFilters();
            updateDashboardStats();

            alert(`情報手札「${newNote.contact_name} (${newNote.lead_stage}級)」已成功登記，並同步更新至資料庫與 CRM 中樞！`);
        }

        // 10. 編輯筆記
        function editNote(noteId) {
            const item = fieldNotesData.find(d => d.note_id === noteId);
            if (!item) return;

            $('#fieldNoteId').val(item.note_id);
            $('#inputContactName').val(item.contact_name);
            $('#inputOrganization').val(item.organization);
            $('#selectLeadStage').val(item.lead_stage);
            $('#selectTargetRole').val(item.target_role);
            $('#selectAuthor').val(item.author);
            $('#inputPhone').val(item.phone);
            $('#inputLine').val(item.line_whatsapp);
            $('#inputMeetingTime').val(item.meeting_time.replace(' ', 'T'));
            $('#inputLocation').val(item.location);
            $('#inputKeyPoints').val(item.key_points);
            $('#inputNextAction').val(item.next_action);
            $('#inputDeadline').val(item.action_deadline);
            $('#selectAssignee').val(item.assignee);
            $('#inputTags').val(item.tags.join(', '));
            $('#inputCardUrl').val(item.card_img_url);
            $('#inputVoiceUrl').val(item.voice_memo_url);
            $('#chkAutoConvertCrm').prop('checked', item.is_converted_crm);

            const modal = new bootstrap.Modal(document.getElementById('modalAddNote'));
            modal.show();
        }

        // 11. 一鍵轉入 CRM 主檔 (表 37 crm_customers)
        function convertToCrm(noteId) {
            const item = fieldNotesData.find(d => d.note_id === noteId);
            if (!item) return;

            item.is_converted_crm = true;
            applyFilters();
            updateDashboardStats();
            alert(`已成功將商機「${item.contact_name}」指派轉換為《CRM 客戶主檔》（CUST-${Date.now().toString().slice(-4)}），後續跟進自動納入團隊追蹤佇列！`);
        }

        // 12. 名片高清檢視 Lightbox
        function previewCard(url, title) {
            $('#previewCardTitle').html(`<i class="fa-solid fa-address-card"></i> ${title} - 實體名片掃描存檔`);
            $('#previewCardImage').attr('src', url);
            const modal = new bootstrap.Modal(document.getElementById('modalCardPreview'));
            modal.show();
        }

        // 13. 語音撥放器動畫模擬
        function toggleVoicePlay(btn) {
            const $icon = $(btn).find('i');
            if ($icon.hasClass('fa-play')) {
                $icon.removeClass('fa-play').addClass('fa-pause');
                $(btn).closest('.voice-memo-bar').find('.wave-bar').css('animation-play-state', 'running');
            } else {
                $icon.removeClass('fa-pause').addClass('fa-play');
                $(btn).closest('.voice-memo-bar').find('.wave-bar').css('animation-play-state', 'paused');
            }
        }
    </script>
</body>
</html>
