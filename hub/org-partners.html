<!DOCTYPE html>
<html lang="zh-Hant" data-bs-theme="dark-purple">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>組織成員戰術指揮中樞 - 榮祥葡眾三軌數位戰情系統</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css">

    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap5.min.css">

    <style>
        :root {
            /* 核心版紫色系主題變數 (Dark Purple Theme) */
            --uvaco-primary: #8b5cf6;
            --uvaco-primary-rgb: 139, 92, 246;
            --uvaco-primary-hover: #7c3aed;
            --uvaco-primary-glow: rgba(139, 92, 246, 0.4);
            --uvaco-secondary: #a78bfa;
            --uvaco-accent: #f472b6;
            --uvaco-accent-gold: #fbbf24;
            --uvaco-accent-cyan: #38bdf8;
            --uvaco-accent-green: #34d399;
            --uvaco-danger: #fb7185;

            --uvaco-bg-body: #0d0b18;
            --uvaco-bg-surface: #130e24;
            --uvaco-bg-card: #191233;
            --uvaco-bg-card-hover: #211842;
            --uvaco-border: rgba(139, 92, 246, 0.18);
            --uvaco-border-bright: rgba(139, 92, 246, 0.45);

            --uvaco-text-main: #f8fafc;
            --uvaco-text-muted: #94a3b8;
            --uvaco-text-dim: #64748b;

            --uvaco-radius-sm: 8px;
            --uvaco-radius-md: 14px;
            --uvaco-radius-lg: 20px;
            --uvaco-radius-full: 9999px;

            --uvaco-font-sans: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            --uvaco-font-serif: 'Noto Serif TC', serif;
        }

        body {
            background-color: var(--uvaco-bg-body);
            color: var(--uvaco-text-main);
            font-family: var(--uvaco-font-sans);
            margin: 0;
            padding: 1.25rem;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 戰術抬頭玻璃面板 (Tactical HUD Header) */
        .hud-glass-panel {
            background: linear-gradient(135deg, rgba(25, 18, 51, 0.75) 0%, rgba(19, 14, 36, 0.85) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--uvaco-border);
            border-radius: var(--uvaco-radius-lg);
            padding: 1.25rem 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            margin-bottom: 1.5rem;
            position: relative;
        }

        .hud-glass-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 5%;
            width: 90%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--uvaco-primary), transparent);
        }

        /* 戰情數字徽章 */
        .stat-chip {
            background: rgba(139, 92, 246, 0.08);
            border: 1px solid var(--uvaco-border);
            border-radius: var(--uvaco-radius-md);
            padding: 0.6rem 1rem;
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            transition: all 0.25s ease;
        }

        .stat-chip:hover {
            border-color: var(--uvaco-primary);
            background: rgba(139, 92, 246, 0.15);
            transform: translateY(-2px);
        }

        .stat-icon-wrap {
            width: 36px;
            height: 36px;
            border-radius: var(--uvaco-radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        /* 視圖切換器與濾鏡按鈕 */
        .nav-pills-tactical .nav-link {
            color: var(--uvaco-text-muted);
            background: rgba(25, 18, 51, 0.6);
            border: 1px solid var(--uvaco-border);
            border-radius: var(--uvaco-radius-full);
            padding: 0.45rem 1.1rem;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .nav-pills-tactical .nav-link.active,
        .nav-pills-tactical .nav-link:hover {
            color: #fff;
            background: var(--uvaco-primary);
            border-color: var(--uvaco-primary);
            box-shadow: 0 0 15px var(--uvaco-primary-glow);
        }

        /* 戰術夥伴卡片 (Tactical Member Cards) */
        .partner-card {
            background: var(--uvaco-bg-card);
            border: 1px solid var(--uvaco-border);
            border-radius: var(--uvaco-radius-lg);
            padding: 1.25rem;
            position: relative;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .partner-card:hover {
            border-color: var(--uvaco-border-bright);
            background: var(--uvaco-bg-card-hover);
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(139, 92, 246, 0.2);
        }

        .partner-card.is-core {
            border-left: 4px solid var(--uvaco-primary);
        }

        .partner-card.is-cross {
            border-left: 4px solid var(--uvaco-text-dim);
            opacity: 0.88;
        }

        .partner-avatar-wrap {
            position: relative;
            width: 58px;
            height: 58px;
            flex-shrink: 0;
        }

        .partner-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--uvaco-primary);
            background: #2d1f47;
        }

        .rank-badge-floating {
            position: absolute;
            bottom: -4px;
            right: -4px;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 0.15rem 0.4rem;
            border-radius: var(--uvaco-radius-full);
            background: var(--uvaco-primary);
            color: #fff;
            border: 2px solid var(--uvaco-bg-card);
            text-transform: uppercase;
        }

        /* 職級階梯色彩標識 */
        .rank-tag-MGR { background: #38bdf8; color: #082f49; } /* 經理 - 天藍 */
        .rank-tag-PRD { background: #34d399; color: #022c22; } /* 珍珠 - 翡翠綠 */
        .rank-tag-DIR { background: #fbbf24; color: #451a03; } /* 翡翠 - 金琥珀 */
        .rank-tag-EMER { background: #f472b6; color: #500724; } /* 藍鑽 - 霓虹粉 */
        .rank-tag-DIA { background: #c084fc; color: #3b0764; } /* 皇冠 - 魅紫 */
        .rank-tag-PRO, .rank-tag-MEM { background: #64748b; color: #ffffff; } /* 主任/會員 */

        /* SV 考核進度條 (12,000 SV 戰術計量) */
        .sv-progress-track {
            background: rgba(255, 255, 255, 0.06);
            border-radius: var(--uvaco-radius-full);
            height: 8px;
            overflow: hidden;
            position: relative;
            margin: 0.5rem 0 0.25rem 0;
        }

        .sv-progress-fill {
            height: 100%;
            border-radius: var(--uvaco-radius-full);
            background: linear-gradient(90deg, var(--uvaco-primary) 0%, var(--uvaco-accent) 100%);
            transition: width 0.6s ease;
        }

        .sv-progress-fill.is-qualified {
            background: linear-gradient(90deg, #10b981 0%, #34d399 100%);
            box-shadow: 0 0 10px rgba(52, 211, 153, 0.5);
        }

        /* 戰術血緣樹節點樣式 (Lineage Tree Grid) */
        .tree-node-card {
            background: rgba(25, 18, 51, 0.85);
            border: 1px solid var(--uvaco-border);
            border-radius: var(--uvaco-radius-md);
            padding: 1rem;
            margin-bottom: 0.75rem;
            position: relative;
            transition: all 0.2s ease;
        }

        .tree-node-card:hover {
            border-color: var(--uvaco-primary);
            background: rgba(33, 24, 66, 0.95);
        }

        .tree-level-indent {
            border-left: 2px dashed rgba(139, 92, 246, 0.3);
            margin-left: 1.25rem;
            padding-left: 1.25rem;
        }

        /* DataTables 自訂深紫風格 */
        .table-responsive-custom {
            background: var(--uvaco-bg-surface);
            border: 1px solid var(--uvaco-border);
            border-radius: var(--uvaco-radius-lg);
            padding: 1rem;
        }

        table.dataTable {
            color: var(--uvaco-text-main) !important;
            border-color: var(--uvaco-border) !important;
        }

        table.dataTable thead th {
            background-color: rgba(139, 92, 246, 0.12) !important;
            color: var(--uvaco-secondary) !important;
            border-bottom: 1px solid var(--uvaco-border-bright) !important;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        table.dataTable tbody tr {
            background-color: transparent !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04) !important;
        }

        table.dataTable tbody tr:hover {
            background-color: rgba(139, 92, 246, 0.08) !important;
        }

        .dataTables_filter input {
            background: var(--uvaco-bg-card) !important;
            border: 1px solid var(--uvaco-border) !important;
            color: #fff !important;
            border-radius: var(--uvaco-radius-full) !important;
            padding: 0.35rem 0.85rem !important;
        }

        /* 浮動行動按鈕 (Floating Action Drawer & Modal) */
        .offcanvas-tactical {
            background: #110c22;
            border-left: 1px solid var(--uvaco-border-bright);
            color: var(--uvaco-text-main);
        }

        .form-tactical-control {
            background: #1a1333;
            border: 1px solid var(--uvaco-border);
            color: #fff;
            border-radius: var(--uvaco-radius-sm);
        }

        .form-tactical-control:focus {
            background: #20173f;
            border-color: var(--uvaco-primary);
            color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(139, 92, 246, 0.25);
        }

        /* 自訂按鈕體系 */
        .btn-purple-primary {
            background: linear-gradient(135deg, var(--uvaco-primary) 0%, #6d28d9 100%);
            color: #fff;
            border: none;
            border-radius: var(--uvaco-radius-md);
            padding: 0.5rem 1.25rem;
            font-weight: 600;
            box-shadow: 0 4px 14px var(--uvaco-primary-glow);
            transition: all 0.25s ease;
        }

        .btn-purple-primary:hover {
            background: linear-gradient(135deg, #9d71f7 0%, #7c3aed 100%);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.6);
            transform: translateY(-1px);
            color: #fff;
        }

        .btn-icon-tactical {
            width: 32px;
            height: 32px;
            padding: 0;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            color: var(--uvaco-text-muted);
            border: 1px solid var(--uvaco-border);
            transition: all 0.2s;
        }

        .btn-icon-tactical:hover {
            color: #fff;
            background: var(--uvaco-primary);
            border-color: var(--uvaco-primary);
        }
    </style>
</head>
<body>

    <div class="hud-glass-panel">
        <div class="row g-3 align-items-center">
            <div class="col-12 col-xl-4">
                <div class="d-flex align-items-center gap-3">
                    <div class="stat-icon-wrap bg-primary bg-opacity-25 text-primary">
                        <i class="fa-solid fa-sitemap fa-lg"></i>
                    </div>
                    <div>
                        <div class="d-flex align-items-center gap-2">
                            <h4 class="mb-0 fw-bold font-serif text-white">組織成員戰術中樞</h4>
                            <span class="badge bg-primary bg-opacity-20 text-primary border border-primary border-opacity-25">H41000</span>
                        </div>
                        <p class="mb-0 text-secondary small">直屬血緣矩陣 / 經理考核安全邊際 / 跨國人才檔案庫</p>
                    </div>
                </div>
            </div>

            <div class="col-12 col-xl-5">
                <div class="d-flex flex-wrap gap-2 justify-content-xl-center">
                    <div class="stat-chip">
                        <span class="text-secondary small"><i class="fa-solid fa-users text-primary"></i> 團隊總人數</span>
                        <span class="fw-bold text-white fs-6" id="hud-total-partners">0</span>
                    </div>
                    <div class="stat-chip">
                        <span class="text-secondary small"><i class="fa-solid fa-medal text-warning"></i> 合格經理數</span>
                        <span class="fw-bold text-warning fs-6" id="hud-qualified-mgrs">0</span>
                    </div>
                    <div class="stat-chip">
                        <span class="text-secondary small"><i class="fa-solid fa-shield-halved text-danger"></i> 借點待沖銷</span>
                        <span class="fw-bold text-danger fs-6" id="hud-sv-loans">0 SV</span>
                    </div>
                </div>
            </div>

            <div class="col-12 col-xl-3 text-xl-end d-flex gap-2 justify-content-xl-end">
                <button class="btn btn-outline-light btn-sm border-secondary border-opacity-25 rounded-pill px-3" id="btn-sync-sheet">
                    <i class="fa-solid fa-arrows-rotate"></i> 同步試算表
                </button>
                <button class="btn btn-purple-primary btn-sm rounded-pill" data-bs-toggle="offcanvas" data-bs-target="#offcanvasPartnerDetail" onclick="openPartnerModalForCreate()">
                    <i class="fa-solid fa-user-plus"></i> 登錄新夥伴
                </button>
            </div>
        </div>

        <hr class="my-3 border-secondary border-opacity-25">
        <div class="row g-2 align-items-center justify-content-between">
            <div class="col-12 col-lg-8">
                <div class="d-flex flex-wrap gap-1 align-items-center">
                    <span class="text-secondary small me-2"><i class="fa-solid fa-filter"></i> 戰術分流：</span>
                    <ul class="nav nav-pills nav-pills-tactical gap-1" id="filter-pills">
                        <li class="nav-item">
                            <button class="nav-link active" data-filter="ALL"><i class="fa-solid fa-globe"></i> 全員網絡</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" data-filter="OUR_TEAM"><i class="fa-solid fa-star text-warning"></i> Ray&Jarvis 直屬</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" data-filter="QUALIFIED_MGR"><i class="fa-solid fa-award text-info"></i> 達標經理 (12k+)</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" data-filter="MGR_PIPELINE"><i class="fa-solid fa-bolt text-danger"></i> 衝刺梯隊 (<12k)</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" data-filter="MY_MARKET"><span class="fi fi-my"></span> 大馬戰隊</button>
                        </li>
                    </ul>
                </div>
            </div>

            <div class="col-12 col-lg-4 text-lg-end">
                <div class="btn-group btn-group-sm p-1 bg-black bg-opacity-40 border border-secondary border-opacity-25 rounded-pill" role="group">
                    <input type="radio" class="btn-check" name="viewMode" id="view-cards" autocomplete="off" checked>
                    <label class="btn btn-outline-light border-0 rounded-pill px-3 py-1" for="view-cards">
                        <i class="fa-solid fa-table-cells-large"></i> 戰術卡
                    </label>

                    <input type="radio" class="btn-check" name="viewMode" id="view-table" autocomplete="off">
                    <label class="btn btn-outline-light border-0 rounded-pill px-3 py-1" for="view-table">
                        <i class="fa-solid fa-list-check"></i> 數據矩陣
                    </label>

                    <input type="radio" class="btn-check" name="viewMode" id="view-tree" autocomplete="off">
                    <label class="btn btn-outline-light border-0 rounded-pill px-3 py-1" for="view-tree">
                        <i class="fa-solid fa-network-wired"></i> 血緣樹
                    </label>
                </div>
            </div>
        </div>
    </div>

    <div id="container-cards-view">
        <div class="row g-3" id="partner-cards-grid">
            </div>
    </div>

    <div id="container-table-view" class="d-none">
        <div class="table-responsive-custom">
            <table id="partners-datatable" class="table table-hover align-middle w-100">
                <thead>
                    <tr>
                        <th>夥伴代碼 / 姓名</th>
                        <th>國家</th>
                        <th>目前職級</th>
                        <th>直屬上線 / 安置人</th>
                        <th>歸屬體系</th>
                        <th>個人 / 小組當月 SV</th>
                        <th>經理安全邊際 (12k)</th>
                        <th>狀態</th>
                        <th class="text-end">戰術操作</th>
                    </tr>
                </thead>
                <tbody id="partners-table-body">
                    </tbody>
            </table>
        </div>
    </div>

    <div id="container-tree-view" class="d-none">
        <div class="hud-glass-panel">
            <div class="d-flex align-items-center justify-content-between mb-3">
                <h5 class="mb-0 fw-bold text-white"><i class="fa-solid fa-diagram-project text-primary"></i> 組織血緣脈絡導航樹</h5>
                <span class="text-secondary small">提示：點擊節點可快速展開/收合下線分支</span>
            </div>
            <div id="lineage-tree-root">
                </div>
        </div>
    </div>

    <div class="offcanvas offcanvas-end offcanvas-tactical w-50" tabindex="-1" id="offcanvasPartnerDetail" style="min-width: 360px; max-width: 600px;">
        <div class="offcanvas-header border-bottom border-secondary border-opacity-25">
            <h5 class="offcanvas-title fw-bold text-white d-flex align-items-center gap-2" id="offcanvasTitle">
                <i class="fa-solid fa-id-card-clip text-primary"></i> 夥伴戰術檔案 360°
            </h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body p-4">
            <form id="partnerForm">
                <input type="hidden" id="form-partner-id">

                <div class="d-flex align-items-center gap-3 mb-4 p-3 bg-black bg-opacity-30 rounded-3 border border-secondary border-opacity-25">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" id="form-preview-avatar" class="rounded-circle border border-primary" width="64" height="64" alt="Avatar">
                    <div class="flex-grow-1">
                        <label class="text-secondary small">頭像圖片 URL</label>
                        <input type="url" class="form-control form-tactical-control form-control-sm" id="form-avatar-url" placeholder="https://..." value="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150">
                    </div>
                </div>

                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <label class="form-label text-secondary small">真實姓名 *</label>
                        <input type="text" class="form-control form-tactical-control" id="form-real-name" required placeholder="例如：林承志">
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label text-secondary small">戰術暱稱 / 常用稱呼</label>
                        <input type="text" class="form-control form-tactical-control" id="form-nick-name" placeholder="例如：Jarvis">
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label text-secondary small">所屬國家 / 市場 *</label>
                        <select class="form-select form-tactical-control" id="form-country-code">
                            <option value="TW">🇹🇼 台灣 (Taiwan)</option>
                            <option value="MY">🇲🇾 馬來西亞 (Malaysia)</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label text-secondary small">目前職級 (葡眾體系) *</label>
                        <select class="form-select form-tactical-control" id="form-rank-code">
                            <option value="MEM">會員 (Member)</option>
                            <option value="PRO">主任 (Promoter)</option>
                            <option value="MGR" selected>經理 (Manager - 12k門檻)</option>
                            <option value="PRD">珍珠 (Pearl Director)</option>
                            <option value="DIR">翡翠 (Jade Director)</option>
                            <option value="EMER">藍鑽 (Blue Diamond)</option>
                            <option value="DIA">皇冠 (Crown)</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label text-secondary small">直屬推薦上線 (Sponsor ID)</label>
                        <input type="text" class="form-control form-tactical-control" id="form-sponsor-id" placeholder="例如：P-TW-0001 (Ray)">
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label text-secondary small">組織線路安置人 (Placement ID)</label>
                        <input type="text" class="form-control form-tactical-control" id="form-placement-id" placeholder="例如：P-TW-0001">
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label text-secondary small">團隊歸屬 *</label>
                        <select class="form-select form-tactical-control" id="form-is-our-team">
                            <option value="Y">⭐️ Ray & Jarvis 核心直屬體系</option>
                            <option value="N">🌐 大體系 / 旁線支援友軍</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label text-secondary small">關係類型</label>
                        <select class="form-select form-tactical-control" id="form-relation-type">
                            <option value="DIRECT">直屬本體系 (Direct Downline)</option>
                            <option value="UP_LINE">上線領導體系 (Upline)</option>
                            <option value="CROSS_LINE">旁線友軍交流 (Crossline)</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-6">

                if (currentFilter === 'MY_MARKET') return p.country_code === 'MY';

        // 8. 渲染血緣樹 (Lineage Tree View)
        function renderTreeView() {
            const container = $('#lineage-tree-root');
            container.empty();

            // 尋找根節點 (如 Ray)
            const roots = partnersDatabase.filter(p => p.sponsor_id === 'ROOT' || p.partner_id === 'P-TW-0001');

            function buildBranch(partner) {
                const children = partnersDatabase.filter(p => p.sponsor_id === partner.partner_id);
                const flagClass = partner.country_code === 'MY' ? 'fi-my' : 'fi-tw';

                let html = `
                    <div class="tree-node-card">
                        <div class="d-flex align-items-center justify-content-between">
                            <div class="d-flex align-items-center gap-3">
                                <img src="${partner.avatar_url}" class="rounded-circle border border-primary" width="36" height="36">
                                <div>
                                    <span class="fw-bold text-white">${partner.real_name}</span>
                                    <span class="badge rank-tag-${partner.rank_code} ms-1">${partner.rank_code}</span>
                                    <span class="fi ${flagClass} ms-1"></span>
                                    <span class="text-secondary small font-monospace ms-2">[${partner.partner_id}]</span>
                                </div>
                            </div>
                            <div class="d-flex align-items-center gap-3">
                                <span class="font-monospace text-secondary small">當月: <strong class="text-white">${partner.current_month_group_sv.toLocaleString()} SV</strong></span>
                                <button class="btn btn-sm btn-icon-tactical" onclick="openPartnerModalForEdit('${partner.partner_id}')">
                                    <i class="fa-solid fa-arrow-right"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;

                if (children.length > 0) {
                    html += `<div class="tree-level-indent">`;
                    children.forEach(child => {
                        html += buildBranch(child);
                    });
                    html += `</div>`;
                }

                return html;
            }

            roots.forEach(root => {
                container.append(buildBranch(root));
            });
        }

            $('#form-join-date').val(new Date().toISOString().split('T')[0]);
        }

        function openPartnerModalForEdit(partnerId) {
            const partner = partnersDatabase.find(p => p.partner_id === partnerId);
            if (!partner) return;

            $('#offcanvasTitle').html(`<i class="fa-solid fa-id-card-clip text-primary"></i> 編輯夥伴檔案 - ${partner.real_name}`);
            $('#form-partner-id').val(partner.partner_id);
            $('#form-real-name').val(partner.real_name);
            $('#form-nick-name').val(partner.nick_name || '');
            $('#form-avatar-url').val(partner.avatar_url);
            $('#form-preview-avatar').attr('src', partner.avatar_url);
            $('#form-country-code').val(partner.country_code);
            $('#form-rank-code').val(partner.rank_code);
            $('#form-sponsor-id').val(partner.sponsor_id);
            $('#form-placement-id').val(partner.placement_id);
            $('#form-is-our-team').val(partner.is_our_team);
            $('#form-relation-type').val(partner.relation_type);
            $('#form-phone').val(partner.phone);
            $('#form-line-id').val(partner.line_id);
            $('#form-join-date').val(partner.join_date);
            $('#form-target-mgr-date').val(partner.target_mgr_date || '');
            $('#form-notes').val(partner.notes || '');

            const offcanvasElement = document.getElementById('offcanvasPartnerDetail');
            const bsOffcanvas = bootstrap.Offcanvas.getOrCreateInstance(offcanvasElement);
            bsOffcanvas.show();
        }

        function savePartnerData() {
            const id = $('#form-partner-id').val();
            const partnerData = {
                partner_id: id || `P-${$('#form-country-code').val()}-${String(partnersDatabase.length + 1).padStart(4, '0')}`,
                real_name: $('#form-real-name').val(),
                nick_name: $('#form-nick-name').val(),
                avatar_url: $('#form-avatar-url').val() || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150',
                country_code: $('#form-country-code').val(),
                rank_code: $('#form-rank-code').val(),
                sponsor_id: $('#form-sponsor-id').val() || 'ROOT',
                placement_id: $('#form-placement-id').val() || 'ROOT',
                is_our_team: $('#form-is-our-team').val(),
                relation_type: $('#form-relation-type').val(),
                phone: $('#form-phone').val(),
                line_id: $('#form-line-id').val(),
                current_month_personal_sv: id ? (partnersDatabase.find(p => p.partner_id === id)?.current_month_personal_sv || 0) : 0,
                current_month_group_sv: id ? (partnersDatabase.find(p => p.partner_id === id)?.current_month_group_sv || 0) : 0,
                total_career_sv: id ? (partnersDatabase.find(p => p.partner_id === id)?.total_career_sv || 0) : 0,
                join_date: $('#form-join-date').val(),
                target_mgr_date: $('#form-target-mgr-date').val(),
                unsettled_loan_sv: id ? (partnersDatabase.find(p => p.partner_id === id)?.unsettled_loan_sv || 0) : 0,
                status: 'ACTIVE',
                notes: $('#form-notes').val()
            };

            if (id) {
                const index = partnersDatabase.findIndex(p => p.partner_id === id);
                if (index !== -1) partnersDatabase[index] = partnerData;
            } else {
                partnersDatabase.unshift(partnerData);
            }

            const offcanvasElement = document.getElementById('offcanvasPartnerDetail');
            bootstrap.Offcanvas.getInstance(offcanvasElement).hide();
            renderAllViews();
            alert('【戰術檔案已儲存】夥伴資料已更新並同步至本地陣列結構中！');
        }

        function deletePartner(partnerId) {
            if (confirm(`確定要封存/移除代碼為 [${partnerId}] 的成員檔案嗎？`)) {
                partnersDatabase = partnersDatabase.filter(p => p.partner_id !== partnerId);
                renderAllViews();
            }
        }
    </script>
</body>
</html>
