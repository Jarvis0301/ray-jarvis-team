<!DOCTYPE html>
<html lang="zh-TW">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>榮祥葡眾團隊 | 極密進銷存與倉儲管理系統</title>
        
        <script src="../assets/js/auth-guard.js"></script>
        
        <script src="../assets/js/vendor-loader.js"></script>

        <link rel="stylesheet" href="../assets/css/public.css">

        <script>
            // 設定 Google 試算表 CSV 發布連結 (請替換為實際公開的 CSV 網址)
            const SPREADSHEET_ID = '1nY-6mo9trXLMwkRGOqdvBU_va75DmsxIONIraMtTv2k';

            // 備用數據（當網路失敗或 Google 試算表斷連時啟用）
            const fallbackMenuData = [
                { ID: '100', 中文: '進銷存儀表板', 英文: 'Dashboard', 所屬階層: '0', 父頁面選單ID: 'root', 連結: 'home.html', FontAwesomeIcon: 'fas fa-chart-pie', 是否有效: 'Y' },
                { ID: '200', 中文: '產品庫存盤點', 英文: 'Inventory', 所屬階層: '0', 父頁面選單ID: 'root', 連結: 'inventory.html', FontAwesomeIcon: 'fas fa-boxes-stacked', 是否有效: 'Y' },
                { ID: '300', 中文: '進出貨作業', 英文: 'Logistics', 所屬階層: '0', 父頁面選單ID: 'root', 連結: '#', FontAwesomeIcon: 'fas fa-file-invoice-dollar', 是否有效: 'Y' },
                { ID: '301', 中文: '進貨入庫單', 英文: 'Inbound Orders', 所屬階層: '1', 父頁面選單ID: '300', 連結: 'inbound.html', FontAwesomeIcon: 'fas fa-truck-ramp-box', 是否有效: 'Y' },
                { ID: '302', 中文: '銷貨出庫單', 英文: 'Outbound Orders', 所屬階層: '1', 父頁面選單ID: '300', 連結: 'outbound.html', FontAwesomeIcon: 'fas fa-boxes-packing', 是否有效: 'Y' },
                { ID: '400', 中文: '財務與利潤分析', 英文: 'Financial Reports', 所屬階層: '0', 父頁面選單ID: 'root', 連結: 'reports.html', FontAwesomeIcon: 'fas fa-receipt', 是否有效: 'Y' }
            ];

            // 核心修改：監聽 vendorReady 事件，確保 jQuery 與 Chart.js 已全部載入記憶體
            window.addEventListener('vendorReady', function() {
                initSidebarToggle();
                fetchGoogleSheetMenu();
                initDesktopSitemapObserver();
                
                // 預設載入進銷存儀表板首頁
                loadPage('home.html');
            });

            // 1. 左側選單收折邏輯
            function initSidebarToggle() {
                $('#sidebarToggle').on('click', function() {
                    if ($(window).width() >= 992) {
                        $('#portalSidebar').toggleClass('collapsed');
                        $('#portalWrapper').toggleClass('sidebar-collapsed');
                    } else {
                        $('#portalSidebar').toggleClass('mobile-open');
                    }
                });

                // 點擊外部自動關閉手機選單
                $(document).on('click', function(e) {
                    if ($(window).width() < 992) {
                        if (!$(e.target).closest('#portalSidebar, #sidebarToggle').length) {
                            $('#portalSidebar').removeClass('mobile-open');
                        }
                    }
                });
            }

            // 2. 抓取 Google 試算表資料並解析進銷存版選單（與欄位名稱解耦合）
            function fetchGoogleSheetMenu() {
                // 抓取試算表中的「進銷存」工作表
                const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent("進銷存系統")}`;
                Papa.parse(url, {
                    download: true,
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        if (results.data && results.data.length > 0) {
                            renderDynamicMenu(results.data);
                        } else {
                            renderDynamicMenu(fallbackMenuData);
                        }
                    },
                    error: function(err) {
                        console.warn('Google 試算表進銷存版抓取失敗，啟用備用選單數據:', err);
                        renderDynamicMenu(fallbackMenuData);
                    }
                });
            }

            // 3. 動態渲染樹狀選單與 Sitemap（實施欄位名稱解耦合字典）
            function renderDynamicMenu(data) {
                const $container = $('#dynamicMenuContainer');
                const $sitemapContainer = $('#sitemapContainer');
                $container.empty();
                $sitemapContainer.empty();

                // 欄位解耦合字典 Key Map
                const getVal = (item, keys) => {
                    for (const k of keys) {
                        if (item[k] !== undefined && item[k] !== null && item[k] !== '') {
                            return String(item[k]).trim();
                        }
                    }
                    return '';
                };

                // 過濾有效數據
                const validData = data.filter(item => {
                    const valid = getVal(item, ['是否有效', '有效', 'Active', 'Valid', 'Status']).toUpperCase();
                    return valid === 'Y' || valid === 'TRUE' || valid === '1' || valid === '是';
                });

                // 分離根選單與子選單
                const rootItems = validData.filter(item => {
                    const level = getVal(item, ['所屬階層', '階層', 'Level', 'Layer']);
                    const parentId = getVal(item, ['父頁面選單ID', '父選單ID', 'ParentID', 'Parent']);
                    return level === '0' || parentId === 'root' || parentId === '';
                });

                const childItems = validData.filter(item => {
                    const level = getVal(item, ['所屬階層', '階層', 'Level', 'Layer']);
                    return level === '1';
                });

                rootItems.forEach(root => {
                    const rootId = getVal(root, ['ID', 'Id', 'id', 'MenuID']);
                    const rootName = getVal(root, ['中文', '名稱', 'Title', 'Name']) || '未命名選單';
                    const rootIcon = getVal(root, ['FontAwesomeIcon', 'Icon', '圖示']) || 'fas fa-folder';
                    const rootLink = getVal(root, ['連結', 'Link', 'URL', 'Url']) || '#';

                    const children = childItems.filter(child => {
                        const parentId = getVal(child, ['父頁面選單ID', '父選單ID', 'ParentID', 'Parent']);
                        return parentId === rootId;
                    });
                    const hasChild = children.length > 0;
                    const isExternal = rootLink.startsWith('http://') || rootLink.startsWith('https://');

                    // 構建左側選單 HTML
                    let menuItemHtml = `<li class="nav-item">`;
                    
                    if (hasChild) {
                        menuItemHtml += `
                            <a href="#" class="nav-item-link parent-toggle" data-target="submenu-${rootId}">
                                <div class="d-flex align-items-center gap-2">
                                    <span class="menu-icon-box"><i class="${rootIcon}"></i></span>
                                    <span class="menu-text"> ${rootName}</span>
                                </div>
                                <i class="fas fa-chevron-down submenu-arrow small"></i>
                            </a>
                            <ul class="submenu-container" id="submenu-${rootId}">`;

                        let sitemapSubHtml = '';
                        children.forEach(child => {
                            const childName = getVal(child, ['中文', '名稱', 'Title', 'Name']);
                            const childLink = getVal(child, ['連結', 'Link', 'URL', 'Url']) || '#';
                            const childIcon = getVal(child, ['FontAwesomeIcon', 'Icon', '圖示']) || 'fas fa-angle-right';
                            const childExternal = childLink.startsWith('http://') || childLink.startsWith('https://');
                            const targetAttr = childExternal ? 'target="_blank"' : '';
                            const clickHandler = childExternal ? '' : `onclick="loadPage('${childLink}'); return false;"`;

                            menuItemHtml += `
                                <li>
                                    <a href="${childLink}" ${targetAttr} ${clickHandler} class="submenu-link">
                                        <i class="${childIcon} me-2 small"></i>
                                        <span class="menu-text"> ${childName}</span>
                                    </a>
                                </li>`;

                            sitemapSubHtml += `
                                <li>
                                    <a href="${childLink}" ${targetAttr} ${clickHandler}>
                                        <i class="${childIcon} me-1"></i> ${childName}
                                    </a>
                                </li>`;
                        });

                        menuItemHtml += `</ul>`;

                        // 構建電腦版 Sitemap 欄位
                        $sitemapContainer.append(`
                            <div class="col-lg-3 col-md-4">
                                <div class="fw-bold text-purple-bright mb-2">
                                    <i class="${rootIcon}"></i> ${rootName}
                                </div>
                                <ul class="sitemap-list">${sitemapSubHtml}</ul>
                            </div>
                        `);

                    } else {
                        const targetAttr = isExternal ? 'target="_blank"' : '';
                        const clickHandler = isExternal ? '' : `onclick="loadPage('${rootLink}'); return false;"`;

                        menuItemHtml += `
                            <a href="${rootLink}" ${targetAttr} ${clickHandler} class="nav-item-link">
                                <div class="d-flex align-items-center gap-2">
                                    <span class="menu-icon-box"><i class="${rootIcon}"></i></span>
                                    <span class="menu-text"> ${rootName}</span>
                                </div>
                                ${isExternal ? '<i class="fas fa-arrow-up-right-from-square small text-muted"></i>' : ''}
                            </a>`;

                        $sitemapContainer.append(`
                            <div class="col-lg-3 col-md-4">
                                <div class="fw-bold text-purple-bright mb-2">
                                    <a href="${rootLink}" ${targetAttr} ${clickHandler} class="text-decoration-none text-purple-bright">
                                        <i class="${rootIcon}"></i> ${rootName}
                                    </a>
                                </div>
                            </div>
                        `);
                    }

                    menuItemHtml += `</li>`;
                    $container.append(menuItemHtml);
                });

                // 綁定動態折疊事件
                $('.parent-toggle').on('click', function(e) {
                    e.preventDefault();
                    const targetId = $(this).data('target');
                    $(`#${targetId}`).slideToggle(200).toggleClass('show');
                    $(this).find('.submenu-arrow').toggleClass('fa-rotate-180');
                });
            }

            // 4. 無縫切換中央頁面（避免二次卷軸）
            function loadPage(pageUrl) {
                if (!pageUrl || pageUrl === '#') return;

                // 關閉手機側邊欄
                $('#portalSidebar').removeClass('mobile-open');

                // 非同步 Ajax 載入目標 html 檔案
                $('#page-content-container').html(`
                    <div class="text-center py-5">
                        <div class="spinner-border text-purple" role="status"></div>
                        <p class="text-muted mt-3"><i class="fas fa-microchip"></i> 正在安全調取進銷存數據...</p>
                    </div>
                `);

                $.ajax({
                    url: pageUrl,
                    type: 'GET',
                    dataType: 'html',
                    success: function(response) {
                        $('#page-content-container').html(response);
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    },
                    error: function() {
                        // 若單獨 HTML 尚未上傳，顯示極密紫色樣式提示卡片
                        $('#page-content-container').html(`
                            <div class="card bg-dark border-purple text-light p-4 my-4 shadow-lg">
                                <div class="card-body text-center">
                                    <i class="fas fa-warehouse text-purple display-4 mb-3"></i>
                                    <h3>進銷存模組建置中 (${pageUrl})</h3>
                                    <p class="text-muted">已成功觸發動態路由！極密進銷存模組 <code>${pageUrl}</code> 部署完成後即可自動無縫渲染。</p>
                                    <button class="btn btn-outline-purple mt-2" onclick="loadPage('home.html')">
                                        <i class="fas fa-house"></i> 返回進銷存儀表板
                                    </button>
                                </div>
                            </div>
                        `);
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }
                });
            }

            // 5. 電腦版 Sitemap 滾動到最下方才出現的 IntersectionObserver 機制
            function initDesktopSitemapObserver() {
                if (!('IntersectionObserver' in window)) {
                    $('#desktopSitemap').addClass('visible');
                    return;
                }

                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            $('#desktopSitemap').addClass('visible');
                        }
                    });
                }, {
                    threshold: 0.2
                });

                const footerTarget = document.getElementById('portalFooter');
                if (footerTarget) {
                    observer.observe(footerTarget);
                }
            }
        </script>
        
        <style>
            :root {
                /* 進銷存系統：魅影紫與電光紫深色主題色系 */
                --bg-main: #0f0a1c;
                --bg-sidebar: #171030;
                --bg-card: #1e1740;
                --bg-header: #130d28;
                --accent-purple: #a855f7;
                --accent-purple-bright: #c084fc;
                --accent-hover: rgba(168, 85, 247, 0.18);
                --border-color: rgba(168, 85, 247, 0.25);
                --text-main: #f8fafc;
                --text-muted: #94a3b8;
                --accent-pink: #f43f5e;
                --sidebar-width: 280px;
                --sidebar-collapsed-width: 80px;
                --header-height: 70px;
            }

            body {
                background-color: var(--bg-main);
                color: var(--text-main);
                font-family: 'Noto Sans TC', sans-serif;
                margin: 0;
                padding: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                overflow-x: hidden;
            }

            /* 頂部標題欄 */
            .portal-header {
                height: var(--header-height);
                background-color: var(--bg-header);
                border-bottom: 1px solid var(--border-color);
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                z-index: 1030;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 1.5rem;
                box-shadow: 0 4px 25px rgba(0, 0, 0, 0.6);
            }

            .brand-logo {
                color: var(--accent-purple-bright);
                font-size: 1.25rem;
                font-weight: 700;
                text-decoration: none;
                display: flex;
                align-items: center;
                gap: 0.5rem;
            }

            .toggle-btn {
                background: transparent;
                border: 1px solid var(--border-color);
                color: var(--accent-purple-bright);
                padding: 0.4rem 0.8rem;
                border-radius: 8px;
                cursor: pointer;
                transition: all 0.3s ease;
            }

            .toggle-btn:hover {
                background-color: var(--accent-hover);
                color: #ffffff;
                border-color: var(--accent-purple);
            }

            /* 通用極密紫按鈕與 Badge */
            .btn-outline-purple {
                color: var(--accent-purple-bright);
                border-color: var(--accent-purple);
            }

            .btn-outline-purple:hover {
                background-color: var(--accent-purple);
                color: #ffffff;
            }

            .border-purple {
                border-color: var(--border-color) !important;
            }

            .text-purple {
                color: var(--accent-purple) !important;
            }

            .text-purple-bright {
                color: var(--accent-purple-bright) !important;
            }

            .spinner-border.text-purple {
                color: var(--accent-purple) !important;
            }

            /* 主區域佈局容器 */
            .portal-wrapper {
                display: flex;
                margin-top: var(--header-height);
                flex: 1;
                position: relative;
            }

            /* 左側動態選單 */
            .portal-sidebar {
                width: var(--sidebar-width);
                background-color: var(--bg-sidebar);
                border-right: 1px solid var(--border-color);
                transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                position: fixed;
                top: var(--header-height);
                bottom: 0;
                left: 0;
                z-index: 1020;
                overflow-y: auto;
                overflow-x: hidden;
                display: flex;
                flex-direction: column;
            }

            /* 桌機收折狀態 */
            .portal-sidebar.collapsed {
                width: var(--sidebar-collapsed-width);
            }

            .portal-sidebar.collapsed .menu-text,
            .portal-sidebar.collapsed .submenu-arrow {
                display: none !important;
            }

            .portal-sidebar.collapsed .nav-item-link {
                justify-content: center;
                padding: 0.8rem 0;
            }

            .portal-sidebar.collapsed .submenu-container {
                display: none !important;
            }

            /* 選單項目樣式 */
            .sidebar-menu {
                list-style: none;
                padding: 1rem 0.75rem;
                margin: 0;
            }

            .nav-item-link {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0.75rem 1rem;
                color: var(--text-main);
                text-decoration: none;
                border-radius: 8px;
                margin-bottom: 0.3rem;
                transition: all 0.25s ease;
                font-size: 0.95rem;
            }

            .nav-item-link:hover, .nav-item-link.active {
                background-color: var(--accent-hover);
                color: var(--accent-purple-bright);
                border-left: 3px solid var(--accent-purple);
            }

            .menu-icon-box {
                width: 24px;
                text-align: center;
                font-size: 1.1rem;
                color: var(--accent-purple);
            }

            .submenu-container {
                list-style: none;
                padding-left: 1.5rem;
                margin-top: 0.2rem;
                margin-bottom: 0.5rem;
                display: none;
            }

            .submenu-container.show {
                display: block;
            }

            .submenu-link {
                display: flex;
                align-items: center;
                padding: 0.5rem 1rem;
                color: var(--text-muted);
                text-decoration: none;
                font-size: 0.88rem;
                border-radius: 6px;
                transition: all 0.2s ease;
            }

            .submenu-link:hover, .submenu-link.active {
                color: var(--accent-purple-bright);
                background-color: rgba(168, 85, 247, 0.12);
            }

            /* 中央動態內容區塊（無二次卷軸） */
            .portal-content {
                flex: 1;
                margin-left: var(--sidebar-width);
                transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                padding: 2rem;
                min-height: calc(100vh - var(--header-height));
                display: flex;
                flex-direction: column;
            }

            .portal-wrapper.sidebar-collapsed .portal-content {
                margin-left: var(--sidebar-collapsed-width);
            }

            #page-content-container {
                background-color: var(--bg-card);
                border-radius: 12px;
                border: 1px solid var(--border-color);
                flex: 1;
                padding: 1.5rem;
                animation: fadeIn 0.4s ease-in-out;
            }

            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(8px); }
                to { opacity: 1; transform: translateY(0); }
            }

            /* 頁尾樣式 */
            .portal-footer {
                background-color: var(--bg-header);
                border-top: 1px solid var(--border-color);
                padding: 2.5rem 1.5rem 1.5rem 1.5rem;
                margin-top: auto;
            }

            /* 電腦端滾動到最下面才出現的網站地圖 */
            .desktop-sitemap {
                border-bottom: 1px solid var(--border-color);
                padding-bottom: 2rem;
                margin-bottom: 2rem;
                opacity: 0;
                transform: translateY(20px);
                transition: opacity 0.6s ease, transform 0.6s ease;
            }

            .desktop-sitemap.visible {
                opacity: 1;
                transform: translateY(0);
            }

            .sitemap-title {
                color: var(--accent-purple-bright);
                font-size: 1.1rem;
                font-weight: 700;
                margin-bottom: 1rem;
            }

            .sitemap-list {
                list-style: none;
                padding: 0;
                margin: 0;
            }

            .sitemap-list li {
                margin-bottom: 0.5rem;
            }

            .sitemap-list a {
                color: var(--text-muted);
                text-decoration: none;
                font-size: 0.88rem;
                transition: color 0.2s ease;
            }

            .sitemap-list a:hover {
                color: var(--accent-purple-bright);
            }

            /* 社群圖示與聲明區 */
            .footer-social-btns {
                display: flex;
                gap: 1rem;
                justify-content: center;
                margin-bottom: 1.5rem;
            }

            .social-btn {
                width: 42px;
                height: 42px;
                border-radius: 50%;
                background-color: var(--bg-card);
                border: 1px solid var(--border-color);
                color: var(--accent-purple-bright);
                display: flex;
                align-items: center;
                justify-content: center;
                text-decoration: none;
                font-size: 1.2rem;
                transition: all 0.3s ease;
            }

            .social-btn:hover {
                background-color: var(--accent-purple);
                color: #ffffff;
                transform: translateY(-3px);
                box-shadow: 0 4px 12px rgba(168, 85, 247, 0.4);
            }

            .copyright-text {
                color: var(--text-muted);
                font-size: 0.85rem;
                text-align: center;
                line-height: 1.6;
            }

            .copyright-text a {
                color: var(--accent-purple-bright);
                text-decoration: none;
            }

            .copyright-text a:hover {
                text-decoration: underline;
            }

            /* 響應式斷點調整 (Mobile RWD) */
            @media (max-width: 991.98px) {
                .portal-sidebar {
                    transform: translateX(-100%);
                    width: 260px !important;
                }

                .portal-sidebar.mobile-open {
                    transform: translateX(0);
                    box-shadow: 4px 0 25px rgba(0, 0, 0, 0.75);
                }

                .portal-content {
                    margin-left: 0 !important;
                    padding: 1.25rem;
                }

                .desktop-sitemap {
                    display: none !important; /* 手機版本隱藏網站地圖 */
                }
            }
        </style>
    </head>

    <body>

        <header class="portal-header">
            <div class="d-flex align-items-center gap-3">
                <button class="toggle-btn" id="sidebarToggle" aria-label="Toggle Navigation">
                    <i class="fas fa-bars"></i> 選單
                </button>
                <a href="#" class="brand-logo" onclick="loadPage('home.html'); return false;">
                    <i class="fas fa-boxes-stacked"></i> 榮祥葡眾團隊
                </a>
            </div>
            <div class="d-flex align-items-center gap-2">
                <span class="badge bg-success bg-opacity-25 text-success border border-success border-opacity-50 px-3 py-2">
                    <i class="fas fa-shield-halved"></i> 公開版
                </span>
                <span class="badge bg-primary bg-opacity-25 text-info border border-info border-opacity-50 px-3 py-2">
                    <i class="fas fa-user-shield"></i> 內部團隊版
                </span>
                <span class="badge bg-purple bg-opacity-25 text-purple-bright border border-purple border-opacity-50 px-3 py-2">
