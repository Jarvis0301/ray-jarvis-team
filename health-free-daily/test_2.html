<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>葡眾進銷存管理系統 - 白名單驗證控制台</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            background-color: #061410;
            color: #e2e8f0;
            font-family: 'Noto Sans TC', sans-serif;
        }
        .card-custom {
            background-color: #0d221a;
            border: 1px solid #10b98133;
            border-radius: 12px;
        }
        .text-emerald {
            color: #10b981;
        }
        .btn-emerald {
            background-color: #10b981;
            color: #061410;
            font-weight: 700;
            border: none;
        }
        .btn-emerald:hover {
            background-color: #059669;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #0b1d16; border-bottom: 1px solid #10b98133;">
        <div class="container-fluid">
            <a class="navbar-brand text-emerald fw-bold" href="#">
                <i class="fa-solid fa-boxes-stacked"></i> 葡眾進銷存系統
            </a>
            <span class="navbar-text text-light" id="userInfo">
                <i class="fa-solid fa-user-shield"></i> 未登入身分
            </span>
        </div>
    </nav>

    <div class="container my-4">
        
        <div id="authSection" class="row justify-content-center my-5">
            <div class="col-md-6">
                <div class="card card-custom p-4 text-center shadow-lg">
                    <h3 class="text-emerald mb-3">
                        <i class="fa-solid fa-lock"></i> 零信任身份安全驗證
                    </h3>
                    <p class="text-secondary mb-4">請點擊下方按鈕以獲授權之 Google 帳號進行登入，系統將驗證數位權杖並比對白名單權限。</p>
                    
                    <div class="d-flex justify-content-center mb-3">
                        <div id="g_id_onload"
                            data-client_id="640635151045-bmu6985u73vbcgc6ef12pkgfa89pa8d8.apps.googleusercontent.com"
                            data-callback="handleCredentialResponse"
                            data-scope="openid email profile"
                            data-auto_prompt="false">
                        </div>
                        <div class="g_id_signin"
                            data-type="standard"
                            data-size="large"
                            data-theme="filled_dark"
                            data-text="sign_in_with"
                            data-shape="rectangular"
                            data-logo_alignment="left">
                        </div>
                    </div>
                    
                    <div id="authSpinner" class="text-emerald d-none my-2">
                        <i class="fa-solid fa-spinner fa-spin"></i> 向後端伺服器比對白名單中...
                    </div>
                    <div id="authAlert" class="alert alert-danger mt-3 d-none" role="alert"></div>
                </div>
            </div>
        </div>

        <div id="dashboardSection" class="d-none">
            
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <div class="card card-custom p-3">
                        <div class="text-secondary"><i class="fa-solid fa-cubes"></i> 總庫存品項</div>
                        <h2 class="text-emerald mt-2 mb-0" id="statTotalItems">0</h2>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card card-custom p-3">
                        <div class="text-secondary"><i class="fa-solid fa-triangle-exclamation"></i> 庫存預警品項</div>
                        <h2 class="text-warning mt-2 mb-0" id="statLowStock">0</h2>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card card-custom p-3">
                        <div class="text-secondary"><i class="fa-solid fa-coins"></i> 總庫存估值 (NTD)</div>
                        <h2 class="text-emerald mt-2 mb-0" id="statTotalValue">$0</h2>
                    </div>
                </div>
            </div>

            <div class="row g-4 mb-4">
                <div class="col-lg-8">
                    <div class="card card-custom p-3 h-100">
                        <h5 class="text-emerald mb-3">
                            <i class="fa-solid fa-list-check"></i> 產品庫存明細表
                        </h5>
                        <table id="inventoryTable" class="table table-dark table-striped table-hover w-100">
                            <thead>
                                <tr>
                                    <th>產品名稱</th>
                                    <th>當前庫存</th>
                                    <th>安全庫存</th>
                                    <th>單價 (NTD)</th>
                                    <th>狀態</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="card card-custom p-3 h-100">
                        <h5 class="text-emerald mb-3">
                            <i class="fa-solid fa-chart-pie"></i> 庫存類別占比
                        </h5>
                        <canvas id="inventoryChart"></canvas>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/2.1.8/js/dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/2.1.8/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"></script>

    <script>
        // 請替換為您部署的 GAS Web App URL
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxYk-8LshkBJ0MOeTB1mnkdJbBqv7h01sjLOquzXW3aZK2aCcjlWPvanDvHe8BIHJ1ADw/exec";
        // 設定 Google 試算表 gviz CSV 網址
        const INVENTORY_SPREADSHEET_CSV = "https://docs.google.com/spreadsheets/d/YOUR_SHEET_ID/gviz/tq?tqx=out:csv&sheet=Inventory";

        // Google 登入完成回調函式
        function handleCredentialResponse(response) {
            let idToken = response.credential;
            
            $('#authSpinner').removeClass('d-none');
            $('#authAlert').addClass('d-none');

            // 呼叫 GAS API 傳送 idToken 進行解密驗證
            $.ajax({
                url: GAS_API_URL,
                type: "POST",
                data: JSON.stringify({
                    idToken: idToken,
                    targetSystem: "erp"
                }),
                contentType: "text/plain;charset=utf-8",
                dataType: "json",
                success: function(res) {
                    $('#authSpinner').addClass('d-none');
                    if (res.success && res.role === "ADMIN") {
                        $('#authSection').addClass('d-none');
                        $('#dashboardSection').removeClass('d-none');
                        $('#userInfo').html('<i class="fa-solid fa-user-check"></i> 管理員：' + res.user);
                        
                        // 載入進銷存數據
                        loadInventoryData();
                    } else {
                        showAuthError(res.message || "身分驗證失敗：您缺乏權限存取此系統！");
                    }
                },
                error: function(xhr, status, error) {
                    $('#authSpinner').addClass('d-none');
                    showAuthError("無法連線至驗證伺服器，請確認 GAS 是否部署為「所有人 (Anyone)」存取。");
                }
            });
        }

        function showAuthError(msg) {
            $('#authAlert').removeClass('d-none').text(msg);
        }

        // 使用 PapaParse + gviz 載入數據並進行欄位解耦合
        function loadInventoryData() {
            Papa.parse(INVENTORY_SPREADSHEET_CSV, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    let rawData = results.data;
                    
                    // 欄位解耦對映 (Field Mapping Engine)
                    let decoupledData = rawData.map(row => {
                        return {
                            name: row["產品名稱"] || row["ProductName"] || "未命名產品",
                            stock: parseInt(row["當前庫存"] || row["StockQty"] || 0),
                            minStock: parseInt(row["安全庫存"] || row["MinQty"] || 10),
                            price: parseFloat(row["單價"] || row["UnitPrice"] || 0),
                            category: row["產品類別"] || row["Category"] || "一般"
                        };
                    });

                    renderDashboard(decoupledData);
                }
            });
        }

        // 渲染 DataTables 3.0.1 與 Chart.js 4.5.0
        function renderDashboard(data) {
            let totalItems = data.length;
            let lowStockCount = 0;
            let totalValue = 0;
            let categoryCounts = {};

            let tableRows = [];

            data.forEach(item => {
                let itemTotalVal = item.stock * item.price;
                totalValue += itemTotalVal;

                if (item.stock <= item.minStock) {
                    lowStockCount++;
                }

                categoryCounts[item.category] = (categoryCounts[item.category] || 0) + item.stock;

                let statusBadge = item.stock <= item.minStock 
                    ? '<span class="badge bg-danger"><i class="fa-solid fa-circle-exclamation"></i> 需補貨</span>' 
                    : '<span class="badge bg-success"><i class="fa-solid fa-check"></i> 正常</span>';

                tableRows.push([
                    item.name,
                    item.stock,
                    item.minStock,
                    '$' + item.price.toLocaleString(),
                    statusBadge
                ]);
            });

            $('#statTotalItems').text(totalItems);
            $('#statLowStock').text(lowStockCount);
            $('#statTotalValue').text('$' + totalValue.toLocaleString());

            // DataTables 3.0.1 新版初始化
            $('#inventoryTable').DataTable({
                data: tableRows,
                destroy: true,
                language: {
                    search: "快速搜尋：",
                    lengthMenu: "顯示 _MENU_ 筆記錄",
                    info: "顯示第 _START_ 至 _END_ 筆，共 _TOTAL_ 筆",
                    paginate: { first: "首頁", last: "末頁", next: "下一頁", previous: "上一頁" }
                },
                layout: {
                    topStart: 'search',
                    topEnd: 'pageLength',
                    bottomStart: 'info',
                    bottomEnd: 'paging'
                }
            });

            // Chart.js 4.5.0 圖表初始化
            const ctx = document.getElementById('inventoryChart').getContext('2d');
            new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: Object.keys(categoryCounts),
                    datasets: [{
                        data: Object.values(categoryCounts),
                        backgroundColor: ['#10b981', '#3b82f6', '#f59e0b', '#ef4444', '#8b5cf6']
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { labels: { color: '#e2e8f0' } }
                    }
                }
            });
        }
    </script>
</body>
</html>
