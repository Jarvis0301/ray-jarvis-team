<!DOCTYPE html>
<html lang="zh-TW" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UVACO Design System - SCSS 模組修復驗證</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --uvaco-primary: #10b981;
            --uvaco-primary-hover: #059669;
            --uvaco-primary-rgb: 16, 185, 129;
            --uvaco-secondary: #34d399;
            --uvaco-accent: #facc15;
            --uvaco-muted: #64748b;
            --uvaco-text-dark: #090d16;
            --uvaco-text-light: #f8fafc;
        }

        body {
            background-color: #090d16;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .demo-card {
            background-color: #121824;
            border: 1px solid #1e293b;
            border-radius: 12px;
        }

        /* 模擬修復後編譯出的微妙深色 Subtle 樣式 */
        .alert-emerald-subtle {
            background-color: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #6ee7b7;
        }
    </style>
</head>
<body class="py-5">

    <div class="container">
        <div class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom border-secondary">
            <div>
                <h2 class="fw-bold mb-1 text-emerald">
                    <i class="fa-solid fa-shield-halved me-2"></i> UVACO Design System 診斷報告
                </h2>
                <p class="text-secondary mb-0">SCSS 重構修復驗證與 WCAG 對比度測試面板</p>
            </div>
            <span class="badge bg-success fs-6">
                <i class="fa-solid fa-check me-1"></i> SCSS v5.3 Passed
            </span>
        </div>

        <div class="row g-4">
            <div class="col-12 col-md-6">
                <div class="card demo-card h-100 p-4">
                    <h5 class="fw-bold text-warning mb-3">
                        <i class="fa-solid fa-bug me-2"></i> 1. Badge 邊框語法修復驗證
                    </h5>
                    <p class="text-secondary small">修復前：<code>border: #{$subtle-border};</code> 導致無效 CSS 屬性。</p>
                    <div class="d-flex gap-2 flex-wrap align-items-center pt-2">
                        <span class="badge bg-primary">
                            <i class="fa-solid fa-tag me-1"></i> 原生 Badge
                        </span>
                        <span class="px-3 py-1 rounded-pill small" style="background-color: rgba(56, 189, 248, 0.15); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.4);">
                            <i class="fa-solid fa-circle-check me-1"></i> 修復後帶 1px 邊框
                        </span>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6">
                <div class="card demo-card h-100 p-4">
                    <h5 class="fw-bold text-info mb-3">
                        <i class="fa-solid fa-moon me-2"></i> 2. 深色主題 Subtle Alert 驗證
                    </h5>
                    <p class="text-secondary small">修復前：與 85% 白色混合，在暗黑背景下產生刺眼白閃。</p>
                    <div class="alert alert-emerald-subtle mb-0" role="alert">
                        <i class="fa-solid fa-triangle-exclamation me-2"></i> 成功融入深色背景（#090D16），不再發白刺眼！
                    </div>
                </div>
            </div>

            <div class="col-12">
                <div class="card demo-card p-4">
                    <h5 class="fw-bold text-success mb-3">
                        <i class="fa-solid fa-universal-access me-2"></i> 3. WCAG 感知亮度文字顏色自動比對
                    </h5>
                    <div class="row g-3">
                        <div class="col-6 col-sm-3">
                            <button class="btn w-100 fw-bold" style="background-color: #facc15; color: #090d16;">
                                <i class="fa-solid fa-sun me-1"></i> 黃色 (自動黑字)
                            </button>
                        </div>
                        <div class="col-6 col-sm-3">
                            <button class="btn w-100 fw-bold" style="background-color: #38bdf8; color: #090d16;">
                                <i class="fa-solid fa-bolt me-1"></i> 淺藍 (自動黑字)
                            </button>
                        </div>
                        <div class="col-6 col-sm-3">
                            <button class="btn w-100 fw-bold text-white" style="background-color: #818cf8;">
                                <i class="fa-solid fa-indigo me-1"></i> 靛紫 (自動白字)
                            </button>
                        </div>
                        <div class="col-6 col-sm-3">
                            <button class="btn w-100 fw-bold text-white" style="background-color: #10b981;">
                                <i class="fa-solid fa-leaf me-1"></i> 翡翠綠 (自動白字)
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
