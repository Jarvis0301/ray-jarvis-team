<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跨國市場產品戰情室 - 榮祥團隊</title>

    <script src="../assets/js/vendor-loader.js"></script>

    <style>
        :root {
            --bg-dark: #061410;
            --card-dark: #0d221a;
            --border-green: #1b4233;
            --accent-emerald: #10b981;
            --text-light: #f1f5f9;
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Noto Sans TC', sans-serif;
            padding: 1.5rem 0;
        }

        .bg-card-custom {
            background-color: var(--card-dark);
            border: 1px solid var(--border-green);
            border-radius: 12px;
        }

        .text-emerald {
            color: var(--accent-emerald);
        }

        /* 國旗膠囊標籤樣式 */
        .flag-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-green);
            font-size: 0.875rem;
        }

        /* Select2 暗黑主題覆蓋 */
        .select2-container--default .select2-selection--single {
            background-color: var(--bg-dark) !important;
            border-color: var(--border-green) !important;
            height: 38px !important;
            border-radius: 6px !important;
        }

        .select2-container--default .select2-selection--single .select2-selection__rendered {
            color: var(--text-light) !important;
            line-height: 36px !important;
        }

        .select2-dropdown {
            background-color: var(--card-dark) !important;
            border-color: var(--border-green) !important;
            color: var(--text-light) !important;
        }

        .select2-container--default .select2-results__option--highlighted[aria-selected] {
            background-color: var(--accent-emerald) !important;
        }

        /* DataTable 3.0.1 暗黑模式適用 */
        .dt-container .dt-search input {
            background-color: var(--bg-dark);
            border: 1px solid var(--border-green);
            color: var(--text-light);
            border-radius: 6px;
            padding: 0.3rem 0.6rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="p-4 bg-card-custom shadow-lg mb-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <h1 class="h4 mb-1 text-white">
                    <i class="fas fa-globe text-emerald"></i> UVACO 葡眾全球產品戰情室
                </h1>
                <p class="text-muted mb-0">已成功套用 flag-icons (v7.2.3) 與 14 大前端最新套件</p>
            </div>
            <div class="d-flex gap-2 flex-wrap">
                <span class="flag-badge">
                    <span class="fi fi-tw"></span> 台灣總部
                </span>
                <span class="flag-badge">
                    <span class="fi fi-my"></span> 馬來西亞營運中心
                </span>
            </div>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-12 col-md-6">
                <div class="p-4 bg-card-custom shadow-lg h-100">
                    <label class="form-label text-white fw-bold mb-2">
                        <i class="fas fa-magnifying-glass text-emerald"></i> 快速搜尋市場產品 (Select2)：
                    </label>
                    <select id="productSelect" class="form-select w-100">
                        <option value="">請選擇或輸入產品...</option>
                    </select>
                </div>
            </div>

            <div class="col-12 col-md-6">
                <div class="p-4 bg-card-custom shadow-lg h-100">
                    <h2 class="h6 text-white mb-3">
                        <i class="fas fa-chart-pie text-emerald"></i> 跨國市場 SV 銷售比率
                    </h2>
                    <div style="position: relative; height: 180px;">
                        <canvas id="marketChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="p-4 bg-card-custom shadow-lg">
            <h2 class="h6 text-white mb-3">
                <i class="fas fa-list-check text-emerald"></i> 全球產品規格清單
            </h2>
            <div class="table-responsive">
                <table id="productTable" class="table table-dark table-hover w-100">
                    <thead>
                        <tr>
                            <th>適用地區</th>
                            <th>產品名稱</th>
                            <th>全球 SV</th>
                            <th>當地建議售價</th>
                        </tr>
                    </thead>
                    <tbody>
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 監聽 'vendor-ready'，確保 14 大套件完整載入後才初始化
        window.addEventListener('vendor-ready', function() {
            console.log('14 大套件 (含 flag-icons) 載入完畢！開始渲染 UI...');

            initSelect2();
            initChart();
            fetchSheetData();
        });

        // 1. 初始化 Select2
        function initSelect2() {
            $('#productSelect').select2({
                placeholder: '請選擇產品...'
            });
        }

        // 2. 初始化 Chart.js
        let chartInstance;
        function initChart() {
            const ctx = document.getElementById('marketChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['台灣市場', '馬來西亞市場'],
                    datasets: [{
                        data: [82, 18],
                        backgroundColor: ['#10b981', '#0284c7'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { color: '#f1f5f9' }
                        }
                    }
                }
            });
        }

        // 3. PapaParse 數據抓取與欄位解耦合
        function fetchSheetData() {
            const rawCsv = `REGION_CODE,PROD_TITLE,POINTS_SV,LOCAL_PRICE,CURRENCY
tw,995生技營養品,164,5980,NT$
tw,康爾喜(N),52,1960,NT$
my,995 Bio-Tech Drink,164,880,MYR
my,Probiotics Cleansing Soap,24,120,MYR`;

            Papa.parse(rawCsv, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    // 解耦合：將原始試算表轉換為標準 key 物件
                    const cleanData = results.data.map(row => ({
                        region: row['REGION_CODE'] || 'tw',
                        title: row['PROD_TITLE'] || '未命名',
                        sv: row['POINTS_SV'] || 0,
                        price: row['LOCAL_PRICE'] || 0,
                        currency: row['CURRENCY'] || '$'
                    }));

                    updateSelect2Options(cleanData);
                    renderDataTable(cleanData);

                    if (typeof Toastify !== 'undefined') {
                        Toastify({
                            text: " 成功動態載入並解析跨國產品數據！",
                            duration: 3000,
                            style: { background: "linear-gradient(to right, #059669, #10b981)" }
                        }).showToast();
                    }
                }
            });
        }

        function updateSelect2Options(data) {
            const $select = $('#productSelect').empty().append('<option value="">請選擇產品...</option>');
            data.forEach(item => {
                $select.append(new Option(`[${item.region.toUpperCase()}] ${item.title}`, item.title));
            });
        }

        // 4. 使用 DataTable 3.0.1 渲染 (結合 flag-icons 國旗)
        function renderDataTable(data) {
            if ($.fn.DataTable.isDataTable('#productTable')) {
                $('#productTable').DataTable().destroy();
            }

            const $tbody = $('#productTable tbody').empty();
            data.forEach(item => {
                const tr = `
                    <tr>
                        <td>
                            <span class="fi fi-${item.region}"></span>
                            <span class="ms-1 fw-bold text-uppercase">${item.region}</span>
                        </td>
                        <td><i class="fas fa-box text-emerald"></i> ${item.title}</td>
                        <td><span class="badge bg-success">${item.sv} SV</span></td>
                        <td>${item.currency} ${Number(item.price).toLocaleString()}</td>
                    </tr>
                `;
                $tbody.append(tr);
            });

            $('#productTable').DataTable({
                responsive: true,
                pageLength: 5,
                layout: {
                    topStart: 'pageLength',
                    topEnd: 'search',
                    bottomStart: 'info',
                    bottomEnd: 'paging'
                },
                language: {
                    search: "<i class=\"fas fa-magnifying-glass\"></i> 搜尋：",
                    paginate: { previous: "上一頁", next: "下一頁" },
                    info: "顯示第 _START_ 至 _END_ 筆，共 _TOTAL_ 筆"
                }
            });
        }
    </script>
</body>
</html>
