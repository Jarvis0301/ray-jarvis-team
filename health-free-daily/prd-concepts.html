<!DOCTYPE html>
<html lang="zh-TW" data-bs-theme="dark-green">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>保健觀念</title>

        <script src="../assets/js/auth-guard.js"></script>
        
        <script src="../assets/js/vendor-loader.js"></script>

        <script src="../assets/js/common.js"></script>

        <link rel="stylesheet" href="../assets/css/common.css">

        <script src="./js/prd-concepts.js" defer></script>

        <link rel="stylesheet" href="./css/prd-concepts.css">
    </head>

    <body>

        <main class="container-fluid p-3 p-md-4">
            
            <div class="row align-items-center mb-4">
                <div class="col-md-7">
                    <h1 class="fw-bold mb-2 text-white">
                        <i class="fa-solid fa-heart-pulse text-success"></i> 保健觀念講堂
                    </h1>
                    <p class="text-muted mb-0">
                        彙整榮祥團隊專業養生知識、預防醫學思維與日常保健實用指南，為您的健康保駕護航。
                    </p>
                </div>
                <div class="col-md-5 text-md-end mt-3 mt-md-0">
                    <div class="btn-group" role="group">
                        <button id="btnViewGrid" class="btn btn-outline-primary active">
                            <i class="fa-solid fa-border-all"></i> 卡片牆模式
                        </button>
                        <button id="btnViewTable" class="btn btn-outline-primary">
                            <i class="fa-solid fa-table-cells"></i> 表格模式
                        </button>
                    </div>
                </div>
            </div>

            <div class="row mb-4 g-3">
                <div class="col-lg-8">
                    <div class="p-3 rounded-3" style="background-color: var(--uvaco-bg-card-primary); border: 1px solid var(--uvaco-border-color);">
                        <div class="row g-2 align-items-center">
                            <div class="col-md-6">
                                <div class="input-group">
                                    <span class="input-group-text bg-transparent text-success border-secondary">
                                        <i class="fa-solid fa-magnifying-glass"></i>
                                    </span>
                                    <input type="text" id="searchInput" class="form-control bg-dark text-light border-secondary" placeholder="搜尋保健主題、關鍵字...">
                                </div>
                            </div>
                            <div class="col-md-6 d-flex align-items-center overflow-auto" id="categoryFilterContainer">
                                <button class="btn btn-sm btn-primary me-2 text-nowrap category-btn active" data-category="ALL">
                                    <i class="fa-solid fa-layer-group"></i> 全部主題
                                </button>
                                </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4">
                    <button class="btn btn-outline-primary w-100 h-100 d-flex align-items-center justify-content-center py-2" type="button" data-bs-toggle="collapse" data-bs-target="#chartCollapse">
                        <i class="fa-solid fa-chart-pie"></i> 檢視保健主題分類統計圖表
                    </button>
                </div>
            </div>

            <div class="collapse mb-4" id="chartCollapse">
                <div class="p-4 rounded-3" style="background-color: var(--uvaco-bg-card-primary); border: 1px solid var(--uvaco-border-color);">
                    <h5 class="text-white mb-3 fw-bold">
                        <i class="fa-solid fa-chart-column text-success"></i> 保健觀念主題分佈統計
                    </h5>
                    <div class="row align-items-center">
                        <div class="col-md-6" style="max-height: 250px; position: relative;">
                            <canvas id="conceptChart"></canvas>
                        </div>
                        <div class="col-md-6 mt-3 mt-md-0">
                            <ul class="list-group list-group-flush bg-transparent" id="chartLegendList">
                                </ul>
                        </div>
                    </div>
                </div>
            </div>

            <div id="gridContainer" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
                </div>

            <div id="tableContainer" class="p-4 rounded-3 d-none" style="background-color: var(--uvaco-bg-card-primary); border: 1px solid var(--uvaco-border-color);">
                <div class="table-responsive">
                    <table id="conceptDataTable" class="table table-dark table-hover w-100">
                        <thead>
                            <tr>
                                <th style="width: 15%;">分類</th>
                                <th style="width: 30%;">觀念標題</th>
                                <th style="width: 35%;">文案大綱</th>
                                <th style="width: 10%;">發布日期</th>
                                <th style="width: 10%;">操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            </tbody>
                    </table>
                </div>
            </div>

        </main>

        <div class="modal fade" id="conceptDetailModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
                <div class="modal-content modal-content-dark">
                    <div class="modal-header modal-header-dark">
                        <div>
                            <span id="modalCategoryBadge" class="badge bg-success-subtle text-success border border-success-subtle mb-1">
                                <i class="fa-solid fa-tag"></i> 分類
                            </span>
                            <h4 class="modal-title fw-bold text-white mb-0" id="modalTitle">文章標題</h4>
                        </div>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4">
                        <div id="modalPosterContainer">
                            <img id="modalPosterImg" src="" alt="海報" class="modal-poster-hero d-none">
                        </div>
                        <div class="d-flex align-items-center text-muted small mb-4 pb-2 border-bottom border-secondary">
                            <span class="me-3">
                                <i class="fa-solid fa-user-pen"></i> <span id="modalAuthor">榮祥團隊健康顧問</span>
                            </span>
                            <span class="me-3">
                                <i class="fa-solid fa-calendar-day"></i> <span id="modalDate">2026-01-01</span>
                            </span>
                            <span>
                                <i class="fa-solid fa-clock"></i> <span id="modalReadTime">3 分鐘閱讀</span>
                            </span>
                        </div>
                        <div id="modalContent" class="lh-lg text-light">
                            </div>
                    </div>
                    <div class="modal-footer modal-footer-dark">
                        <button type="button" class="btn btn-outline-secondary text-light" data-bs-dismiss="modal">
                            <i class="fa-solid fa-xmark"></i> 關閉窗口
                        </button>
                        <button type="button" id="btnShareUrl" class="btn btn-primary">
                            <i class="fa-solid fa-share-nodes"></i> 分享此文章
                        </button>
                    </div>
                </div>
            </div>
        </div>
        
    </body>
</html>
