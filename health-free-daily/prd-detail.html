<!DOCTYPE html>
<html lang="zh-TW" data-bs-theme="dark-green">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>產品詳細資訊 - 榮祥葡眾團隊</title>

        <!-- 認證守衛 -->
        <script src="../assets/js/auth-guard.js"></script>
        
        <!-- 第三方函式庫加載器 -->
        <script src="../assets/js/vendor-loader.js"></script>

        <!-- 團隊共用核心模組與樣式 -->
        <script src="../assets/js/common.js"></script>
        <link rel="stylesheet" href="../assets/css/common.css">

        <!-- 模組專屬腳本與樣式 -->
        <script src="./js/prd-detail.js" defer></script>
        <link rel="stylesheet" href="./css/prd-detail.css">
    </head>

    <body>
        <main class="container py-4">
            <div id="productContainer" class="d-none">

                <div class="mb-3 d-flex justify-content-start align-items-center">
                    <button onclick="closeOrReturn()" class="btn btn-outline-secondary btn-sm rounded-pill fw-bold">
                        <i class="fa-solid fa-arrow-left"></i> 返回產品列表
                    </button>
                </div>

                <!-- 產品大卡片 -->
                <section class="content-card p-4 mb-4">
                    <div class="row g-4 align-items-center">
                        <div class="col-lg-5 text-center">
                            <div class="product-img-box position-relative bg-dark rounded-3" id="productImgWrapper">
                                <img id="productImg" src="" class="img-fluid rounded shadow product-detail-img" alt="" loading="lazy">
                            </div>
                        </div>

                        <div class="col-lg-7">
                            <div class="product-header-info">
                                <div id="productTypeBadge" class="mb-2 d-flex flex-wrap gap-1 align-items-center"></div>

                                <h1 class="h3 fw-bold text-light mb-2">
                                    <span id="productTitle"></span>
                                    <small id="productShortName" class="text-muted fs-6 ms-2"></small>
                                </h1>

                                <div id="phraseTagsContainer" class="mb-3 d-flex flex-wrap gap-1 align-items-center d-none"></div>

                                <div class="specs-list mb-4"></div>

                                <div class="d-flex flex-wrap gap-2">
                                    <a id="officialBtn" href="#" target="_blank" class="btn btn-outline-primary fw-bold px-4 rounded-pill">
                                        <i class="fa-solid fa-globe"></i> 前往官方網站
                                    </a>
                                    <a id="consultBtn" href="https://line.me" target="_blank" class="btn btn-primary fw-bold px-4 rounded-pill">
                                        <i class="fa-solid fa-comments"></i> 專人諮詢
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- 規格詳情摺疊區塊 -->
                <section class="col-12 mb-4">
                    <div class="content-card p-0 mb-3 overflow-hidden">
                        <div class="p-3 bg-dark border-bottom border-secondary-subtle d-flex justify-content-between align-items-center" role="button" data-bs-toggle="collapse" data-bs-target="#collapseDescription" aria-expanded="true" aria-controls="collapseDescription">
                            <h5 class="fw-bold text-light mb-0">
                                <i class="fa-solid fa-align-left text-primary"></i> 產品介紹
                            </h5>
                            <i class="fa-solid fa-chevron-down text-muted"></i>
                        </div>
                        <div id="collapseDescription" class="collapse show">
                            <div class="p-4 text-light-subtle lh-lg" id="detailedDescription"></div>
                        </div>
                    </div>

                    <div class="content-card p-0 mb-3 overflow-hidden">
                        <div class="p-3 bg-dark border-bottom border-secondary-subtle d-flex justify-content-between align-items-center" role="button" data-bs-toggle="collapse" data-bs-target="#collapseFeatures" aria-expanded="true" aria-controls="collapseFeatures">
                            <h5 class="fw-bold text-light mb-0">
                                <i class="fa-solid fa-list-check text-success"></i> 特色與主要功能
                            </h5>
                            <i class="fa-solid fa-chevron-down text-muted"></i>
                        </div>
                        <div id="collapseFeatures" class="collapse show">
                            <div class="p-4 text-light-subtle lh-lg" id="featuresFunctions"></div>
                        </div>
                    </div>

                    <div class="content-card p-0 mb-3 overflow-hidden">
                        <div class="p-3 bg-dark border-bottom border-secondary-subtle d-flex justify-content-between align-items-center" role="button" data-bs-toggle="collapse" data-bs-target="#collapseIngredients" aria-expanded="true" aria-controls="collapseIngredients">
                            <h5 class="fw-bold text-light mb-0">
                                <i class="fa-solid fa-flask text-warning"></i> 主要成分
                            </h5>
                            <i class="fa-solid fa-chevron-down text-muted"></i>
                        </div>
                        <div id="collapseIngredients" class="collapse show">
                            <div class="p-4 text-light-subtle lh-lg" id="ingredients"></div>
                        </div>
                    </div>

                    <div class="content-card p-0 mb-3 overflow-hidden">
                        <div class="p-3 bg-dark border-bottom border-secondary-subtle d-flex justify-content-between align-items-center" role="button" data-bs-toggle="collapse" data-bs-target="#collapseUsage" aria-expanded="true" aria-controls="collapseUsage">
                            <h5 class="fw-bold text-light mb-0">
                                <i class="fa-solid fa-heart text-danger"></i> 使用情境
                            </h5>
                            <i class="fa-solid fa-chevron-down text-muted"></i>
                        </div>
                        <div id="collapseUsage" class="collapse show">
                            <div class="p-4 text-light-subtle lh-lg" id="usageScenarios"></div>
                        </div>
                    </div>
                </section>

                <!-- 文案與 FAQ 區塊 -->
                <section class="col-12 mb-4">
                    <div id="copywritingContainer" class="content-card p-0 mb-3 overflow-hidden d-none">
                        <div class="p-3 bg-dark border-bottom border-secondary-subtle d-flex justify-content-between align-items-center collapsed" role="button" data-bs-toggle="collapse" data-bs-target="#collapseCopywriting" aria-expanded="false" aria-controls="collapseCopywriting">
                            <h5 class="fw-bold text-light mb-0">
                                <i class="fa-solid fa-bullhorn text-warning"></i> 社群推廣與行銷文案
                            </h5>
                            <i class="fa-solid fa-chevron-down text-muted"></i>
                        </div>
                        <div id="collapseCopywriting" class="collapse">
                            <div class="p-4">
                                <ul class="nav nav-pills mb-3" id="copywritingTabs" role="tablist"></ul>
                                <div class="tab-content" id="copywritingTabContent"></div>
                            </div>
                        </div>
                    </div>

                    <div id="faqContainer" class="content-card p-0 mb-3 overflow-hidden d-none">
                        <div class="p-3 bg-dark border-bottom border-secondary-subtle d-flex justify-content-between align-items-center collapsed" role="button" data-bs-toggle="collapse" data-bs-target="#collapseFAQ" aria-expanded="false" aria-controls="collapseFAQ">
                            <h5 class="fw-bold text-light mb-0">
                                <i class="fa-solid fa-circle-question text-info"></i> 常見問題 (FAQ)
                            </h5>
                            <i class="fa-solid fa-chevron-down text-muted"></i>
                        </div>
                        <div id="collapseFAQ" class="collapse">
                            <div class="p-4">
                                <div class="accordion accordion-custom" id="faqAccordion"></div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- 底部諮詢卡片 -->
                <section class="content-card p-4 text-center rounded-3">
                    <h5 class="fw-bold mb-2 text-success">
                        <i class="fa-solid fa-seedling me-1"></i> 想了解更多產品搭配與專屬建議？
                    </h5>
                    <p class="small text-muted mb-3">歡迎聯繫我們的專業顧問團隊，為您提供一對一健康營養諮詢。</p>
                    <div class="d-flex justify-content-center gap-2">
                        <button onclick="closeOrReturn()" class="btn btn-outline-secondary fw-bold px-4 rounded-pill">
                            <i class="fa-solid fa-arrow-left"></i> 返回產品列表
                        </button>
                        <a id="consultBtnBottom" href="https://line.me" target="_blank" class="btn btn-primary fw-bold px-4 rounded-pill">
                            <i class="fa-solid fa-comments"></i> 立即預約一對一諮詢
                        </a>
                    </div>
                </section>
            </div>
        </main>
    </body>
</html>
