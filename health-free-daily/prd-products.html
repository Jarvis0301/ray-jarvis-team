<!DOCTYPE html>
<html lang="zh-TW" data-bs-theme="dark-green">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>產品介紹</title>
        
        <script src="../assets/js/auth-guard.js"></script>
        
        <script src="../assets/js/vendor-loader.js"></script>

        <script src="../assets/js/common.js"></script>

        <link rel="stylesheet" href="../assets/css/common.css">

        <script src="./js/products.js" defer></script>

        <link rel="stylesheet" href="./css/products.css">
    </head>
    
    <body>
        <div class="container py-4">
            <section class="filter-section">
                <div class="row g-3 mb-4">
                    <div class="col-12 col-sm-6 col-lg-3">
                        <div class="form-group">
                            <label for="countrySelect"><i class="fa-solid fa-globe"></i> 選擇地區</label>
                            <select id="countrySelect" class="form-control">
                                <option value="TW">台灣</option>
                                <option value="MY">馬來西亞</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-12 col-sm-6 col-lg-3">
                        <div class="form-group">
                            <label for="mainSeriesSelect"><i class="fa-solid fa-layer-group"></i> 產品主系列</label>
                            <select id="mainSeriesSelect" class="form-control">
                                <option value="ALL">全部主系列</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-12 col-sm-6 col-lg-3">
                        <div class="form-group">
                            <label for="subSeriesSelect"><i class="fa-solid fa-sitemap"></i> 產品次系列</label>
                            <select id="subSeriesSelect" class="form-control" disabled>
                                <option value="ALL">請先選擇主系列</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-12 col-sm-6 col-lg-3">
                        <div class="form-group">
                            <label for="searchInput"><i class="fa-solid fa-search"></i> 關鍵字搜尋</label>
                            <input type="text" id="searchInput" class="form-control" placeholder="輸入名稱、成分或編號...">
                        </div>
                    </div>
                </div>

                <div class="type-filter-title"><i class="fa-solid fa-filter"></i> 產品型態</div>
                <div class="d-flex flex-wrap gap-2" id="typeFilterContainer"></div>
            </section>

            <div class="info-bar d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-4 p-3">
                <div class="results-count" id="resultsCount">
                    <i class="fa-solid fa-list-check"></i> 正在初始化產品資料...
                </div>
                <div class="sync-status" id="syncStatus">
                    <i class="fa-solid fa-cloud-arrow-down"></i> 產品資訊同步中...
                </div>
            </div>

            <main class="row g-4" id="productGrid"></main>
        </div>
    </body>
</html>
