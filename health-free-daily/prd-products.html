<!DOCTYPE html>
<html lang="zh-TW" data-bs-theme="dark-green">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>產品介紹 - 榮祥葡眾團隊</title>
        
        <!-- 認證守衛 -->
        <script src="../assets/js/auth-guard.js"></script>
        
        <!-- 第三方函式庫加載器 -->
        <script src="../assets/js/vendor-loader.js"></script>

        <!-- 團隊共用核心模組與樣式 -->
        <script src="../assets/js/common.js"></script>
        <link rel="stylesheet" href="../assets/css/common.css">

        <!-- 模組專屬腳本與樣式 -->
        <script src="./js/prd-products.js" defer></script>
        <link rel="stylesheet" href="./css/prd-products.css">
    </head>
    
    <body>
        <main class="container-fluid p-3 p-md-4">
            <!-- 多層次篩選面板 -->
            <section class="filter-section">
                <div class="row g-3 mb-4">
                    <div class="col-12 col-sm-6 col-lg-3">
                        <div class="form-group">
                            <label for="countrySelect" class="form-label"><i class="fa-solid fa-globe"></i> 選擇地區</label>
                            <select id="countrySelect" class="form-select form-select-sm">
                                <option value="TW">台灣 (TW)</option>
                                <option value="MY">馬來西亞 (MY)</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-12 col-sm-6 col-lg-3">
                        <div class="form-group">
                            <label for="mainSeriesSelect" class="form-label"><i class="fa-solid fa-layer-group"></i> 產品主系列</label>
                            <select id="mainSeriesSelect" class="form-select form-select-sm">
                                <option value="ALL">全部主系列</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-12 col-sm-6 col-lg-3">
                        <div class="form-group">
                            <label for="subSeriesSelect" class="form-label"><i class="fa-solid fa-sitemap"></i> 產品次系列</label>
                            <select id="subSeriesSelect" class="form-select form-select-sm" disabled>
                                <option value="ALL">請先選擇主系列</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-12 col-sm-6 col-lg-3">
                        <div class="form-group">
                            <label for="searchInput" class="form-label"><i class="fa-solid fa-search"></i> 關鍵字搜尋</label>
                            <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="輸入名稱、成分或編號...">
                        </div>
                    </div>
                </div>

                <div class="type-filter-title"><i class="fa-solid fa-filter"></i> 產品型態快速篩選</div>
                <div class="d-flex flex-wrap gap-2" id="typeFilterContainer"></div>
            </section>

            <!-- 狀態資訊列 -->
            <section class="info-bar d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-4 p-3">
                <div class="results-count" id="resultsCount">
                    <i class="fa-solid fa-list-check"></i> 正在初始化產品資料...
                </div>
                <div class="text-secondary small">
                    <i class="fa-solid fa-leaf text-success"></i> 葡眾草本生技天然專屬配方
                </div>
            </section>

            <!-- 產品展示網格 -->
            <section class="row g-4" id="productGrid"></section>
        </main>
    </body>
</html>
