    <style>
        :root {
            --uvaco-bg: #051811;
            --uvaco-surface: rgba(11, 37, 27, 0.85);
            --uvaco-surface-hover: rgba(19, 56, 41, 0.95);
            --uvaco-card-inner: rgba(6, 25, 18, 0.9);
            --uvaco-primary: #10b981;
            --uvaco-primary-glow: rgba(16, 185, 129, 0.35);
            --uvaco-secondary: #34d399;
            --uvaco-accent: #f59e0b;
            --uvaco-accent-glow: rgba(245, 158, 11, 0.4);
            --uvaco-text-main: #f0fdf4;
            --uvaco-text-muted: #a7f3d0;
            --uvaco-border: rgba(16, 185, 129, 0.22);
            --uvaco-border-active: rgba(52, 211, 153, 0.6);
        }

        body {
            background-color: var(--uvaco-bg);
            color: var(--uvaco-text-main);
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 15%, rgba(16, 185, 129, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 85%, rgba(52, 211, 153, 0.06) 0%, transparent 45%);
            background-attachment: fixed;
        }

        /* 標題與字體 */
        .font-serif-brand {
            font-family: 'Noto Serif TC', serif;
        }

        /* 玻璃擬態與沉降卡片 */
        .bundle-glass-panel {
            background: var(--uvaco-surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--uvaco-border);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .bundle-glass-panel:hover {
            border-color: var(--uvaco-border-active);
            box-shadow: 0 14px 40px var(--uvaco-primary-glow);
        }

        /* 情境標籤膠囊微光列 (HUD Pills) */
        .scenario-nav-wrapper {
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE 10+ */
            padding-bottom: 4px;
        }
        .scenario-nav-wrapper::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }
        .scenario-btn {
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid var(--uvaco-border);
            color: var(--uvaco-text-muted);
            border-radius: 50rem;
            padding: 0.55rem 1.25rem;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.25s ease;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
        }
        .scenario-btn:hover {
            color: #ffffff;
            border-color: var(--uvaco-secondary);
            background: rgba(16, 185, 129, 0.2);
            transform: translateY(-1px);
        }
        .scenario-btn.active {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-color: #34d399;
            color: #ffffff;
            box-shadow: 0 4px 15px var(--uvaco-primary-glow);
        }

        /* 調理主卡 Pod 佈局 */
        .pod-hero-badge {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.2) 0%, rgba(245, 158, 11, 0.05) 100%);
            border: 1px solid var(--uvaco-accent);
            color: #fde68a;
            border-radius: 8px;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            padding: 0.25rem 0.6rem;
            display: inline-block;
        }

        /* 晝夜時鐘食用光軸 (Routine Timeline) */
        .timeline-container {
            position: relative;
            padding-left: 28px;
        }
        .timeline-container::before {
            content: '';
            position: absolute;
            left: 9px;
            top: 10px;
            bottom: 10px;
            width: 2px;
            background: linear-gradient(to bottom, #10b981 0%, #34d399 50%, #f59e0b 100%);
            opacity: 0.4;
        }
        .timeline-node {
            position: relative;
            margin-bottom: 1.25rem;
        }
        .timeline-node:last-child {
            margin-bottom: 0;
        }
        .timeline-dot {
            position: absolute;
            left: -28px;
            top: 2px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #051811;
            border: 2px solid var(--uvaco-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            color: var(--uvaco-secondary);
            box-shadow: 0 0 8px var(--uvaco-primary-glow);
        }

        /* 單品微型卡片 (Bundle Item Tile) */
        .bundle-item-tile {
            background: var(--uvaco-card-inner);
            border: 1px solid rgba(16, 185, 129, 0.15);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            transition: all 0.2s ease;
        }
        .bundle-item-tile:hover {
            border-color: rgba(52, 211, 153, 0.4);
            background: rgba(16, 185, 129, 0.08);
        }

        /* 每日銅板價大字標示 */
        .daily-price-box {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.12) 0%, rgba(16, 185, 129, 0.08) 100%);
            border: 1px dashed rgba(245, 158, 11, 0.5);
            border-radius: 14px;
            padding: 0.85rem 1.2rem;
        }

        /* 互動按鈕設計 */
        .btn-uvaco-accent {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #ffffff;
            border: none;
            font-weight: 600;
            border-radius: 12px;
            padding: 0.65rem 1.4rem;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px var(--uvaco-accent-glow);
        }
        .btn-uvaco-accent:hover {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.6);
        }

        .btn-uvaco-outline {
            background: transparent;
            color: var(--uvaco-text-muted);
            border: 1px solid var(--uvaco-border);
            border-radius: 12px;
            padding: 0.65rem 1.2rem;
            font-weight: 500;
            transition: all 0.25s ease;
        }
        .btn-uvaco-outline:hover {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--uvaco-secondary);
            color: #ffffff;
        }

        /* 懸浮快速功能選單 (FAB Quick Bar) */
        .quick-consult-bar {
            position: sticky;
            bottom: 1.5rem;
            z-index: 100;
            margin-top: 2rem;
        }
        .quick-bar-inner {
            background: rgba(5, 24, 17, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--uvaco-secondary);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px var(--uvaco-primary-glow);
            border-radius: 50rem;
            padding: 0.6rem 1.25rem;
        }

        /* 手機 RWD 細部微調 */
        @media (max-width: 768px) {
            .bundle-glass-panel {
                border-radius: 16px;
                padding: 1.25rem !important;
            }
            .daily-price-box {
                text-align: center;
                margin-top: 1rem;
            }
        }
    </style>
</head>

                tag: "餐前阻斷 x 餐後代謝 雙管齊下",
                target_audience: "甜食澱粉愛好者、運動停滯期、久坐代謝減緩、欲維持優美體態者",
                mechanism: "富含優質大豆蛋白與膳食纖維提供飽足感，配合山苦瓜與茶多酚精華，促進能量正常消耗運轉。",
                price_member: 4680,
                price_retail: 5500,
                sv: 3800,
                days_supply: 30,
                routine_morning: "葡眾餐包 1 包（以溫水搖勻取代高熱量早餐）",
                routine_noon: "清味香/消渴複方 2 粒（大餐前 15 分鐘）",
                routine_night: "康爾寧 1 包（晚餐後促進夜間蠕動）",
                items: [
                    { name: "葡眾原味餐包", spec: "30包/盒", qty: 1, icon: "fa-solid fa-bowl-food" },
                    { name: "清味香複合膠囊", spec: "100粒/瓶", qty: 1, icon: "fa-solid fa-leaf" },
                    { name: "康爾喜益生菌", spec: "90包/盒", qty: 1, icon: "fa-solid fa-cubes-stacked" }
                ],
                radar_scores: [92, 70, 96, 85, 65]
            },
            {
                id: "BD-05",
                name: "樂齡關鍵靈活與步履穩健組",
                category: "SENIOR",
                tag: "行動力滿分 陪爸媽健步如飛",
                target_audience: "上下樓梯吃力、喜愛登山健行、步履沉重、熟齡關鍵環節保養",
                mechanism: "高純度非變性二型膠原蛋白結合軟骨素與草本複方，補充關鍵滑囊潤滑營養，維持靈活敏捷度。",
                price_member: 6200,
                price_retail: 7300,
                sv: 5100,
                days_supply: 30,
                routine_morning: "貝納 Q10 / 固立健 2 粒（早餐後搭配溫水）",
                routine_noon: "995 超級營養液 半瓶",
                routine_night: "貝納 2 粒（睡前補充，滋養關鍵環節）",
                items: [
                    { name: "固立健膠囊", spec: "120粒/瓶", qty: 1, icon: "fa-solid fa-person-walking" },
                    { name: "995 生化營養液", spec: "180ml x 24瓶/箱", qty: 1, icon: "fa-solid fa-bottle-droplet" }
                ],
                radar_scores: [70, 85, 80, 88, 95]
            }
        ];

        let currentCategory = 'ALL';
        let rawBundleData = [];

        // 3. 解耦核心適配器函式
        function parseGoogleSheetData(rows) {
            if (!rows || rows.length === 0) return FALLBACK_BUNDLES;

            return rows.map((row, index) => {
                const getVal = (fields) => {
                    for (let f of fields) {
                        if (row[f] !== undefined && row[f] !== null && row[f] !== '') return row[f];
                    }
                    return null;
                };

                let itemsParsed = [];
                const rawItems = getVal(BUNDLE_FIELD_MAP.items_json);
                if (rawItems) {
                    try {
                        itemsParsed = typeof rawItems === 'string' ? JSON.parse(rawItems) : rawItems;
                    } catch (e) {
                        itemsParsed = [{ name: rawItems, spec: "標準規格", qty: 1, icon: "fa-solid fa-box" }];
                    }
                } else {
                    itemsParsed = [{ name: "葡眾精選保健單品", spec: "30天份", qty: 1, icon: "fa-solid fa-box" }];
                }

                return {
                    id: getVal(BUNDLE_FIELD_MAP.id) || `BD-0${index+1}`,
                    name: getVal(BUNDLE_FIELD_MAP.name) || "葡眾經典生活調理套組",
                    category: getVal(BUNDLE_FIELD_MAP.category) || "GUT",
                    tag: getVal(BUNDLE_FIELD_MAP.tag) || "全方位機能保養推薦",
                    target_audience: getVal(BUNDLE_FIELD_MAP.target_audience) || "注重日常健康與體質調理之大眾",
                    mechanism: getVal(BUNDLE_FIELD_MAP.mechanism) || "融合漢方草本與現代生物發酵技術，提供高吸收率之平衡營養。",
                    price_member: Number(getVal(BUNDLE_FIELD_MAP.price_member)) || 3600,
                    price_retail: Number(getVal(BUNDLE_FIELD_MAP.price_retail)) || 4200,
                    sv: Number(getVal(BUNDLE_FIELD_MAP.sv)) || 2800,
                    days_supply: Number(getVal(BUNDLE_FIELD_MAP.days_supply)) || 30,
                    routine_morning: getVal(BUNDLE_FIELD_MAP.routine_morning) || "早起空腹 1 包搭配溫開水",
                    routine_noon: getVal(BUNDLE_FIELD_MAP.routine_noon) || "午餐前 30 分鐘食用",
                    routine_night: getVal(BUNDLE_FIELD_MAP.routine_night) || "睡前放鬆補充 1 包",
                    items: itemsParsed,
                    radar_scores: [85, 80, 88, 75, 82]
                };
            });
        }

        // 4. 動態渲染 HTML 卡片
        function renderBundles(dataList) {
            const $container = $('#bundleListContainer');
            $container.empty();

            const filtered = currentCategory === 'ALL' 
                ? dataList 
                : dataList.filter(b => b.category === currentCategory);

            if (filtered.length === 0) {
                $container.html(`
                    <div class="col-12 text-center py-5">
                        <i class="fa-solid fa-filter-circle-xmark fs-1 text-secondary opacity-50 mb-3"></i>
                        <h5 class="text-light">此情境分類目前尚無上架之調理套組</h5>
                        <p class="text-secondary small">請切換其他生活情境標籤，或點擊下方按鈕預約專屬客製化配方。</p>
                        <button class="btn btn-uvaco-outline btn-sm rounded-pill" onclick="$('.scenario-btn[data-category=ALL]').click()">
                            <i class="fa-solid fa-rotate-left"></i> 查看全部組合
                        </button>
                    </div>
                `);
                return;
            }

            filtered.forEach((bundle, idx) => {
                const costPerDay = Math.round(bundle.price_member / (bundle.days_supply || 30));
                const saveMoney = bundle.price_retail - bundle.price_member;

                let itemsHtml = '';
                bundle.items.forEach(item => {
                    itemsHtml += `
                        <div class="bundle-item-tile d-flex justify-content-between align-items-center mb-2">
                            <div class="d-flex align-items-center gap-2">
                                <div class="text-success"><i class="${item.icon || 'fa-solid fa-box'}"></i></div>
                                <div>
                                    <div class="text-light small fw-bold">${item.name}</div>
                                    <div class="text-secondary" style="font-size: 0.72rem;">規格：${item.spec}</div>
                                </div>
                            </div>
                            <span class="badge bg-dark border border-success border-opacity-25 text-success rounded-pill px-2">
                                x ${item.qty}
                            </span>
                        </div>
                    `;
                });

                const cardHtml = `
                    <div class="col-12 col-xl-6">
                        <div class="bundle-glass-panel p-3 p-md-4 h-100 d-flex flex-column justify-content-between position-relative">
                            
                            <div>
                                <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-3">
                                    <div>
                                        <span class="pod-hero-badge mb-1">
                                            <i class="fa-solid fa-award"></i> ${bundle.tag}
                                        </span>
                                        <h3 class="h4 font-serif-brand fw-bold text-white mb-0 mt-1">
                                            ${bundle.name}
                                        </h3>
                                    </div>
                                    <div class="text-end">
                                        <span class="badge bg-success bg-opacity-20 text-success border border-success border-opacity-25 small px-2 py-1">
                                            <i class="fa-solid fa-gem"></i> ${bundle.sv.toLocaleString()} SV 點數
                                        </span>
                                    </div>
                                </div>

                                <div class="p-2 px-3 rounded-3 mb-3" style="background: rgba(16, 185, 129, 0.06); border-left: 3px solid var(--uvaco-secondary);">
                                    <span class="text-secondary small fw-bold"><i class="fa-solid fa-user-check text-success"></i> 專為此族群設計：</span>
                                    <div class="text-light small mt-1">${bundle.target_audience}</div>
                                </div>

                                <div class="row g-3 my-2">
                                    <div class="col-12 col-md-6">
                                        <div class="text-secondary small fw-bold mb-2">
                                            <i class="fa-solid fa-boxes-stacked text-success"></i> 組合內含品項 (${bundle.days_supply}天份)：
                                        </div>
                                        ${itemsHtml}
                                        <div class="text-secondary mt-2" style="font-size: 0.72rem;">
                                            <i class="fa-solid fa-circle-info"></i> ${bundle.mechanism}
                                        </div>
                                    </div>

                                    <div class="col-12 col-md-6">
                                        <div class="text-secondary small fw-bold mb-2">
                                            <i class="fa-solid fa-clock-rotate-left text-warning"></i> 24-小時晝夜黃金時段：
                                        </div>
                                        <div class="timeline-container ps-4">
                                            <div class="timeline-node">
                                                <div class="timeline-dot"><i class="fa-solid fa-sun"></i></div>
                                                <div class="text-warning small fw-bold">晨起空腹 (甦醒啟動)</div>
                                                <div class="text-light" style="font-size: 0.78rem;">${bundle.routine_morning}</div>
                                            </div>
                                            <div class="timeline-node">
                                                <div class="timeline-dot"><i class="fa-solid fa-utensils"></i></div>
                                                <div class="text-success small fw-bold">午間餐前/後 (機能維持)</div>
                                                <div class="text-light" style="font-size: 0.78rem;">${bundle.routine_noon}</div>
                                            </div>
                                            <div class="timeline-node">
                                                <div class="timeline-dot"><i class="fa-solid fa-moon"></i></div>
                                                <div class="text-info small fw-bold">夜間睡前 (深層修護)</div>
                                                <div class="text-light" style="font-size: 0.78rem;">${bundle.routine_night}</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="mt-4 pt-3 border-top border-secondary border-opacity-25">
                                <div class="d-flex flex-column flex-sm-row justify-content-between align-items-center gap-3">
                                    <div class="daily-price-box w-100 w-sm-auto">
                                        <div class="d-flex align-items-baseline gap-2">
                                            <span class="text-secondary small">平均每日只需</span>
                                            <span class="h3 fw-bold text-warning mb-0">NT$ ${costPerDay}</span>
                                            <span class="text-secondary small">元</span>
                                        </div>
                                        <div class="text-secondary" style="font-size: 0.72rem;">
                                            會員特惠價 <span class="text-light fw-bold">NT$ ${bundle.price_member.toLocaleString()}</span> 
                                            <span class="text-decoration-line-through text-muted ms-1">NT$ ${bundle.price_retail.toLocaleString()}</span>
                                            <span class="text-success ms-1">(省下 $${saveMoney})</span>
                                        </div>
                                    </div>

                                    <div class="d-flex align-items-center gap-2 w-100 w-sm-auto justify-content-end">
                                        <button class="btn btn-uvaco-outline btn-sm rounded-3 py-2 px-3 text-nowrap" onclick="viewBundleDetail('${bundle.id}')">
                                            <i class="fa-solid fa-file-waveform"></i> 調理日程
                                        </button>
                                        <button class="btn btn-uvaco-accent btn-sm rounded-3 py-2 px-3 text-nowrap" onclick="consultThisBundle('${bundle.name}', ${bundle.price_member})">
                                            <i class="fa-solid fa-comments"></i> 預約評估
                                        </button>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                `;
                $container.append(cardHtml);
            });
        }

        // 5. 情境切換過濾器
        $(document).on('click', '.scenario-btn', function () {
            $('.scenario-btn').removeClass('active');
            $(this).addClass('active');
            currentCategory = $(this).data('category');
            renderBundles(rawBundleData);
        });

        // 6. 排序功能
        function sortBundles(type) {
            if (type === 'cost') {
                rawBundleData.sort((a, b) => (a.price_member / a.days_supply) - (b.price_member / b.days_supply));
            } else if (type === 'sv') {
                rawBundleData.sort((a, b) => b.sv - a.sv);
            } else {
                // 預設恢復
                rawBundleData = [...FALLBACK_BUNDLES];
            }
            renderBundles(rawBundleData);
        }

        // 7. 查看個別調理日程與調用 Modal
        let activeSelectedBundle = null;
        function viewBundleDetail(bundleId) {
            const b = rawBundleData.find(item => item.id === bundleId);
            if (!b) return;
            activeSelectedBundle = b;

            const costPerDay = Math.round(b.price_member / (b.days_supply || 30));

            const modalBody = `
                <div class="mb-3">
                    <span class="badge bg-warning text-dark mb-1">${b.tag}</span>
                    <h4 class="text-white font-serif-brand fw-bold">${b.name}</h4>
                    <p class="text-secondary small mb-3">${b.mechanism}</p>
                </div>
                
                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <div class="p-3 rounded-3 text-center" style="background: rgba(16,185,129,0.1); border: 1px solid var(--uvaco-border);">
                            <div class="text-secondary small">晨間甦醒</div>
                            <div class="text-success fw-bold small mt-1">${b.routine_morning}</div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="p-3 rounded-3 text-center" style="background: rgba(16,185,129,0.1); border: 1px solid var(--uvaco-border);">
                            <div class="text-secondary small">午間維持</div>
                            <div class="text-success fw-bold small mt-1">${b.routine_noon}</div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="p-3 rounded-3 text-center" style="background: rgba(16,185,129,0.1); border: 1px solid var(--uvaco-border);">
                            <div class="text-secondary small">夜間修護</div>
                            <div class="text-success fw-bold small mt-1">${b.routine_night}</div>
                        </div>
                    </div>
                </div>

                <div class="text-secondary small">
                    <i class="fa-solid fa-bell text-warning"></i> <strong>金牌導師叮嚀：</strong> 保健品非藥品，請維持連續 30~90 天完整調理週期，配合每日 2,000cc 溫水，發揮最佳生化協同吸收率。
                </div>
            `;

            const shareScript = `親愛的朋友 😊！\\n為您規劃的葡眾專屬【${b.name}】：\\n\\n☀️ 晨起空腹：${b.routine_morning}\\n🥗 午間餐後：${b.routine_noon}\\n🌙 夜間睡前：${b.routine_night}\\n\\n💡 30 天專屬調理特惠：NT$ ${b.price_member.toLocaleString()} 元（平均每天只要 NT$ ${costPerDay} 元）\\n持續給身體深層充電，找回輕盈活力！有任何細節隨時聊聊唷 ❤️`;

            $('#modalScheduleContent').html(modalBody);
            $('#scriptTextarea').val(shareScript.replace(/\\n/g, '\n'));

            const myModal = new bootstrap.Modal(document.getElementById('scheduleModal'));
            myModal.show();
        }

        function openScheduleModal() {
            if (rawBundleData.length > 0) {
                viewBundleDetail(rawBundleData[0].id);
            }
        }

        // 8. 複製推廣/備忘話術
        function copyScheduleScript() {
            const textarea = document.getElementById('scriptTextarea');
            textarea.select();
            document.execCommand('copy');
            const $btn = $('#btnCopyScript');
            const originalHtml = $btn.html();
            $btn.removeClass('btn-outline-success').addClass('btn-success text-white').html('<i class="fa-solid fa-check"></i> 已複製');
            setTimeout(() => {
                $btn.removeClass('btn-success text-white').addClass('btn-outline-success').html(originalHtml);
            }, 2000);
        }

        // 9. 預約單一套組諮詢
        function consultThisBundle(bundleName, price) {
            const text = `您好！我在【健康生活與自由日常】網站上看到了【${bundleName}】（NT$ ${price.toLocaleString()}），想進一步了解適合我的食用搭配與訂購方式！`;
            const encoded = encodeURIComponent(text);
            window.open(`https://line.me/R/oaMessage/@your_line_id/?${encoded}`, '_blank');
        }

        // 10. 初始化與非同步載入 Google 試算表（GViz 示範）
        $(document).ready(function () {
            // 預設載入模擬數據
            rawBundleData = [...FALLBACK_BUNDLES];
            setTimeout(() => {
                renderBundles(rawBundleData);
            }, 300);

            // 監聽手動重新同步按鈕
            $('#btnRefreshData').on('click', function () {
                const $btn = $(this);
                $btn.prop('disabled', true).html('<i class="fa-solid fa-spinner fa-spin"></i> 載入中...');
                
                // 模擬抓取試算表完成
                setTimeout(() => {
                    $btn.prop('disabled', false).html('<i class="fa-solid fa-arrows-rotate"></i> 同步最新配方');
                    renderBundles(rawBundleData);
                }, 800);
            });
        });
    </script>
</body>
</html>
